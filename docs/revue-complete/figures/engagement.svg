<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="595" viewBox="0 0 1180 595" role="img" aria-labelledby="titre desc">
<title id="titre">Avant un effet irréversible</title>
<desc id="desc">Un accusé ne vaut que pour la panne à laquelle son support survit. Pair absent : engagement automatique suspendu, réflexes ordinaires disponibles. Ni journal de réplication disque ni promesse universelle sans perte.</desc>
<defs><marker id="fleche" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#974e2c" stroke-width="1.4"/></marker></defs>
<rect width="1180" height="595" fill="#fbfaf6"/>
<text x="36" y="53" fill="#161512" font-family="Georgia,serif" font-size="30">Avant un effet irréversible</text>
<text x="36" y="89" fill="#57534b" font-family="sans-serif" font-size="17">Un accusé ne vaut que pour la panne à laquelle son support survit.</text>
<rect x="36.0" y="125" width="354.6666666666667" height="125" rx="4" fill="#f2f0ea" stroke="#d9d5c9"/>
<rect x="52.0" y="143" width="24" height="3" fill="#e8b931"/>
<text x="52.0" y="175" fill="#161512" font-family="sans-serif" font-size="19" font-weight="600">Intention identifiée</text>
<text x="52.0" y="205" fill="#57534b" font-family="sans-serif" font-size="16">Cible, empreinte et utilité</text>
<text x="52.0" y="228" fill="#57534b" font-family="sans-serif" font-size="16">Clé stable de l’engagement</text>
<rect x="412.6666666666667" y="125" width="354.6666666666667" height="125" rx="4" fill="#f2f0ea" stroke="#d9d5c9"/>
<rect x="428.6666666666667" y="143" width="24" height="3" fill="#e8b931"/>
<text x="428.6666666666667" y="175" fill="#161512" font-family="sans-serif" font-size="19" font-weight="600">File du gardien</text>
<text x="428.6666666666667" y="205" fill="#57534b" font-family="sans-serif" font-size="16">Écrite avant l’envoi</text>
<text x="428.6666666666667" y="228" fill="#57534b" font-family="sans-serif" font-size="16">Survit au crash du cœur</text>
<rect x="789.3333333333334" y="125" width="354.6666666666667" height="125" rx="4" fill="#f2f0ea" stroke="#d9d5c9"/>
<rect x="805.3333333333334" y="143" width="24" height="3" fill="#e8b931"/>
<text x="805.3333333333334" y="175" fill="#161512" font-family="sans-serif" font-size="19" font-weight="600">Copie chez un pair</text>
<text x="805.3333333333334" y="205" fill="#57534b" font-family="sans-serif" font-size="16">Accusé avant émission auto</text>
<text x="805.3333333333334" y="228" fill="#57534b" font-family="sans-serif" font-size="16">Survit à la perte de l’hôte</text>
<rect x="36.0" y="285" width="354.6666666666667" height="125" rx="4" fill="#fffefa" stroke="#d9d5c9"/>
<rect x="52.0" y="303" width="24" height="3" fill="#e8b931"/>
<text x="52.0" y="335" fill="#161512" font-family="sans-serif" font-size="19" font-weight="600">Garde vivante</text>
<text x="52.0" y="365" fill="#57534b" font-family="sans-serif" font-size="16">Droits et échéance relus</text>
<text x="52.0" y="388" fill="#57534b" font-family="sans-serif" font-size="16">Oui ponctuel si acte à un tiers</text>
<rect x="412.6666666666667" y="285" width="354.6666666666667" height="125" rx="4" fill="#fffefa" stroke="#d9d5c9"/>
<rect x="428.6666666666667" y="303" width="24" height="3" fill="#e8b931"/>
<text x="428.6666666666667" y="335" fill="#161512" font-family="sans-serif" font-size="19" font-weight="600">Émission unique</text>
<text x="428.6666666666667" y="365" fill="#57534b" font-family="sans-serif" font-size="16">Une fois vers le transport</text>
<text x="428.6666666666667" y="388" fill="#57534b" font-family="sans-serif" font-size="16">L’incertain ne se rejoue pas</text>
<rect x="789.3333333333334" y="285" width="354.6666666666667" height="125" rx="4" fill="#fffefa" stroke="#d9d5c9"/>
<rect x="805.3333333333334" y="303" width="24" height="3" fill="#e8b931"/>
<text x="805.3333333333334" y="335" fill="#161512" font-family="sans-serif" font-size="19" font-weight="600">Reçu ou statut</text>
<text x="805.3333333333334" y="365" fill="#57534b" font-family="sans-serif" font-size="16">Déduplication réellement prouvée</text>
<text x="805.3333333333334" y="388" fill="#57534b" font-family="sans-serif" font-size="16">Sinon : résultat incertain</text>
<line x1="36" y1="501" x2="1144" y2="501" stroke="#d9d5c9"/>
<text x="36" y="532" fill="#57534b" font-family="sans-serif" font-size="15">Pair absent : engagement automatique suspendu, réflexes ordinaires disponibles. Ni journal de réplication disque ni promesse</text>
<text x="36" y="555" fill="#57534b" font-family="sans-serif" font-size="15">universelle sans perte.</text>
<path d="M394 187.5 H407" fill="none" stroke="#974e2c" stroke-width="1.5" marker-end="url(#fleche)"/>
<path d="M771 187.5 H784" fill="none" stroke="#974e2c" stroke-width="1.5" marker-end="url(#fleche)"/>
<path d="M394 347.5 H407" fill="none" stroke="#974e2c" stroke-width="1.5" marker-end="url(#fleche)"/>
<path d="M771 347.5 H784" fill="none" stroke="#974e2c" stroke-width="1.5" marker-end="url(#fleche)"/>
<path d="M966.5 253 V267 H213.3 V279" fill="none" stroke="#974e2c" stroke-width="1.5" marker-end="url(#fleche)"/>
</svg>
