<text x="428.6666666666667" y="365" fill="#57534b" font-family="sans-serif" font-size="16">Branche autorisée, état actuel</text>
<text x="428.6666666666667" y="388" fill="#57534b" font-family="sans-serif" font-size="16">Échec et silence explicités</text>
