<text x="52.0" y="365" fill="#57534b" font-family="sans-serif" font-size="16">Produit typé et borné</text>
<text x="52.0" y="388" fill="#57534b" font-family="sans-serif" font-size="16">Aucun droit d’émission</text>
<rect x="412.6666666666667" y="285" width="354.6666666666667" height="125" rx="4" fill="#fffefa" stroke="#d9d5c9"/>
<rect x="428.6666666666667" y="303" width="24" height="3" fill="#e8b931"/>
