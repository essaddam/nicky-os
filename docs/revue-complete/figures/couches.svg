<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="595" viewBox="0 0 1180 595" role="img" aria-labelledby="titre desc">
<title id="titre">Pourquoi cet appareil prend cette consigne</title>
<desc id="desc">Une pile bornée de raisons remplace les restaurations concurrentes. Huit couches par point au plus. À rang égal : révision logique puis identité stable. La garde vérifie toujours la consigne effective.</desc>
<defs><marker id="fleche" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#974e2c" stroke-width="1.4"/></marker></defs>
<rect width="1180" height="595" fill="#fbfaf6"/>
<text x="36" y="53" fill="#161512" font-family="Georgia,serif" font-size="30">Pourquoi cet appareil prend cette consigne</text>
<text x="36" y="89" fill="#57534b" font-family="sans-serif" font-size="17">Une pile bornée de raisons remplace les restaurations concurrentes.</text>
<rect x="36.0" y="125" width="354.6666666666667" height="125" rx="4" fill="#f2f0ea" stroke="#d9d5c9"/>
<rect x="52.0" y="143" width="24" height="3" fill="#e8b931"/>
<text x="52.0" y="175" fill="#161512" font-family="sans-serif" font-size="19" font-weight="600">1. Sécurité admissible</text>
<text x="52.0" y="205" fill="#57534b" font-family="sans-serif" font-size="16">Protection prioritaire</text>
<text x="52.0" y="228" fill="#57534b" font-family="sans-serif" font-size="16">Jamais un droit supplémentaire</text>
<rect x="412.6666666666667" y="125" width="354.6666666666667" height="125" rx="4" fill="#f2f0ea" stroke="#d9d5c9"/>
<rect x="428.6666666666667" y="143" width="24" height="3" fill="#e8b931"/>
<text x="428.6666666666667" y="175" fill="#161512" font-family="sans-serif" font-size="19" font-weight="600">2. Geste humain</text>
<text x="428.6666666666667" y="205" fill="#57534b" font-family="sans-serif" font-size="16">Dérogation explicite</text>
<text x="428.6666666666667" y="228" fill="#57534b" font-family="sans-serif" font-size="16">Deux heures par défaut</text>
<rect x="789.3333333333334" y="125" width="354.6666666666667" height="125" rx="4" fill="#f2f0ea" stroke="#d9d5c9"/>
<rect x="805.3333333333334" y="143" width="24" height="3" fill="#e8b931"/>
<text x="805.3333333333334" y="175" fill="#161512" font-family="sans-serif" font-size="19" font-weight="600">3. Raison de maison</text>
<text x="805.3333333333334" y="205" fill="#57534b" font-family="sans-serif" font-size="16">Contexte et occupation</text>
<text x="805.3333333333334" y="228" fill="#57534b" font-family="sans-serif" font-size="16">Portée validée</text>
<rect x="36.0" y="285" width="354.6666666666667" height="125" rx="4" fill="#fffefa" stroke="#d9d5c9"/>
<rect x="52.0" y="303" width="24" height="3" fill="#e8b931"/>
<text x="52.0" y="335" fill="#161512" font-family="sans-serif" font-size="19" font-weight="600">4. Mode ou profil</text>
<text x="52.0" y="365" fill="#57534b" font-family="sans-serif" font-size="16">Session temporaire</text>
<text x="52.0" y="388" fill="#57534b" font-family="sans-serif" font-size="16">Retirer sa raison à la fin</text>
<rect x="412.6666666666667" y="285" width="354.6666666666667" height="125" rx="4" fill="#fffefa" stroke="#d9d5c9"/>
<rect x="428.6666666666667" y="303" width="24" height="3" fill="#e8b931"/>
<text x="428.6666666666667" y="335" fill="#161512" font-family="sans-serif" font-size="19" font-weight="600">5. Workflow ou planning</text>
<text x="428.6666666666667" y="365" fill="#57534b" font-family="sans-serif" font-size="16">Consigne déclarée</text>
<text x="428.6666666666667" y="388" fill="#57534b" font-family="sans-serif" font-size="16">Pas d’ordre événementiel restauré</text>
<rect x="789.3333333333334" y="285" width="354.6666666666667" height="125" rx="4" fill="#fffefa" stroke="#d9d5c9"/>
<rect x="805.3333333333334" y="303" width="24" height="3" fill="#e8b931"/>
<text x="805.3333333333334" y="335" fill="#161512" font-family="sans-serif" font-size="19" font-weight="600">6. Défaut de l’appareil</text>
<text x="805.3333333333334" y="365" fill="#57534b" font-family="sans-serif" font-size="16">Base connue avant le premier effet</text>
<text x="805.3333333333334" y="388" fill="#57534b" font-family="sans-serif" font-size="16">Pas de capture aveugle</text>
<line x1="36" y1="501" x2="1144" y2="501" stroke="#d9d5c9"/>
<text x="36" y="532" fill="#57534b" font-family="sans-serif" font-size="15">Huit couches par point au plus. À rang égal : révision logique puis identité stable. La garde vérifie toujours la consigne</text>
<text x="36" y="555" fill="#57534b" font-family="sans-serif" font-size="15">effective.</text>
</svg>
