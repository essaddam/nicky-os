<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="595" viewBox="0 0 1180 595" role="img" aria-labelledby="titre desc">
<title id="titre">L’identité dure, la place se réutilise</title>
<desc id="desc">Une référence de cache comprend l’incarnation et le numéro complet. Après la dernière génération, la place est condamnée. Une reprise obsolète sans pair change l’incarnation et invalide les caches.</desc>
<defs><marker id="fleche" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#974e2c" stroke-width="1.4"/></marker></defs>
<rect width="1180" height="595" fill="#fbfaf6"/>
<text x="36" y="53" fill="#161512" font-family="Georgia,serif" font-size="30">L’identité dure, la place se réutilise</text>
<text x="36" y="89" fill="#57534b" font-family="sans-serif" font-size="17">Une référence de cache comprend l’incarnation et le numéro complet.</text>
<rect x="36.0" y="125" width="354.6666666666667" height="125" rx="4" fill="#f2f0ea" stroke="#d9d5c9"/>
<rect x="52.0" y="143" width="24" height="3" fill="#e8b931"/>
<text x="52.0" y="175" fill="#161512" font-family="sans-serif" font-size="19" font-weight="600">En service</text>
<text x="52.0" y="205" fill="#57534b" font-family="sans-serif" font-size="16">Valeurs et usages actifs</text>
<text x="52.0" y="228" fill="#57534b" font-family="sans-serif" font-size="16">Nom métier stable</text>
<rect x="412.6666666666667" y="125" width="354.6666666666667" height="125" rx="4" fill="#f2f0ea" stroke="#d9d5c9"/>
<rect x="428.6666666666667" y="143" width="24" height="3" fill="#e8b931"/>
<text x="428.6666666666667" y="175" fill="#161512" font-family="sans-serif" font-size="19" font-weight="600">Absent</text>
<text x="428.6666666666667" y="205" fill="#57534b" font-family="sans-serif" font-size="16">L’intégration ne le voit plus</text>
<text x="428.6666666666667" y="228" fill="#57534b" font-family="sans-serif" font-size="16">Retour possible sans remplacement</text>
<rect x="789.3333333333334" y="125" width="354.6666666666667" height="125" rx="4" fill="#f2f0ea" stroke="#d9d5c9"/>
<rect x="805.3333333333334" y="143" width="24" height="3" fill="#e8b931"/>
<text x="805.3333333333334" y="175" fill="#161512" font-family="sans-serif" font-size="19" font-weight="600">Retiré</text>
<text x="805.3333333333334" y="205" fill="#57534b" font-family="sans-serif" font-size="16">Geste humain ; effets terminés</text>
<text x="805.3333333333334" y="228" fill="#57534b" font-family="sans-serif" font-size="16">Succession validée si remplaçant</text>
<rect x="36.0" y="285" width="354.6666666666667" height="125" rx="4" fill="#fffefa" stroke="#d9d5c9"/>
<rect x="52.0" y="303" width="24" height="3" fill="#e8b931"/>
<text x="52.0" y="335" fill="#161512" font-family="sans-serif" font-size="19" font-weight="600">Grâce : 30 jours</text>
<text x="52.0" y="365" fill="#57534b" font-family="sans-serif" font-size="16">Conserver le retrait et son lien</text>
<text x="52.0" y="388" fill="#57534b" font-family="sans-serif" font-size="16">Pas de libération immédiate</text>
<rect x="412.6666666666667" y="285" width="354.6666666666667" height="125" rx="4" fill="#fffefa" stroke="#d9d5c9"/>
<rect x="428.6666666666667" y="303" width="24" height="3" fill="#e8b931"/>
<text x="428.6666666666667" y="335" fill="#161512" font-family="sans-serif" font-size="19" font-weight="600">Lot actif atomique</text>
<text x="428.6666666666667" y="365" fill="#57534b" font-family="sans-serif" font-size="16">Zéro des fiches ; génération + 1</text>
<text x="428.6666666666667" y="388" fill="#57534b" font-family="sans-serif" font-size="16">Fragments reçus avant application</text>
<rect x="789.3333333333334" y="285" width="354.6666666666667" height="125" rx="4" fill="#fffefa" stroke="#d9d5c9"/>
<rect x="805.3333333333334" y="303" width="24" height="3" fill="#e8b931"/>
<text x="805.3333333333334" y="335" fill="#161512" font-family="sans-serif" font-size="19" font-weight="600">Réattribution</text>
<text x="805.3333333333334" y="365" fill="#57534b" font-family="sans-serif" font-size="16">Place 24 bits + génération 7 bits</text>
<text x="805.3333333333334" y="388" fill="#57534b" font-family="sans-serif" font-size="16">Numéro entier jamais redonné</text>
<line x1="36" y1="501" x2="1144" y2="501" stroke="#d9d5c9"/>
<text x="36" y="532" fill="#57534b" font-family="sans-serif" font-size="15">Après la dernière génération, la place est condamnée. Une reprise obsolète sans pair change l’incarnation et invalide les</text>
<text x="36" y="555" fill="#57534b" font-family="sans-serif" font-size="15">caches.</text>
</svg>
