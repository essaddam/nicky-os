<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="595" viewBox="0 0 1180 595" role="img" aria-labelledby="titre desc">
<title id="titre">Les données ont des propriétaires</title>
<desc id="desc">Une source de vérité par responsabilité ; aucune base ne décide à la place du hub. Le rang s du présent, le seq historique et les dates sont distincts. Les anciens point_state et state.json ne sont pas des autorités supplémentaires.</desc>
