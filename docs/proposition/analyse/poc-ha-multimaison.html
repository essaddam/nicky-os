erniers événements", "ha-poc.event": "Événement du banc", "ha-poc.no_events": "Aucun événement reçu.", "ha-poc.draft_invalid": "Aperçu indisponible : le brouillon JSON est invalide.", "ha-poc.no_data": "En attente des mesures du banc", "ha-poc.preview_active": "Actif prévu", "ha-poc.preview_passive": "Passif prévu", "ha-poc.automatic": "Automatique local", "ha-poc.manual": "Manuel"}, "en": {"ha-poc.title": "Two homes, one shared view", "ha-poc.eyebrow": "Moli · High availability bench", "ha-poc.subtitle": "Active at home. A replica for the other.", "ha-poc.notice": "Replay of both HA structures — simulated commands and failures", "ha-poc.notice_detail": "Descriptions come from two anonymised exports. No live physical state and no real commands.", "ha-poc.language": "Language", "ha-poc.fr": "French", "ha-poc.en": "English", "ha-poc.home_filter": "Displayed home", "ha-poc.all": "All homes", "ha-poc.house_a": "Home A", "ha-poc.house_b": "Home B", "ha-poc.cloud": "Cloud", "ha-poc.overview": "Which server carries each home?", "ha-poc.matrix_hint": "One role per home: both servers can be active at once, each for its own home.", "ha-poc.server": "Server", "ha-poc.active": "Active", "ha-poc.passive": "Passive", "ha-poc.offline": "Stopped", "ha-poc.absent": "No replica", "ha-poc.online": "Online", "ha-poc.isolated": "Isolated", "ha-poc.unknown": "Unavailable", "ha-poc.loading": "Connecting to the bench…", "ha-poc.connected": "Bench connected", "ha-poc.disconnected": "Bench unreachable · last received data", "ha-poc.waiting": "Apply a configuration to start the bench.", "ha-poc.settings": "Arrange replicas", "ha-poc.settings_hint": "Choose a layout, inspect its draft matrix, then start the simulation.", "ha-poc.enabled": "Enable high availability", "ha-poc.witness": "Use the bench witness", "ha-poc.preset": "Layout", "ha-poc.none": "No replicas", "ha-poc.cross": "Cross replicas", "ha-poc.local": "Local replicas", "ha-poc.cloud_preset": "Cloud replicas", "ha-poc.local_cloud": "Local and cloud", "ha-poc.advanced": "Advanced layout · JSON", "ha-poc.layout": "JSON topology draft", "ha-poc.draft_hint": "16 KiB maximum. Fictional IDs only, no addresses or secrets. The bench performs final validation.", "ha-poc.draft": "Draft · not applied yet", "ha-poc.draft_matrix": "Draft preview", "ha-poc.apply": "Apply and simulate", "ha-poc.export": "Export topology", "ha-poc.busy": "Action in progress…", "ha-poc.saved": "Configuration applied to the bench.", "ha-poc.done": "Simulated action completed.", "ha-poc.invalid": "Invalid layout: check the JSON IDs, references, fields and limits.", "ha-poc.error": "Action rejected or service unavailable. Your draft is preserved.", "ha-poc.owner": "Lease owner", "ha-poc.epoch": "Epoch", "ha-poc.sequence": "Sequence", "ha-poc.copies": "Replicas in sync", "ha-poc.scope": "Scope", "ha-poc.local_scope": "Local", "ha-poc.lease_valid": "Valid lease", "ha-poc.lease_invalid": "No valid lease", "ha-poc.synced": "In sync", "ha-poc.catching_up": "Catching up", "ha-poc.records": "Records", "ha-poc.document": "Document", "ha-poc.rss": "RSS memory", "ha-poc.allocator": "Live allocations", "ha-poc.cpu": "CPU · one core", "ha-poc.stop": "Stop", "ha-poc.restart": "Restart", "ha-poc.isolate": "Isolate", "ha-poc.heal": "Restore link", "ha-poc.promote": "Promote · simulation", "ha-poc.promotion_hint": "A remote replica only takes over cloud scope, on human request. No radio or local network capability is transferred.", "ha-poc.nodes": "Bench servers", "ha-poc.node_hint": "These buttons only control the bench processes and simulated links.", "ha-poc.effects": "Simulated effects", "ha-poc.rejected": "Rejected effects", "ha-poc.physical": "Physical commands", "ha-poc.source": "Replayed structure", "ha-poc.entities": "Entities", "ha-poc.points": "Points", "ha-poc.devices": "Devices", "ha-poc.limits": "What this bench does not prove", "ha-poc.limits_detail": "Local processes do not prove two real sites, a VPN, distributed quorum or clock qualification. The central witness is for simulation only. State and configuration stay in memory for this session.", "ha-poc.events": "Recent events", "ha-poc.event": "Bench event", "ha-poc.no_events": "No events received.", "ha-poc.draft_invalid": "Preview unavailable: the JSON draft is invalid.", "ha-poc.no_data": "Waiting for bench measurements", "ha-poc.preview_active": "Planned active", "ha-poc.preview_passive": "Planned passive", "ha-poc.automatic": "Local automatic", "ha-poc.manual": "Manual"}};
const base = location.pathname.startsWith('/ha') ? '/ha/api' : '/api';
let lang = new URLSearchParams(location.search).get('lang') === 'en' ? 'en' : 'fr';
const t = (key, values = {}) => Object.entries(values).reduce((text, [name,value]) => text.replaceAll('{'+name+'}', String(value)), MESSAGES[lang]['ha-poc.'+key] || MESSAGES.fr['ha-poc.'+key] || key);
const clone = value => JSON.parse(JSON.stringify(value));
const core = {enabled:true,witness:true,nodes:[{id:'node-a',site:'house-a',enabled:true},{id:'node-b',site:'house-b',enabled:true}],houses:[{id:'house-a',primary:'node-a',standbys:[{node:'node-b',automatic:false}]},{id:'house-b',primary:'node-b',standbys:[{node:'node-a',automatic:false}]}]};
function preset(name){
 const config = clone(core);
 if(name !== 'cross') for(const house of config.houses) house.standbys=[];
 if(name==='none'){config.enabled=false;config.witness=false;}
 if(name==='local'||name==='local-cloud') for(const suffix of ['a','b']){config.nodes.push({id:'node-local-'+suffix,site:'house-'+suffix,enabled:true});config.houses.find(h=>h.id==='house-'+suffix).standbys.push({node:'node-local-'+suffix,automatic:true});}
 if(name==='cloud'||name==='local-cloud'){config.nodes.push({id:'node-cloud',site:'cloud',enabled:true});for(const house of config.houses)house.standbys.push({node:'node-cloud',automatic:false});}
 return config;
}
const presets = Object.fromEntries(['none','cross','local','cloud','local-cloud'].map(name=>[name,preset(name)]));
let state=null, draftText=JSON.stringify(presets.cross,null,2), dirty=false, connected=false, busy=false, filter='all', generation=0;
function keysExactly(value, keys){return value && typeof value==='object' && !Array.isArray(value) && Object.keys(value).length===keys.length && keys.every(key=>Object.hasOwn(value,key));}
function parseDraft(text){
 if(new TextEncoder().encode(text).length>16384) throw Error('invalid');
 const c=JSON.parse(text), id=value=>typeof value==='string'&&/^[a-z][a-z0-9-]{0,47}$/.test(value);
 if(!keysExactly(c,['enabled','witness','nodes','houses'])||typeof c.enabled!=='boolean'||typeof c.witness!=='boolean'||!Array.isArray(c.nodes)||c.nodes.length<1||c.nodes.length>8||!Array.isArray(c.houses)||c.houses.length<1||c.houses.length>2)throw Error('invalid');
 const ids=new Set();for(const n of c.nodes){if(!keysExactly(n,['id','site','enabled'])||!id(n.id)||!id(n.site)||typeof n.enabled!=='boolean'||ids.has(n.id))throw Error('invalid');ids.add(n.id);}
 const houses=new Set();for(const h of c.houses){if(!keysExactly(h,['id','primary','standbys'])||!id(h.id)||houses.has(h.id)||!ids.has(h.primary)||!Array.isArray(h.standbys)||h.standbys.length>3)throw Error('invalid');houses.add(h.id);const holders=new Set([h.primary]);for(const s of h.standbys){if(!keysExactly(s,['node','automatic'])||!ids.has(s.node)||typeof s.automatic!=='boolean'||holders.has(s.node))throw Error('invalid');holders.add(s.node);if(s.automatic&&c.nodes.find(n=>n.id===s.node).site!==c.nodes.find(n=>n.id===h.primary).site)throw Error('invalid');}}
 return c;
}
function selectedHouses(houses,selection){return houses.filter(h=>selection==='all'||h.id===selection);}
function eligiblePromotion(copy,node,house){return house?.lease_valid!==true&&!!node&&node.online===true&&node.isolated!==true&&copy.role==='passive'&&copy.in_sync===true;}
function setStatus(next){state=next;if(!dirty&&next.topology)draftText=JSON.stringify(next.topology,null,2);}
// Browser wiring
const $=id=>document.getElementById(id);
const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const name=id=>id==='house-a'?t('house_a'):id==='house-b'?t('house_b'):id==='cloud'?t('cloud'):id||t('unknown');
const num=value=>typeof value==='number'&&Number.isFinite(value)?value.toLocaleString(lang,{maximumFractionDigits:1}):t('unknown');
const bytes=value=>typeof value==='number'&&Number.isFinite(value)?num(value/1024)+' KiB':t('unknown');
const pill=(key,kind=key)=>'<span class="pill '+esc(kind)+'">'+esc(t(key))+'</span>';
function feedback(key,error=false){$('feedback').textContent=t(key);$('feedback').classList.toggle('error',error);}
function stat(key,value){return '<div class="stat"><span>'+esc(t(key))+'</span><strong>'+esc(value)+'</strong></div>';}
function matrix(topology,live=false){
 if(!topology)return '<p class="empty">'+esc(t('loading'))+'</p>';
 const houses=selectedHouses(topology.houses,filter);
 return '<table><thead><tr><th scope="col">'+esc(t('server'))+'</th>'+houses.map(h=>'<th scope="col">'+esc(name(h.id))+'</th>').join('')+'</tr></thead><tbody>'+topology.nodes.map(n=>'<tr><td><div class="node-id">'+esc(n.id)+'</div><span class="small muted">'+esc(name(n.site))+'</span></td>'+houses.map(h=>{
 const copy=live?state?.houses?.find(item=>item.id===h.id)?.copies?.find(item=>item.node===n.id):null;
 const role=live?(copy?.role||'absent'):(h.primary===n.id?'preview_active':topology.enabled&&h.standbys.some(s=>s.node===n.id)?'preview_passive':'absent');
 return '<td>'+pill(role,role==='preview_active'?'active':role==='preview_passive'?'passive':role)+(copy?'<div class="small muted">'+esc(t(copy.in_sync?'synced':'catching_up'))+'</div>':'')+'</td>';
 }).join('')+'</tr>').join('')+'</tbody></table>';
}
function renderDraft(write=true){
 if(write&&$('layout').value!==draftText)$('layout').value=draftText;
 try{const draft=parseDraft(draftText);$('preview').innerHTML=matrix(draft);$('enabled').checked=draft.enabled;$('witness').checked=draft.witness;$('apply').disabled=busy;$('export').disabled=false;}
 catch{$('preview').textContent=t('draft_invalid');$('apply').disabled=true;$('export').disabled=true;}
 $('draft-status').textContent=dirty?t('draft'):'';
}
function actionButton(op,node){return '<button data-op="'+op+'" data-node="'+esc(node)+'" '+(!connected||busy?'disabled':'')+'>'+esc(t(op))+'</button>';}
function render(){
 const focused=document.activeElement?.dataset?.op?{...document.activeElement.dataset}:null;
 $('connection').textContent=t(connected?'connected':state?'disconnected':'loading');$('connection').classList.toggle('offline',!connected);
 $('matrix').innerHTML=matrix(state?.topology,true);
 $('houses').innerHTML=state?.configured?selectedHouses(state.houses||[],filter).map(h=>{
 const source=state.sources?.find(s=>s.house===h.id);
 return '<article class="card"><div class="row"><h2>'+esc(name(h.id))+'</h2>'+pill(h.lease_valid?'lease_valid':'lease_invalid',h.lease_valid?'good':'warning')+'</div><div class="hint">'+esc(t('owner'))+' · <strong>'+esc(h.owner||t('unknown'))+'</strong></div><div class="stats">'+stat('epoch',num(h.epoch))+stat('sequence',num(h.sequence))+stat('copies',num((h.copies||[]).filter(c=>c.in_sync).length)+' / '+num((h.copies||[]).length))+'</div><p class="hint">'+esc(t('scope'))+' · '+esc(t(h.scope==='cloud'?'cloud':'local_scope'))+'</p><div class="copies">'+(h.copies||[]).map(c=>{
 const node=state.nodes?.find(n=>n.id===c.node), spec=state.topology.houses.find(x=>x.id===h.id)?.standbys.find(s=>s.node===c.node);
 return '<div class="copy"><div class="row"><strong class="node-id">'+esc(c.node)+'</strong>'+pill(c.role,['active','passive','offline'].includes(c.role)?c.role:'warning')+'</div><p class="hint">'+esc(t(c.in_sync?'synced':'catching_up'))+' · '+esc(t('epoch'))+' '+esc(num(c.epoch))+' · '+esc(t('sequence'))+' '+esc(num(c.sequence))+'</p><p class="small muted">'+esc(t('records'))+' '+esc(num(c.records))+' · '+esc(t('document'))+' '+esc(bytes(c.document_bytes))+'</p>'+(spec&&!spec.automatic?'<div class="controls"><button data-op="promote" data-house="'+esc(h.id)+'" data-node="'+esc(c.node)+'" '+(!connected||busy||!eligiblePromotion(c,node,h)?'disabled':'')+'>'+esc(t('promote'))+'</button></div>':'')+'</div>';
 }).join('')+'</div>'+(source?'<p class="hint metrics">'+esc(t('source'))+' · '+esc(t('entities'))+' '+esc(num(source.entities))+' · '+esc(t('points'))+' '+esc(num(source.points))+' · '+esc(t('devices'))+' '+esc(num(source.devices))+'</p>':'')+'<p class="hint">'+esc(t('promotion_hint'))+'</p></article>';
 }).join(''):'<div class="card empty">'+esc(t(state?'waiting':'loading'))+'</div>';
 $('nodes').innerHTML=(state?.nodes||[]).map(n=>'<article class="metrics"><div class="row"><h3 class="node-id">'+esc(n.id)+'</h3>'+pill(!n.online?'offline':n.isolated?'isolated':'online',!n.online||n.isolated?'warning':'good')+'</div><p class="hint">'+esc(name(n.site))+'</p><div class="stats">'+stat('rss',bytes(n.rss_bytes))+stat('allocator',bytes(n.allocator_live_bytes))+stat('cpu',num(n.cpu_percent_one_core)+' %')+'</div><div class="controls">'+actionButton(n.online?'stop':'restart',n.id)+actionButton(n.isolated?'heal':'isolate',n.id)+'</div></article>').join('')||'<p class="empty">'+esc(t('no_data'))+'</p>';
 $('effects').innerHTML=stat('physical',num(state?.metrics?.physical_commands))+stat('effects',num(state?.metrics?.simulated_effects))+stat('rejected',num(state?.metrics?.rejected_effects));
 $('events').innerHTML=(state?.events||[]).slice(-8).reverse().map(e=>'<li>'+esc(t('event'))+' · '+esc(name(e.house))+' · '+esc(e.node||t('unknown'))+'</li>').join('')||'<li>'+esc(t('no_events'))+'</li>';
 renderDraft();
 if(focused){const next=[...document.querySelectorAll('button[data-op]')].find(el=>el.dataset.op===focused.op&&el.dataset.node===focused.node&&el.dataset.house===focused.house);if(next&&!next.disabled)next.focus({preventScroll:true});}
}
function translate(){document.documentElement.lang=lang;document.title=t('title');document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=t(el.dataset.i18n);});$('language').value=lang;render();}
async function request(path,body){
 const headers={};if(body!==undefined){headers['Content-Type']='application/json';if(location.pathname.startsWith('/ha')){const ticketResponse=await fetch('/api/socket-ticket',{credentials:'same-origin',cache:'no-store',signal:AbortSignal.timeout(8000)});if(!ticketResponse.ok)throw Error('error');const ticket=await ticketResponse.json();if(typeof ticket.ticket!=='string')throw Error('error');headers['x-moli-ticket']=ticket.ticket;}}
 const response=await fetch(base+path,{method:body===undefined?'GET':'POST',headers,credentials:'same-origin',cache:'no-store',signal:AbortSignal.timeout(8000),...(body===undefined?{}:{body:JSON.stringify(body)})});
 if(!response.ok)throw Error('error');return response.json();
}
async function refresh(){if(busy)return;const started=generation;try{const next=await request('/status');if(started!==generation)return;setStatus(next);connected=true;}catch{if(started!==generation)return;connected=false;}render();}
async function mutate(path,body,success){if(busy)return;generation++;busy=true;feedback('busy');render();try{const next=await request(path,body);setStatus(next);connected=true;feedback(success);return true;}catch{feedback('error',true);return false;}finally{busy=false;render();}}
$('language').addEventListener('change',e=>{lang=e.target.value;translate();});
$('house-filter').addEventListener('change',e=>{filter=e.target.value;render();});
$('preset').value='cross';$('preset').addEventListener('change',e=>{draftText=JSON.stringify(presets[e.target.value],null,2);dirty=true;renderDraft();});
$('layout').addEventListener('input',e=>{draftText=e.target.value;dirty=true;renderDraft(false);});
for(const id of ['enabled','witness'])$(id).addEventListener('change',()=>{try{const draft=parseDraft(draftText);draft[id]=$(id).checked;draftText=JSON.stringify(draft,null,2);dirty=true;renderDraft();}catch{feedback('invalid',true);}});
$('apply').addEventListener('click',async()=>{try{const submitted=draftText,topology=parseDraft(submitted);const applied=await mutate('/configure',{topology},'saved');if(applied&&draftText===submitted){dirty=false;draftText=JSON.stringify(state.topology||topology,null,2);renderDraft();}}catch{feedback('invalid',true);}});
$('export').addEventListener('click',()=>{try{const topology=parseDraft(draftText);const url=URL.createObjectURL(new Blob([JSON.stringify(topology,null,2)+'\n'],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='moli-ha-topology.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}catch{feedback('invalid',true);}});
document.addEventListener('click',e=>{const button=e.target.closest('button[data-op]');if(!button||button.disabled||!connected||busy)return;const body={op:button.dataset.op,node:button.dataset.node};if(body.op==='promote')body.house=button.dataset.house;void mutate('/action',body,'done');});
translate();
async function poll(){await refresh();setTimeout(poll,1000);}void poll();
</script>
</body></html>
