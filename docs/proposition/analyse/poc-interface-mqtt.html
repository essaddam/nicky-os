 draft.sentObservation=state.observation;draft.spec=field.spec;draft.sourceId=field.spec.source_channel??field.spec.state;draft.pending=true;draft.status='stateAwaited';
 const submittedRaw=draft.raw;
 state.client.publish(topic,body,{qos:0,retain:false},error=>{
  if(error&&draft.raw===submittedRaw&&draft.pending){draft.pending=false;draft.status='actionFailed'}
  if(state.detail===key(d.pont,d.id)){const latest=state.devices.get(state.detail)||d;renderCommandEditor(latest);renderOutputControls(latest)}
 });
 renderCommandEditor(d);return true;
}
function renderCommandEditor(d){
 const panel=$('command-editor');const fields=commandFields(d);
 const signature=JSON.stringify([state.lang,d.pont,d.id,fields.map(f=>[f.c.id,f.name,f.spec,f.c.commande.topic,f.c.commande.schema])]);
 if(panel.dataset.signature!==signature&&!panel.contains(document.activeElement)){
  panel.dataset.signature=signature;
  panel.innerHTML=fields.length?`<h3>${esc(t('deviceControls'))}</h3><p class="small">${esc(t('commandFeedbackHint'))}</p>`+fields.map(f=>`<form class="command-field" data-command-form="${esc(f.id)}"><label><b>${esc(f.c.nom||f.c.id)} · ${esc(parameterLabel(f.name))}</b>${parameterInput(f)}</label><span class="small" data-command-current></span><span class="small" data-command-state></span><button class="primary" type="submit">${esc(t('sendParameter'))}</button></form>`).join(''):'';
  for(const form of panel.querySelectorAll('[data-command-form]')){
   const input=form.querySelector('[data-command-input]');
   input.onblur=()=>setTimeout(()=>{if(state.detail===key(d.pont,d.id))renderCommandEditor(state.devices.get(state.detail)||d)},0);
   input.oninput=()=>{const field=fields.find(f=>f.id===form.dataset.commandForm);const draft=commandDraft(field);draft.raw=input.value;draft.status='draft';draft.pending=false;renderCommandEditor(state.devices.get(key(d.pont,d.id))||d)};
   form.onsubmit=event=>{event.preventDefault();const latest=state.devices.get(key(d.pont,d.id));const field=latest&&commandFields(latest).find(f=>f.id===form.dataset.commandForm);if(field)publishParameter(latest,field)};
  }
 }
 for(const form of panel.querySelectorAll('[data-command-form]')){
  const field=fields.find(f=>f.id===form.dataset.commandForm);if(!field)continue;
  const current=sourceChannel(d,field.spec);
  form.querySelector('[data-command-current]').textContent=`${t('currentValue')} : ${current?channelValue(current):t('feedbackUnavailable')}`;
  form.querySelector('[data-command-state]').textContent=t(commandDraft(field).status);
 }
}
function positionTimestamp(value){
 let timestamp;
 if(typeof value==='number'&&Number.isFinite(value))timestamp=Math.abs(value)<1e12?value*1000:value;
 else if(typeof value==='string'&&value.trim())timestamp=Date.parse(value);
 if(!Number.isFinite(timestamp))return null;
 const date=new Date(timestamp);if(!Number.isFinite(date.getTime()))return null;
 const seconds=(timestamp-Date.now())/1000;
 const unit=Math.abs(seconds)>=86400?'day':Math.abs(seconds)>=3600?'hour':Math.abs(seconds)>=60?'minute':'second';
 const divisor={day:86400,hour:3600,minute:60,second:1}[unit];
 return `${date.toLocaleString(state.lang)} · ${new Intl.RelativeTimeFormat(state.lang,{numeric:'auto'}).format(Math.round(seconds/divisor),unit)}`;
}
function observedMediaValue(c){
 if(c.semantique==='media_position_updated_at')return positionTimestamp(nativeChannelValue(c))??channelValue(c);
 return channelValue(c);
}
function renderDevicePanel(d){
 const channels=d.canaux||[];const domains=new Set(channels.map(c=>c.domaine));
 const types=['cover','water_heater','media_player'].filter(type=>domains.has(type));
 $('device-panel').innerHTML=types.map(type=>{
  const known=channels.filter(c=>c.domaine===type&&c.valeur!=null);
  const hasCommand=commandFields(d).some(field=>field.c.domaine===type);
  return `<article class="device-observation"><h3>${esc(t(type==='cover'?'coverPanel':type==='water_heater'?'waterHeaterPanel':'mediaPanel'))}</h3><p class="small">${esc(t(type==='media_player'?'mediaObservation':hasCommand?'declaredCommands':'commandNotConnected'))}</p><dl>${known.map(c=>`<dt>${esc(channelLabel(c))}</dt><dd>${esc(type==='media_player'?observedMediaValue(c):channelValue(c))}</dd>`).join('')||`<dd>${esc(t('pending'))}</dd>`}</dl></article>`;
 }).join('');
}

function showDetail(id,open=true){const d=state.devices.get(id);if(!d)return;state.detail=id;$('detail-title').textContent=d.nom||t('unnamed');const room=state.nodes.get(key(d.pont,d.piece));$('detail-sub').textContent=`${t(d.genre==='physique'?'physical':'standalone')} · ${room?.nom||t('unassigned')} · ${(d.canaux||[]).length} ${t('channels')}`;$('channel-rows').innerHTML=(d.canaux||[]).map(c=>{const room=state.nodes.get(key(d.pont,c.piece));return`<tr><td>${esc(c.semantique==='app_id'&&c.encodage==='enum'?channelLabel(c):c.nom)}<small>${esc(room?.nom||t('unassigned'))} · ${esc(channelLabel(c))}</small></td><td>${esc(channelValue(c))}</td><td>${esc(c.unite||'—')}</td><td><span title="${esc(quality(c))}">${esc(quality(c))}</span></td></tr>`}).join('');renderDevicePanel(d);renderOutputControls(d);renderColorControls(d);renderCommandEditor(d);if(open&&!$('detail').open)$('detail').showModal()}
function scheduleRender(){if(state.renderPending)return;state.renderPending=true;setTimeout(render,100)}
function consumeChannel(payload){
 payload={...payload,_observation:++state.observation};
 if(payload.encodage==='enum')resolveChannelEnum(payload);
 const config=state.configs.get(payload.pont);const metadata=config?.canaux?.[payload.id];
 if(!metadata?.appareil){if(state.orphanChannels.size<16384)state.orphanChannels.set(key(payload.pont,payload.id),payload);return}
 const id=key(payload.pont,metadata.appareil);const d=state.devices.get(id)||{pont:payload.pont,id:metadata.appareil,canaux:[]};
 const channels=new Map((d.canaux||[]).map(c=>[c.id,c]));channels.set(payload.id,payload);
 state.devices.set(id,hydrateDevice({...d,v:3,canaux:[...channels.values()]}));
 updateCommandFeedback(payload);updateColorFeedback(payload);
 if(state.detail&&state.detail!==id&&$('detail').open){const viewed=state.devices.get(state.detail);if(viewed){renderCommandEditor(viewed);refreshColorPanels(viewed)}}
 if(state.detail===id&&$('detail').open)showDetail(id,false);
}
function consume(topic,payload,retained=false){
  if(retained&&payload?.type==='canal')payload={...payload,retenu:true,qualite:payload.qualite==='absent'?'absent':payload.valeur==null?'inconnu':'retained_age_inconnu'};
  if(!payload||typeof payload!=='object')return;
  if(![2,3].includes(payload.v)){if(payload.nom&&!state.nodes.size){state.legacy=true;$('notice').hidden=false;$('notice').textContent=t('legacy')}return}
  const pont=payload.pont;if(typeof pont!=='string')return;
  state.legacy=false;$('notice').hidden=true;
  if(topic.endsWith('/config')){
    state.configs.set(pont,payload);rememberEnumCatalogues(pont,payload.catalogues);
    for(const n of payload.noeuds||[]){const k=key(pont,n.id);state.nodes.set(k,hydrateNode({...n,pont,...state.nodes.get(k)}))}
    for(const d of payload.appareils||[]){const k=key(pont,d.id);state.devices.set(k,hydrateDevice({...d,pont,...state.devices.get(k)}))}
    if(state.systems.has(pont))state.systems.set(pont,hydrateSystem(state.systems.get(pont)));
    for(const [id,c] of state.orphanChannels)if(c.pont===pont){state.orphanChannels.delete(id);consumeChannel(c)}
    for(const [id,channel]of state.enumPending)if(channel.pont===pont){const resolved=resolveChannelEnum(channel);if(resolved.status!=='enumWaiting'){state.enumPending.delete(id);updateCommandFeedback(channel)}}
    if(state.detail&&$('detail').open)showDetail(state.detail,false);
  }else if(payload.type==='noeud'){
    state.nodes.set(key(pont,payload.id),hydrateNode({...state.nodes.get(key(pont,payload.id)),...payload}));
  }else if(payload.type==='canal'){consumeChannel(payload);
  }else if(payload.type==='appareil'){
    payload={...payload,canaux:(payload.canaux||[]).map(channel=>({...channel,pont,_observation:++state.observation}))};
    state.devices.set(key(pont,payload.id),hydrateDevice(payload));
    for(const channel of payload.canaux||[]){const update={...channel,pont,retenu:retained||channel.retenu};updateCommandFeedback(update);updateColorFeedback(update)}
    if(state.detail===key(pont,payload.id)&&$('detail').open)showDetail(state.detail,false);refreshColorPanels(state.devices.get(key(pont,payload.id)));
  }else if(payload.type==='commande_resultat'){if(!payload.ok)actionStatus(t('actionFailed'),true);return;
  }else if(payload.type==='systeme'){
    state.systems.set(pont,hydrateSystem(payload));if(state.view==='systeme')renderSystems();return;
  }else return;
  if(state.lighting&&$('lighting-dialog').open){if(document.activeElement?.tagName!=='INPUT')renderLightsDialog();else{const light=lightForKey(state.lighting.id);if(light)refreshColorPanels(light.d)}}
  scheduleRender();
}

for(const nav of document.querySelectorAll('[data-view]'))nav.onclick=()=>{state.view=nav.dataset.view;state.room=null;render()};$('search').oninput=()=>{state.query=$('search').value;render()};$('language').onchange=()=>{state.lang=$('language').value;applyLanguage()};$('close').onclick=()=>$('detail').close();$('detail').addEventListener('close',()=>state.detail=null);
const servedOverHttp=['http:','https:'].includes(location.protocol);
function updateConnectionStatus(){
 if(globalThis.navigator?.onLine===false){$('status').textContent=t('offline');return}
 let text=t(state.statusKey);
 if(state.connected&&['snapshotWaiting','noSnapshot'].includes(state.statusKey)){
  const rooms=[...state.nodes.values()].filter(n=>n.genre==='piece').length;
  const channels=[...state.devices.values()].reduce((count,d)=>count+(d.canaux||[]).length,0);
  text=rooms||channels?`${countLabel(rooms,'rooms')} · ${countLabel(channels,'channels')}`:t(state.snapshotTimedOut?'noSnapshot':'snapshotWaiting');
 }
 $('status').textContent=text;
}
function connectionStatus(statusKey){state.statusKey=statusKey;updateConnectionStatus()}
function clearConnectionTimers(session){
 for(const timer of ['retryTimer','ticketTimer','snapshotTimer']){clearTimeout(session[timer]);session[timer]=null}
}
function stopConnection(statusKey='disconnected'){
 const session=state.connectionSession;state.connectionSession=null;
 if(session){clearConnectionTimers(session);session.ticket=null;session.controller?.abort()}
 const client=state.client;state.client=null;state.connected=false;
 if(client){client.end(true);client.options.password=undefined;client.options.username=undefined}
 $('connect').textContent=t('connect');$('connection-badge').classList.remove('connected');
 $('connection').open=true;connectionStatus(statusKey);render();
}
function socketUrl(session){
 const url=new URL('mqtt',location.href);url.protocol=location.protocol==='https:'?'wss:':'ws:';
 url.searchParams.set('ticket',session.ticket);return url.href;
}
async function refreshSocketTicket(session){
 if(!servedOverHttp)return;
 if(globalThis.navigator?.onLine===false)throw new Error('offline');
 if(session.ticketRequest)return session.ticketRequest;
 session.ticketRequest=(async()=>{
  const controller=new AbortController();session.controller=controller;
  const timeout=setTimeout(()=>controller.abort(),10000);
  try{
   const ticketUrl=new URL('api/socket-ticket',location.href);ticketUrl.searchParams.set('origin',location.origin);
   const response=await fetch(ticketUrl,{cache:'no-store',credentials:'same-origin',signal:controller.signal});
   if(!response.ok)throw new Error('ticket');
   const payload=await response.json();
   const expiresAt=typeof payload.expiresAt==='number'?payload.expiresAt:Date.parse(payload.expiresAt);
   if(typeof payload.ticket!=='string'||!payload.ticket||!Number.isFinite(expiresAt)||expiresAt<=Date.now()+1000)throw new Error('ticket');
   if(state.connectionSession!==session)return;
   session.ticket=payload.ticket;session.expiresAt=expiresAt;
   clearTimeout(session.ticketTimer);
   const lifetime=expiresAt-Date.now();
   session.ticketTimer=setTimeout(()=>renewSocketTicket(session),Math.max(500,lifetime-Math.min(10000,lifetime/2)));
  }finally{clearTimeout(timeout);session.controller=null}
 })();
 try{await session.ticketRequest}finally{session.ticketRequest=null}
}
async function renewSocketTicket(session){
 if(state.connectionSession!==session)return;
 try{await refreshSocketTicket(session)}catch{
  if(state.connectionSession===session)session.ticketTimer=setTimeout(()=>renewSocketTicket(session),3000);
 }
}
function retryConnection(session){
 if(state.connectionSession!==session||session.retryTimer)return;
 session.retryTimer=setTimeout(async()=>{
  session.retryTimer=null;if(state.connectionSession!==session)return;
  if(globalThis.navigator?.onLine===false){connectionStatus('offline');retryConnection(session);return}
  try{
   await refreshSocketTicket(session);
   if(state.connectionSession===session){connectionStatus('connecting');state.client.reconnect()}
  }catch{if(state.connectionSession===session){connectionStatus('ticketError');retryConnection(session)}}
 },3000);
}
function subscribeToSnapshot(client,session){
 client.subscribe(['moli-probe/runtime/#','moli-probe/maison/#'],{qos:1},(error,granted)=>{
  if(state.client!==client)return;
  if(error||!granted?.length||granted.some(subscription=>subscription.qos===128)){
   connectionStatus('subscriptionError');$('connection').open=true;return;
  }
  session.snapshotTimer=setTimeout(()=>{
   if(state.client===client){state.snapshotTimedOut=true;updateConnectionStatus();render()}
  },10000);
 });
}
function bindMqttClient(client,session){
 client.on('connect',()=>{
  if(state.client!==client)return;
  clearConnectionTimers(session);
  if(servedOverHttp)renewSocketTicket(session);
  state.connected=true;state.snapshotTimedOut=false;connectionStatus('snapshotWaiting');
  $('connection-badge').classList.add('connected');$('connection').open=false;
  subscribeToSnapshot(client,session);render();
 });
 client.on('message',(topic,payload,packet)=>{
  if(state.client!==client||payload.length>4*1024*1024)return;
  try{
   if(!payload.length){
    state.nodes.delete([...state.nodes].find(([,n])=>n.topic===topic)?.[0]);
    state.devices.delete([...state.devices].find(([,d])=>d.topic===topic)?.[0]);scheduleRender();return;
   }
   consume(topic,JSON.parse(payload.toString()),packet?.retain===true);
  }catch{$('notice').hidden=false;$('notice').textContent=t('transportError')}
 });
 client.on('error',error=>{
  if(state.client!==client)return;
  if([4,5,134,135].includes(error.code)){
   stopConnection('authRejected');$('password').focus();return;
  }
  connectionStatus('transportError');$('connection').open=true;
 });
 client.on('close',()=>{
  if(state.client!==client)return;
  state.connected=false;clearTimeout(session.snapshotTimer);
  $('connection-badge').classList.remove('connected');
  if(state.statusKey!=='transportError')connectionStatus('disconnected');
  retryConnection(session);
 });
}
$('connect-form').onsubmit=async event=>{
 event.preventDefault();
 if(state.connectionSession){stopConnection();return}
 if(globalThis.navigator?.onLine===false){connectionStatus('offline');return}
 if(!window.mqtt){connectionStatus('noLibrary');return}
 if(servedOverHttp&&(!$('username').value||!$('password').value)){connectionStatus('credentialsRequired');return}
 const host=$('host').value.trim();const port=Number($('port').value);
 if(!servedOverHttp&&(!Number.isInteger(port)||port<1||port>65535))return;
 const session={ticket:null};state.connectionSession=session;
 $('connect').textContent=t('disconnect');connectionStatus('connecting');
 state.enumPending.clear();state.enumCatalogues.clear();state.enumDescriptions=new WeakSet();state.observation=0;state.colorDrafts.clear();state.commandDrafts.clear();state.nodes.clear();state.devices.clear();state.systems.clear();state.configs.clear();state.orphanChannels.clear();state.room=null;render();
 try{
  await refreshSocketTicket(session);
  if(state.connectionSession!==session)return;
  const options={username:$('username').value,password:$('password').value,
   clientId:`moli-poc-${globalThis.crypto?.randomUUID?.()||Date.now().toString(16)+Math.random().toString(16).slice(2)}`,
   reconnectPeriod:0,queueQoSZero:false,reconnectOnConnackError:false,resubscribe:false,clean:true};
  if(servedOverHttp){options.transformWsUrl=()=>socketUrl(session);options.createWebsocket=url=>new WebSocket(url)}
  const client=mqtt.connect(servedOverHttp?socketUrl(session):`ws://${host}:${port}/`,options);
  state.client=client;$('password').value='';bindMqttClient(client,session);
 }catch{
  if(state.connectionSession===session)stopConnection(servedOverHttp?'ticketError':'transportError');
 }
};
function updateNetworkNotice(){
 const offline=globalThis.navigator?.onLine===false;
 $('offline-notice').hidden=!offline;updateConnectionStatus();
 if(offline){$('connection-badge').classList.remove('connected')}else if(state.connected)$('connection-badge').classList.add('connected');
}
window.addEventListener('offline',updateNetworkNotice);window.addEventListener('online',updateNetworkNotice);
if('serviceWorker' in navigator&&globalThis.isSecureContext&&['http:','https:'].includes(location.protocol)){
 window.addEventListener('load',()=>{navigator.serviceWorker.register(new URL('service-worker.js',location.href),{scope:new URL('./',location.href).href,updateViaCache:'none'}).catch(()=>{})});
}
$('lighting-close').onclick=()=>$('lighting-dialog').close();$('lighting-dialog').addEventListener('close',()=>state.lighting=null);
applyLanguage();updateNetworkNotice();

if(location.protocol.startsWith('http')){
 $('host').value=location.hostname;$('port').value=location.port||'1414';
 $('host').closest('label').hidden=true;$('port').closest('label').hidden=true;

}
