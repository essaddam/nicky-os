          <path d="M18 88 V62 a8 8 0 0 1 8 -8 H322 a8 8 0 0 1 8 8 V88 z" fill="url(#clients-h-gris)"/>
          <g transform="translate(30.0 62.0) scale(0.7500)" fill="none" stroke="#ffffff" stroke-width="2.53" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18v11H3z M8 20h8 M12 16v4"/></g>
          <text x="56.0" y="76.5" font-size="13" fill="#ffffff" font-weight="700">Aujourd'hui</text>
          <text x="318.0" y="76.5" font-size="10" fill="#ffffff" text-anchor="end" opacity=".9">SSE + REST</text>
          <rect x="18" y="118" width="312" height="98" rx="12" fill="url(#clients-f-gris)" stroke="#97a39d" stroke-opacity=".55" stroke-width="1.1" filter="url(#clients-o)"/>
          <circle cx="33" cy="137" r="4.5" fill="url(#clients-h-gris)"/>
          <text x="45.0" y="141.0" font-size="11.5" fill="#4f5d57" font-weight="700">Comment</text>
          <text x="32.0" y="159.0" font-size="10.2" fill="#52615a">GET /api/snapshot : toute la maison en JSON</text>
          <text x="32.0" y="174.0" font-size="10.2" fill="#52615a">puis un flux SSE ; l'ordre par REST</text>
          <text x="32.0" y="189.0" font-size="10.2" fill="#52615a">un trou : tout recharger</text>
          <ellipse cx="508.0" cy="111.0" rx="170.0" ry="11" fill="url(#clients-sol)"/>
          <polygon points="350,54 366,45.2 672,45.2 656,54" fill="url(#clients-t-ardoise)"/>
          <polygon points="656,54 672,45.2 672,89.2 656,104" fill="url(#clients-s-ardoise)"/>
          <rect x="344" y="54" width="312" height="50" rx="8" fill="url(#clients-f-ardoise)" stroke="#7494bb" stroke-opacity=".5"/>
          <path d="M344 88 V62 a8 8 0 0 1 8 -8 H648 a8 8 0 0 1 8 8 V88 z" fill="url(#clients-h-ardoise)"/>
          <g transform="translate(356.0 62.0) scale(0.7500)" fill="none" stroke="#ffffff" stroke-width="2.53" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18v11H3z M8 20h8 M12 16v4"/></g>
          <text x="382.0" y="76.5" font-size="13" fill="#ffffff" font-weight="700">La V7</text>
          <text x="644.0" y="76.5" font-size="10" fill="#ffffff" text-anchor="end" opacity=".9">un module WebSocket</text>
          <rect x="344" y="118" width="312" height="98" rx="12" fill="url(#clients-f-ardoise)" stroke="#7494bb" stroke-opacity=".55" stroke-width="1.1" filter="url(#clients-o)"/>
          <circle cx="359" cy="137" r="4.5" fill="url(#clients-h-ardoise)"/>
          <text x="371.0" y="141.0" font-size="11.5" fill="#3b5676" font-weight="700">Comment</text>
          <text x="358.0" y="159.0" font-size="10.2" fill="#52615a">l'état filtré, par blocs de 64 Kio</text>
          <text x="358.0" y="174.0" font-size="10.2" fill="#52615a">un module traduit MQTT en trames</text>
          <text x="358.0" y="189.0" font-size="10.2" fill="#52615a">ordres et issues sur la connexion</text>
          <ellipse cx="834.0" cy="111.0" rx="170.0" ry="11" fill="url(#clients-sol)"/>
          <polygon points="676,54 692,45.2 998,45.2 982,54" fill="url(#clients-t-vert)"/>
          <polygon points="982,54 998,45.2 998,89.2 982,104" fill="url(#clients-s-vert)"/>
          <rect x="670" y="54" width="312" height="50" rx="8" fill="url(#clients-f-vert)" stroke="#3d9a75" stroke-opacity=".5"/>
          <path d="M670 88 V62 a8 8 0 0 1 8 -8 H974 a8 8 0 0 1 8 8 V88 z" fill="url(#clients-h-vert)"/>
          <g transform="translate(682.0 62.0) scale(0.7500)" fill="none" stroke="#ffffff" stroke-width="2.53" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18v11H3z M8 20h8 M12 16v4"/></g>
          <text x="708.0" y="76.5" font-size="13" fill="#ffffff" font-weight="700">L'analyse</text>
          <text x="970.0" y="76.5" font-size="10" fill="#ffffff" text-anchor="end" opacity=".9">MQTT, directement</text>
          <rect x="670" y="118" width="312" height="98" rx="12" fill="url(#clients-f-vert)" stroke="#3d9a75" stroke-opacity=".55" stroke-width="1.1" filter="url(#clients-o)"/>
          <circle cx="685" cy="137" r="4.5" fill="url(#clients-h-vert)"/>
          <text x="697.0" y="141.0" font-size="11.5" fill="#195744" font-weight="700">Comment</text>
          <text x="684.0" y="159.0" font-size="10.2" fill="#52615a">etat/demande → l'état du client, filtré</text>
          <text x="684.0" y="174.0" font-size="10.2" fill="#52615a">meta/, ord/, val/ : le flux, au rang s</text>
          <text x="684.0" y="189.0" font-size="10.2" fill="#52615a">req/ du compte, res/&lt;client&gt;</text>
          <text x="18.0" y="246.0" font-size="11" fill="#1d302a" font-weight="700">Ce qu'un écran charge pour démarrer, maison ×1</text>
          <text x="18.0" y="274.0" font-size="10.5" fill="#1d302a">Aujourd'hui : /api/snapshot, JSON</text>
          <rect x="330.0" y="262.0" width="600.0" height="16" rx="6" fill="url(#clients-b-gris)"/>
          <rect x="332.0" y="264.0" width="596.0" height="6.1" rx="5" fill="#ffffff" opacity=".2"/>
          <text x="936.0" y="275.0" font-size="10.5" fill="#4f5d57" font-weight="700">631 Ko</text>
          <text x="18.0" y="304.0" font-size="10.5" fill="#1d302a">MQTT : l'état complet d'un écran</text>
          <rect x="330.0" y="292.0" width="111.7" height="16" rx="6" fill="url(#clients-b-vert)"/>
          <rect x="332.0" y="294.0" width="107.7" height="6.1" rx="5" fill="#ffffff" opacity=".2"/>
          <text x="447.7" y="305.0" font-size="10.5" fill="#195744" font-weight="700">118 Ko</text>
          <text x="18.0" y="334.0" font-size="10.5" fill="#1d302a">MQTT : un écran de deux pièces, un invité</text>
          <rect x="330.0" y="322.0" width="19.7" height="16" rx="6" fill="url(#clients-b-bleu)"/>
          <rect x="332.0" y="324.0" width="15.7" height="6.1" rx="5" fill="#ffffff" opacity=".2"/>
          <text x="355.7" y="335.0" font-size="10.5" fill="#1b5873" font-weight="700">21 Ko</text>
          <rect x="16" y="360" width="968" height="36" rx="12" fill="#e3f1e9" stroke="#3d9a75" stroke-opacity=".5"/>
          <g transform="translate(28.0 368.0) scale(0.8333)" fill="none" stroke="#195744" stroke-width="2.64" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></g>
          <text x="56.0" y="382.0" font-size="11" fill="#1d302a" font-weight="700">Un écran devient une copie partielle : le même état complet, le même rang s, la même règle du numéro inconnu que le secours ; l'historique et les médias restent en HTTP.</text>
  <text x="18" y="437" font-size="12" fill="#52615a" font-style="italic">Ta remarque : puisque tout est en mémoire, l'appareil, ses ordres et ses valeurs, un client peut se recharger par MQTT, sans module dédié. Ce qu'il en</text>
  <text x="18" y="454" font-size="12" fill="#52615a" font-style="italic">coûte par connexion est au § 14.4.</text>
</svg>
