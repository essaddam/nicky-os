<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460" role="img" aria-labelledby="clients-t clients-d" font-family="Avenir Next, Avenir, Segoe UI, sans-serif">
  <title id="clients-t">Les clients se chargent par MQTT</title>
  <desc id="clients-d">Trois façons de servir un écran. Aujourd'hui : toute la maison en JSON par /api/snapshot, puis un flux SSE, l'ordre par REST ; un trou fait tout recharger. La V7 : un module WebSocket qui envoie l'état filtré par blocs et traduit MQTT en trames. L'analyse : l'écran parle MQTT directement ; il demande son état sur etat/, filtré par ses droits, puis suit meta/, ord/ et val/ au rang s ; il publie ses demandes sur req/ avec son compte et reçoit ses issues sur res/. Ce qu'un écran charge pour démarrer, maison ×1 : 631 Ko de JSON aujourd'hui, 118 Ko par MQTT, 21 Ko pour un écran de deux pièces.</desc>
  <style>.hd-flux{stroke-dasharray:1.5 11;stroke-linecap:round;animation:hd-flux 1.2s linear infinite}.hd-lent{stroke-dasharray:1.5 13;stroke-linecap:round;animation:hd-lent 2.6s linear infinite}.hd-pouls{animation:hd-pouls 1.6s ease-in-out infinite}@keyframes hd-flux{to{stroke-dashoffset:-12.5}}@keyframes hd-lent{to{stroke-dashoffset:-14.5}}@keyframes hd-pouls{0%,100%{opacity:.3}50%{opacity:1}}@media (prefers-reduced-motion:reduce){.hd-flux,.hd-lent,.hd-pouls{animation:none}}</style>
