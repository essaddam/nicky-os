          <path class="hd-flux" d="M665 296 L695 296" fill="none" stroke="#ffffff" stroke-opacity=".95" stroke-width="1.3"/>
  <text x="18" y="433" font-size="12" fill="#52615a" font-style="italic">Une règle sur un ordre est une règle de 16 octets, comme une règle sur une valeur : son numéro est celui d'un ordre. Le « geste à la main » se voit</text>
  <text x="18" y="450" font-size="12" fill="#52615a" font-style="italic">parce que l'instant « changé » de la valeur est plus récent que la dernière commande.</text>
