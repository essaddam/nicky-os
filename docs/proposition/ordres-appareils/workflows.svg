<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 456" width="1000" height="456" role="img" aria-labelledby="workflows-t workflows-d" font-family="Avenir Next, Avenir, Segoe UI, sans-serif">
  <title id="workflows-t">Les workflows interrogent les ordres</title>
  <desc id="workflows-d">Quatre questions et leur coût. La dernière commande : la fiche de l'ordre, 0,37 ns. Un ordre en cours : son issue, même coût. Quand un ordre part ou tombe : un index par ordre, comme l'index par point. La valeur vient-elle d'un ordre : demandée, aboutie et pas changée depuis, 3,3 ns. En bas, la soirée du banc : à 20:00 la lampe allumée par l'écran reste ; à 20:10 un interrupteur l'éteint et la rallume, aucun ordre ne l'explique ; à 20:15 la maison la rallume ; à 20:40 l'extinction automatique l'éteint.</desc>
  <style>.hd-flux{stroke-dasharray:1.5 11;stroke-linecap:round;animation:hd-flux 1.2s linear infinite}.hd-lent{stroke-dasharray:1.5 13;stroke-linecap:round;animation:hd-lent 2.6s linear infinite}.hd-pouls{animation:hd-pouls 1.6s ease-in-out infinite}@keyframes hd-flux{to{stroke-dashoffset:-12.5}}@keyframes hd-lent{to{stroke-dashoffset:-14.5}}@keyframes hd-pouls{0%,100%{opacity:.3}50%{opacity:1}}@media (prefers-reduced-motion:reduce){.hd-flux,.hd-lent,.hd-pouls{animation:none}}</style>
