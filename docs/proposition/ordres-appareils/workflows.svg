          <text x="560.0" y="348.0" font-size="10.5" fill="#1b5873" font-weight="700" text-anchor="middle">l'ordre l'explique</text>
          <g filter="url(#workflows-o2)"><rect x="705.0" y="274.0" width="190" height="54" rx="18" fill="#134133"/><rect x="705.0" y="269.0" width="190" height="54" rx="18" fill="url(#workflows-h-vert)"/></g>
          <rect x="710.0" y="272.0" width="180" height="22.7" rx="14" fill="#ffffff" opacity=".17"/>
          <text x="721.0" y="294.0" font-size="13" fill="#ffffff" font-weight="700">20:40</text>
          <text x="721.0" y="310.0" font-size="10" fill="#ffffff" opacity=".9">Extinction auto</text>
          <text x="800.0" y="348.0" font-size="10.5" fill="#195744" font-weight="700" text-anchor="middle">éteinte</text>
