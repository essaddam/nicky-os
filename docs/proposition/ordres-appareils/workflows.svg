          <text x="552.0" y="71.0" font-size="12" fill="#4b3d82" font-weight="700">Un ordre est-il en cours ?</text>
          <text x="522.0" y="93.0" font-size="10.2" fill="#52615a">son issue vaut « en cours », « retenue » ou « accepté »</text>
