<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 514" width="1000" height="514" role="img" aria-labelledby="virtuels-t virtuels-d" font-family="Avenir Next, Avenir, Segoe UI, sans-serif">
  <title id="virtuels-t">Appareils physiques et virtuels</title>
  <desc id="virtuels-d">À gauche, des appareils physiques : quatre ampoules du séjour, dont une dans la chambre protégée, la serrure et la lampe du salon ; chacun possède ses valeurs et ses ordres. Au centre, deux appareils virtuels. Le groupe lumieres:sejour possède un seul ordre, « on », de groupe ; il cible les quatre « on » des ampoules, les compte comme membres, et montre leurs valeurs : douze entrées de huit octets. L'entrée ne possède rien ; elle montre la valeur et l'ordre de la serrure, deux ordres du volet RTS et la valeur de la lampe. À droite : un ordre de groupe fait une demande mère et une fille par cible ; trois ampoules sur quatre ont obéi, la mère dit échec, partiel, 3 sur 4. La garde lit les pièces des cibles et des membres : un agent qui commande le groupe est retenu. Dans la maison ×1 du banc, 29 appareils virtuels et 340 entrées.</desc>
  <style>.hd-flux{stroke-dasharray:1.5 11;stroke-linecap:round;animation:hd-flux 1.2s linear infinite}.hd-lent{stroke-dasharray:1.5 13;stroke-linecap:round;animation:hd-lent 2.6s linear infinite}.hd-pouls{animation:hd-pouls 1.6s ease-in-out infinite}@keyframes hd-flux{to{stroke-dashoffset:-12.5}}@keyframes hd-lent{to{stroke-dashoffset:-14.5}}@keyframes hd-pouls{0%,100%{opacity:.3}50%{opacity:1}}@media (prefers-reduced-motion:reduce){.hd-flux,.hd-lent,.hd-pouls{animation:none}}</style>
