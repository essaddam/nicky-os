          <text x="56.0" y="436.0" font-size="11" fill="#1d302a" font-weight="700">Une valeur ou un ordre a un seul propriétaire ; un appareil virtuel le montre ou le commande par référence. 29 virtuels à ×1, 340 entrées : 2,7 Ko.</text>
  <text x="18" y="491" font-size="12" fill="#52615a" font-style="italic">Aujourd'hui, un groupe garde la liste de ses appareils (`members`), et les luminaires répondent « fait » dès qu'une ampoule a obéi. La composition</text>
  <text x="18" y="508" font-size="12" fill="#52615a" font-style="italic">garde des numéros à génération : une place réutilisée n'entre jamais dans un virtuel.</text>
