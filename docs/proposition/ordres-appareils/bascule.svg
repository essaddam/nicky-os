          <text x="738.0" y="82.5" font-size="13" fill="#ffffff" font-weight="700">Le secours</text>
          <text x="958.0" y="82.5" font-size="10" fill="#ffffff" text-anchor="end" opacity=".9">puis l'actif</text>
          <text x="835.0" y="118.0" font-size="10.2" fill="#52615a" text-anchor="middle">les mêmes cases, générations, fiches</text>
          <text x="835.0" y="134.0" font-size="10.2" fill="#52615a" text-anchor="middle">convertit chaque échéance</text>
          <text x="835.0" y="150.0" font-size="10.2" fill="#52615a" text-anchor="middle">dans sa propre horloge</text>
