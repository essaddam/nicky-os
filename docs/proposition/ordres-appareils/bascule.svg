          <text x="500.0" y="100.0" font-size="10.5" fill="#94660a" font-weight="700" text-anchor="middle" paint-order="stroke" stroke="#fffdf8" stroke-width="4" stroke-linejoin="round">ord/ · wf/ · val/ · meta/ — au rang s</text>
          <rect x="30" y="202" width="460" height="52" rx="12" fill="url(#bascule-f-rouge)" stroke="#d06a46" stroke-opacity=".55" stroke-width="1.1" filter="url(#bascule-o)"/>
          <circle cx="45" cy="221" r="4.5" fill="url(#bascule-h-rouge)"/>
          <text x="57.0" y="225.0" font-size="11.2" fill="#8b3b22" font-weight="700">Remise, partie ou non</text>
          <text x="44.0" y="243.0" font-size="9.8" fill="#52615a">incertaine (bascule), jamais renvoyée ; le hub la confirme sur val/</text>
          <rect x="510" y="202" width="460" height="52" rx="12" fill="url(#bascule-f-violet)" stroke="#7e6cc2" stroke-opacity=".55" stroke-width="1.1" filter="url(#bascule-o)"/>
