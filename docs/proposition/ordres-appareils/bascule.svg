          <text x="537.0" y="225.0" font-size="11.2" fill="#4b3d82" font-weight="700">Suivie (accepté, envoyé)</text>
          <text x="524.0" y="243.0" font-size="9.8" fill="#52615a">la suite arrive au nouvel actif ; il conclut lui-même</text>
          <rect x="30" y="264" width="460" height="52" rx="12" fill="url(#bascule-f-ambre)" stroke="#e0a12a" stroke-opacity=".55" stroke-width="1.1" filter="url(#bascule-o)"/>
          <circle cx="45" cy="283" r="4.5" fill="url(#bascule-h-ambre)"/>
          <text x="57.0" y="287.0" font-size="11.2" fill="#94660a" font-weight="700">Retenue</text>
          <text x="44.0" y="305.0" font-size="9.8" fill="#52615a">la carte reste ; l'humain décide sur le nouvel actif ; revalidée</text>
          <rect x="510" y="264" width="460" height="52" rx="12" fill="url(#bascule-f-vert)" stroke="#3d9a75" stroke-opacity=".55" stroke-width="1.1" filter="url(#bascule-o)"/>
          <circle cx="525" cy="283" r="4.5" fill="url(#bascule-h-vert)"/>
          <text x="537.0" y="287.0" font-size="11.2" fill="#195744" font-weight="700">Un bail « pendant »</text>
          <text x="524.0" y="305.0" font-size="9.8" fill="#52615a">rétabli à son terme par le nouvel actif, même en retard</text>
          <rect x="30" y="326" width="460" height="52" rx="12" fill="url(#bascule-f-bleu)" stroke="#3b8db4" stroke-opacity=".55" stroke-width="1.1" filter="url(#bascule-o)"/>
          <circle cx="45" cy="345" r="4.5" fill="url(#bascule-h-bleu)"/>
          <text x="57.0" y="349.0" font-size="11.2" fill="#1b5873" font-weight="700">Un appui retenté</text>
          <text x="44.0" y="367.0" font-size="9.8" fill="#52615a">le reçu est venu par la trace : il ne part pas deux fois</text>
  <text x="18" y="421" font-size="12" fill="#52615a" font-style="italic">La règle de la HA v2 (§ 15) : un ordre envoyé sans issue est « incertain », jamais renvoyé. L'analyse la rend précise : le secours sait quelles</text>
  <text x="18" y="438" font-size="12" fill="#52615a" font-style="italic">demandes ont pu partir, et le hub, qui connaît la forme, conclut.</text>
