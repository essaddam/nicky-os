          <text x="68.0" y="82.5" font-size="13" fill="#ffffff" font-weight="700">L'actif</text>
          <text x="288.0" y="82.5" font-size="10" fill="#ffffff" text-anchor="end" opacity=".9">jusqu'à 21:00</text>
