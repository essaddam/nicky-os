<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 444" width="1000" height="444" role="img" aria-labelledby="bascule-t bascule-d" font-family="Avenir Next, Avenir, Segoe UI, sans-serif">
  <title id="bascule-t">La bascule</title>
  <desc id="bascule-d">À gauche, l'actif publie chaque pas d'une demande sur ord/, au rang s, et ses retenues et ses baux sur wf/. À droite, le secours tient les mêmes cases, générations et fiches ; il convertit chaque échéance dans sa propre horloge. Cinq cas à la bascule : une demande remise devient incertaine, jamais renvoyée, et le hub du nouvel actif la confirme sur val/ s'il peut ; une demande suivie reçoit sa suite au nouvel actif ; une retenue reste à décider et sera revalidée ; un bail est rétabli à son terme, même en retard ; un appui retenté ne part pas deux fois, le reçu étant venu par la trace.</desc>
  <style>.hd-flux{stroke-dasharray:1.5 11;stroke-linecap:round;animation:hd-flux 1.2s linear infinite}.hd-lent{stroke-dasharray:1.5 13;stroke-linecap:round;animation:hd-lent 2.6s linear infinite}.hd-pouls{animation:hd-pouls 1.6s ease-in-out infinite}@keyframes hd-flux{to{stroke-dashoffset:-12.5}}@keyframes hd-lent{to{stroke-dashoffset:-14.5}}@keyframes hd-pouls{0%,100%{opacity:.3}50%{opacity:1}}@media (prefers-reduced-motion:reduce){.hd-flux,.hd-lent,.hd-pouls{animation:none}}</style>
  <rect width="1000" height="444" rx="16" fill="#fffdf8"/>
