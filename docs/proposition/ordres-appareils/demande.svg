          <text x="596.0" y="219.6" font-size="10" fill="#4f5d57" font-weight="700" text-anchor="middle">12 · gén. 6</text>
          <text x="670.0" y="220.0" font-size="14" fill="#52615a" font-weight="700">→</text>
          <rect x="690.0" y="196.0" width="128.0" height="40" rx="5" fill="url(#demande-h-bleu)"/>
          <text x="754.0" y="219.6" font-size="10" fill="#ffffff" font-weight="700" text-anchor="middle">12 · gén. 7</text>
          <text x="532.0" y="262.0" font-size="10.5" fill="#52615a">l'issue de la 6 arrive quand la 7 occupe la case :</text>
          <text x="532.0" y="278.0" font-size="10.5" fill="#8b3b22" font-weight="700">écartée, journalisée ; la 7 attend la sienne</text>
          <rect x="16" y="326" width="968" height="36" rx="12" fill="#e3f1e9" stroke="#3d9a75" stroke-opacity=".5"/>
          <g transform="translate(28.0 334.0) scale(0.8333)" fill="none" stroke="#195744" stroke-width="2.64" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></g>
          <text x="56.0" y="348.0" font-size="11" fill="#1d302a" font-weight="700">Prendre une case et la rendre : 6,5 ns. Retrouver une demande par son numéro : 0,65 ns. Une retenue est une demande comme une autre.</text>
  <text x="18" y="403" font-size="12" fill="#52615a" font-style="italic">La règle des exécutions de la mémoire v2 (§ 8.4), appliquée aux demandes. La génération de 16 bits ne fait le tour qu'après 65 536 réutilisations de</text>
  <text x="18" y="420" font-size="12" fill="#52615a" font-style="italic">la même case : bien plus que les 180 s d'un suivi.</text>
