          <text x="361.0" y="220.0" font-size="11" fill="#94660a" font-weight="700" text-anchor="middle">génération · 16 bits</text>
          <text x="52.0" y="262.0" font-size="10.5" fill="#52615a">il voyage dans cmd/ et dans l'issue du module ;</text>
          <text x="52.0" y="278.0" font-size="10.5" fill="#52615a">c'est le champ « demande » d'une exécution (mémoire v2 § 8.4)</text>
