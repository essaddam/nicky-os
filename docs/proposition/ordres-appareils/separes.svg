          <text x="56.0" y="406.0" font-size="11" fill="#1d302a" font-weight="700">Une valeur n'est jamais un ordre, un ordre n'a jamais de valeur : chacun son registre, ses numéros (place + génération), ses fiches.</text>
  <text x="18" y="461" font-size="12" fill="#52615a" font-style="italic">Deux registres à génération, celui du nettoyage, deux fois. Le seul lien entre un ordre et une valeur est un rang dans l'appareil, porté par la forme</text>
  <text x="18" y="478" font-size="12" fill="#52615a" font-style="italic">de l'ordre.</text>
