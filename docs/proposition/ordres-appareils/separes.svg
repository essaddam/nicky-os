<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 484" width="1000" height="484" role="img" aria-labelledby="separes-t separes-d" font-family="Avenir Next, Avenir, Segoe UI, sans-serif">
  <title id="separes-t">Les valeurs et les ordres : deux registres</title>
  <desc id="separes-d">Au centre, l'appareil : une fiche de 16 octets qui dit où commencent ses valeurs et ses ordres, sa pièce et sa composition. À gauche, le registre des valeurs, numéros 1 234 à 1 237 pour la lampe du salon ; le volet RTS n'en a aucune. À droite, le registre des ordres, numéros 87 à 89 pour la même lampe, et les quatre ordres du volet RTS. Deux liens par référence vont des ordres vers les valeurs : le retour (la valeur qui prouve l'ordre) et le paramètre (la valeur qu'il règle).</desc>
  <style>.hd-flux{stroke-dasharray:1.5 11;stroke-linecap:round;animation:hd-flux 1.2s linear infinite}.hd-lent{stroke-dasharray:1.5 13;stroke-linecap:round;animation:hd-lent 2.6s linear infinite}.hd-pouls{animation:hd-pouls 1.6s ease-in-out infinite}@keyframes hd-flux{to{stroke-dashoffset:-12.5}}@keyframes hd-lent{to{stroke-dashoffset:-14.5}}@keyframes hd-pouls{0%,100%{opacity:.3}50%{opacity:1}}@media (prefers-reduced-motion:reduce){.hd-flux,.hd-lent,.hd-pouls{animation:none}}</style>
