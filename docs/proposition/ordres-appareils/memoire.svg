          <text x="124.0" y="405.1" font-size="10" fill="#ffffff" font-weight="700">proposé</text>
  <text x="18" y="449" font-size="12" fill="#52615a" font-style="italic">Les répliques d'aujourd'hui sont au mieux : ni les canaux de Tokio, ni les tâches, ni la sérialisation ne sont comptés. Le proposé compte tout ce</text>
  <text x="18" y="466" font-size="12" fill="#52615a" font-style="italic">qu'il range, dont des choses qui n'existent pas aujourd'hui : la structure complète des ordres, leur dernière commande, les compositions.</text>
