<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 472" width="1000" height="472" role="img" aria-labelledby="memoire-t memoire-d" font-family="Avenir Next, Avenir, Segoe UI, sans-serif">
  <title id="memoire-t">La mémoire, avant et après</title>
  <desc id="memoire-d">Six postes, aujourd'hui en gris, proposé en vert, en échelle logarithmique. Décrire les appareils, leurs valeurs et leurs ordres : 828 Kio contre 337 Kio. Le journal en mémoire : 138 Kio contre 20 Kio. Cinquante retenues : 22 Kio contre 6,2 Kio. Une demande en vol : 590 o au mieux contre 64 octets. La copie de la maison pour l'assistant : 317 Kio à chaque requête, contre rien. Ce qu'un écran charge : 631 Ko contre 118 Ko.</desc>
  <style>.hd-flux{stroke-dasharray:1.5 11;stroke-linecap:round;animation:hd-flux 1.2s linear infinite}.hd-lent{stroke-dasharray:1.5 13;stroke-linecap:round;animation:hd-lent 2.6s linear infinite}.hd-pouls{animation:hd-pouls 1.6s ease-in-out infinite}@keyframes hd-flux{to{stroke-dashoffset:-12.5}}@keyframes hd-lent{to{stroke-dashoffset:-14.5}}@keyframes hd-pouls{0%,100%{opacity:.3}50%{opacity:1}}@media (prefers-reduced-motion:reduce){.hd-flux,.hd-lent,.hd-pouls{animation:none}}</style>
