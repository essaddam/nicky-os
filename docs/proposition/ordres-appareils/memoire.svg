          <rect x="420.0" y="202.0" width="126.0" height="13" rx="6" fill="url(#memoire-b-gris)"/>
          <rect x="422.0" y="204.0" width="122.0" height="4.9" rx="5" fill="#ffffff" opacity=".2"/>
          <text x="552.0" y="213.0" font-size="10" fill="#4f5d57" font-weight="700">590 o</text>
          <rect x="420.0" y="219.0" width="32.1" height="13" rx="6" fill="url(#memoire-b-vert)"/>
          <rect x="422.0" y="221.0" width="28.1" height="4.9" rx="5" fill="#ffffff" opacity=".2"/>
          <text x="458.1" y="230.0" font-size="10" fill="#195744" font-weight="700">64 o</text>
          <text x="16.0" y="266.0" font-size="10.8" fill="#1d302a" font-weight="700">Copier la maison pour l'assistant, à chaque requête</text>
          <rect x="420.0" y="252.0" width="393.1" height="13" rx="6" fill="url(#memoire-b-gris)"/>
          <rect x="422.0" y="254.0" width="389.1" height="4.9" rx="5" fill="#ffffff" opacity=".2"/>
          <text x="819.1" y="263.0" font-size="10" fill="#4f5d57" font-weight="700">317 Kio</text>
          <text x="424.0" y="280.0" font-size="10" fill="#195744" font-weight="700">rien : lu dans les colonnes</text>
          <text x="16.0" y="316.0" font-size="10.8" fill="#1d302a" font-weight="700">Ce qu'un écran charge pour démarrer (transfert)</text>
