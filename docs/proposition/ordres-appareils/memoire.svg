          <text x="16.0" y="24.0" font-size="11" fill="#52615a" font-weight="700" letter-spacing=".06em">CE QUE LA MÉMOIRE DES ORDRES COÛTE, ET CE QU'ELLE REMPLACE (MAISON ×1)</text>
          <text x="16.0" y="66.0" font-size="10.8" fill="#1d302a" font-weight="700">Décrire les appareils, valeurs et ordres</text>
