<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 396" width="1000" height="396" role="img" aria-labelledby="trois-t trois-d" font-family="Avenir Next, Avenir, Segoe UI, sans-serif">
  <title id="trois-t">L'appareil, l'ordre, la structure</title>
  <desc id="trois-d">Trois colonnes reliées. L'appareil : une fiche de 16 octets, la plage de ses valeurs, celle de ses ordres, sa composition, sa pièce. L'ordre : une fiche de 32 octets, son numéro à génération, sa forme, sa dernière commande. La structure : la forme, 24 octets, partagée, plus 16 octets par paramètre et 4 par valeur attendue. Dans la maison ×1 du banc, 525 appareils dont 29 virtuels, 802 ordres et 16 formes ; à ×100, toujours 16 formes.</desc>
  <style>.hd-flux{stroke-dasharray:1.5 11;stroke-linecap:round;animation:hd-flux 1.2s linear infinite}.hd-lent{stroke-dasharray:1.5 13;stroke-linecap:round;animation:hd-lent 2.6s linear infinite}.hd-pouls{animation:hd-pouls 1.6s ease-in-out infinite}@keyframes hd-flux{to{stroke-dashoffset:-12.5}}@keyframes hd-lent{to{stroke-dashoffset:-14.5}}@keyframes hd-pouls{0%,100%{opacity:.3}50%{opacity:1}}@media (prefers-reduced-motion:reduce){.hd-flux,.hd-lent,.hd-pouls{animation:none}}</style>
  <rect width="1000" height="396" rx="16" fill="#fffdf8"/>
