          </defs>
          <text x="16.0" y="24.0" font-size="11" fill="#52615a" font-weight="700" letter-spacing=".06em">CE QUE CHACUN DOIT CONNAÎTRE : L'APPAREIL, L'ORDRE, LA STRUCTURE DE L'ORDRE</text>
