          <text x="56.0" y="76.5" font-size="13" fill="#ffffff" font-weight="700">L'appareil</text>
          <text x="318.0" y="76.5" font-size="10" fill="#ffffff" text-anchor="end" opacity=".9">App · 16 o</text>
          <rect x="18" y="118" width="312" height="122" rx="12" fill="url(#trois-f-ambre)" stroke="#e0a12a" stroke-opacity=".55" stroke-width="1.1" filter="url(#trois-o)"/>
          <circle cx="33" cy="137" r="4.5" fill="url(#trois-h-ambre)"/>
          <text x="45.0" y="141.0" font-size="11.5" fill="#94660a" font-weight="700">Ce qu'il porte</text>
          <text x="32.0" y="159.0" font-size="10.4" fill="#52615a">où sont ses valeurs (plage)</text>
          <text x="32.0" y="174.0" font-size="10.4" fill="#52615a">où sont ses ordres (plage)</text>
          <text x="32.0" y="189.0" font-size="10.4" fill="#52615a">sa composition (8 o par membre)</text>
          <text x="32.0" y="204.0" font-size="10.4" fill="#52615a">sa pièce, physique ou virtuel</text>
          <ellipse cx="508.0" cy="111.0" rx="170.0" ry="11" fill="url(#trois-sol)"/>
          <polygon points="350,54 366,45.2 672,45.2 656,54" fill="url(#trois-t-bleu)"/>
          <polygon points="656,54 672,45.2 672,89.2 656,104" fill="url(#trois-s-bleu)"/>
          <rect x="344" y="54" width="312" height="50" rx="8" fill="url(#trois-f-bleu)" stroke="#3b8db4" stroke-opacity=".5"/>
          <path d="M344 88 V62 a8 8 0 0 1 8 -8 H648 a8 8 0 0 1 8 8 V88 z" fill="url(#trois-h-bleu)"/>
          <g transform="translate(356.0 62.0) scale(0.7500)" fill="none" stroke="#ffffff" stroke-width="2.53" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L5 13h6l-1 9 8-11h-6z"/></g>
          <text x="382.0" y="76.5" font-size="13" fill="#ffffff" font-weight="700">L'ordre</text>
          <text x="644.0" y="76.5" font-size="10" fill="#ffffff" text-anchor="end" opacity=".9">Fiche · 32 o</text>
          <rect x="344" y="118" width="312" height="122" rx="12" fill="url(#trois-f-bleu)" stroke="#3b8db4" stroke-opacity=".55" stroke-width="1.1" filter="url(#trois-o)"/>
          <circle cx="359" cy="137" r="4.5" fill="url(#trois-h-bleu)"/>
          <text x="371.0" y="141.0" font-size="11.5" fill="#1b5873" font-weight="700">Ce qu'il porte</text>
          <text x="358.0" y="159.0" font-size="10.4" fill="#52615a">son numéro : place + génération</text>
          <text x="358.0" y="174.0" font-size="10.4" fill="#52615a">sa forme (un numéro)</text>
          <text x="358.0" y="189.0" font-size="10.4" fill="#52615a">sa dernière commande : valeur,</text>
          <text x="358.0" y="204.0" font-size="10.4" fill="#52615a">instant, issue, origine, qui, demande</text>
          <ellipse cx="834.0" cy="111.0" rx="170.0" ry="11" fill="url(#trois-sol)"/>
