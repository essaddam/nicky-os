          <path d="M670 88 V62 a8 8 0 0 1 8 -8 H974 a8 8 0 0 1 8 8 V88 z" fill="url(#trois-h-vert)"/>
          <g transform="translate(682.0 62.0) scale(0.7500)" fill="none" stroke="#ffffff" stroke-width="2.53" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7l8-4 8 4-8 4z M4 12l8 4 8-4 M4 17l8 4 8-4"/></g>
          <text x="708.0" y="76.5" font-size="13" fill="#ffffff" font-weight="700">La structure</text>
          <text x="970.0" y="76.5" font-size="10" fill="#ffffff" text-anchor="end" opacity=".9">Forme · 24 o</text>
          <rect x="670" y="118" width="312" height="122" rx="12" fill="url(#trois-f-vert)" stroke="#3d9a75" stroke-opacity=".55" stroke-width="1.1" filter="url(#trois-o)"/>
          <circle cx="685" cy="137" r="4.5" fill="url(#trois-h-vert)"/>
          <text x="697.0" y="141.0" font-size="11.5" fill="#195744" font-weight="700">Ce qu'il porte</text>
          <text x="684.0" y="159.0" font-size="10.4" fill="#52615a">effet : consigne ou appui</text>
          <text x="684.0" y="174.0" font-size="10.4" fill="#52615a">retour : état, pont, accusé, aucun</text>
          <text x="684.0" y="189.0" font-size="10.4" fill="#52615a">suivi, tolérance, drapeaux</text>
          <text x="684.0" y="204.0" font-size="10.4" fill="#52615a">16 o par paramètre, 4 o par attendu</text>
          <path d="M332 80 L342 80" fill="none" stroke="#1b5873" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#trois-m-bleu)"/>
          <path d="M658 80 L668 80" fill="none" stroke="#195744" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#trois-m-vert)"/>
          <rect x="73.6" y="254.0" width="200.8" height="21.5" rx="10.8" fill="url(#trois-h-ambre)"/>
          <text x="86.6" y="268.5" font-size="10.5" fill="#ffffff" font-weight="700">525 appareils, dont 29 virtuels</text>
          <rect x="455.1" y="254.0" width="89.8" height="21.5" rx="10.8" fill="url(#trois-h-bleu)"/>
          <text x="468.1" y="268.5" font-size="10.5" fill="#ffffff" font-weight="700">802 ordres</text>
          <rect x="761.0" y="254.0" width="130.1" height="21.5" rx="10.8" fill="url(#trois-h-vert)"/>
          <text x="774.0" y="268.5" font-size="10.5" fill="#ffffff" font-weight="700">16 formes en tout</text>
          <rect x="16" y="296" width="968" height="36" rx="12" fill="#e3f1e9" stroke="#3d9a75" stroke-opacity=".5"/>
          <g transform="translate(28.0 304.0) scale(0.8333)" fill="none" stroke="#195744" stroke-width="2.64" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></g>
          <text x="56.0" y="318.0" font-size="11" fill="#1d302a" font-weight="700">La maison ×1 du banc : 802 ordres partagent 16 structures. À ×100, toujours 16 : la structure ne grandit pas avec la maison.</text>
  <text x="18" y="373" font-size="12" fill="#52615a" font-style="italic">Ta phrase, en trois fiches : il faut connaître l'appareil, l'ordre et la structure de l'ordre. Chacune a son numéro ; la troisième est partagée, comme</text>
  <text x="18" y="390" font-size="12" fill="#52615a" font-style="italic">un dictionnaire d'énumération.</text>
</svg>
