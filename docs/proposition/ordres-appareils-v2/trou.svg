<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 452" width="1000" height="452" role="img" aria-labelledby="trou-t trou-d" font-family="Avenir Next, Avenir, Segoe UI, sans-serif">
  <title id="trou-t">Ce que la mémoire range, et ce qui manque</title>
  <desc id="trou-d">Deux colonnes. À gauche, ce que la mémoire v2 range pour une valeur : la définition de 16 octets, la valeur vive de 40 octets, les échéances, l'annuaire. À droite, ce qu'un ordre demande et où c'est aujourd'hui : sa structure n'est que sur meta/, les demandes vivent dans des tâches et des canaux, la dernière commande n'existe nulle part, les retenues, reçus, baux et compositions sont à part, en textes. Un bandeau : la v2 ne garde pour un ordre qu'un octet, « sens ».</desc>
  <style>.hd-flux{stroke-dasharray:1.5 11;stroke-linecap:round;animation:hd-flux 1.2s linear infinite}.hd-lent{stroke-dasharray:1.5 13;stroke-linecap:round;animation:hd-lent 2.6s linear infinite}.hd-pouls{animation:hd-pouls 1.6s ease-in-out infinite}@keyframes hd-flux{to{stroke-dashoffset:-12.5}}@keyframes hd-lent{to{stroke-dashoffset:-14.5}}@keyframes hd-pouls{0%,100%{opacity:.3}50%{opacity:1}}@media (prefers-reduced-motion:reduce){.hd-flux,.hd-lent,.hd-pouls{animation:none}}</style>
  <rect width="1000" height="452" rx="16" fill="#fffdf8"/>
