  <text x="18" y="469" font-size="12" fill="#52615a" font-style="italic">Ce que la V7 met dans meta/, rangé en fiches de taille fixe. La v2 cite les valeurs par leur clé, et vérifie le dictionnaire d'une énumération et le</text>
  <text x="18" y="486" font-size="12" fill="#52615a" font-style="italic">schéma d'un objet (revue I11, I14).</text>
