<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 492" width="1000" height="492" role="img" aria-labelledby="forme-t forme-d" font-family="Avenir Next, Avenir, Segoe UI, sans-serif">
  <title id="forme-t">La forme d'un ordre</title>
  <desc id="forme-d">Trois fiches, octet par octet. La forme, 24 octets partagés : début de ses paramètres et de ses valeurs attendues, la clé de la valeur qui confirme, le suivi, la tolérance, le schéma d'un objet court, leur nombre, l'effet, le retour, les drapeaux. Un paramètre, 20 octets : bornes d'ordre, pas, dictionnaire, la clé de la valeur qu'il règle, nature, échelle, unité. Une valeur attendue, 4 octets. Quatre exemples : la luminosité d'une lampe, ouvrir un volet RTS, démarrer un aspirateur, une annonce au texte privé.</desc>
  <style>.hd-flux{stroke-dasharray:1.5 11;stroke-linecap:round;animation:hd-flux 1.2s linear infinite}.hd-lent{stroke-dasharray:1.5 13;stroke-linecap:round;animation:hd-lent 2.6s linear infinite}.hd-pouls{animation:hd-pouls 1.6s ease-in-out infinite}@keyframes hd-flux{to{stroke-dashoffset:-12.5}}@keyframes hd-lent{to{stroke-dashoffset:-14.5}}@keyframes hd-pouls{0%,100%{opacity:.3}50%{opacity:1}}@media (prefers-reduced-motion:reduce){.hd-flux,.hd-lent,.hd-pouls{animation:none}}</style>
