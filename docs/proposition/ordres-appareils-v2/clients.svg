          <text x="16.0" y="24.0" font-size="11" fill="#52615a" font-weight="700" letter-spacing=".06em">LES CLIENTS SE CHARGENT PAR MQTT, À CONTENU ÉGAL, ET VOIENT LEURS TROUS</text>
