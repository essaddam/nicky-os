<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 488" width="1000" height="488" role="img" aria-labelledby="clients-t clients-d" font-family="Avenir Next, Avenir, Segoe UI, sans-serif">
  <title id="clients-t">Les clients se chargent par MQTT</title>
  <desc id="clients-d">Trois façons de servir un écran. Aujourd'hui : toute la maison en JSON par /api/snapshot, puis un flux SSE. La V7 : un module WebSocket. La v2, ton choix : l'écran parle MQTT directement ; il demande son état, filtré par ses droits, avec le rang de chacune de ses pièces, puis suit le flux de ses pièces ; il publie ses demandes sur req/ de son compte. Ce qu'un écran charge, à contenu égal, maison ×1 : 593 Ko de JSON aujourd'hui ; 140 Ko pour le même contenu proposé en JSON, le gain du partage ; 113 Ko en binaire, celui de l'encodage ; 21 Ko pour un écran de deux pièces, celui du filtrage.</desc>
  <style>.hd-flux{stroke-dasharray:1.5 11;stroke-linecap:round;animation:hd-flux 1.2s linear infinite}.hd-lent{stroke-dasharray:1.5 13;stroke-linecap:round;animation:hd-lent 2.6s linear infinite}.hd-pouls{animation:hd-pouls 1.6s ease-in-out infinite}@keyframes hd-flux{to{stroke-dashoffset:-12.5}}@keyframes hd-lent{to{stroke-dashoffset:-14.5}}@keyframes hd-pouls{0%,100%{opacity:.3}50%{opacity:1}}@media (prefers-reduced-motion:reduce){.hd-flux,.hd-lent,.hd-pouls{animation:none}}</style>
