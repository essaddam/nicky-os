          <path d="M670 88 V62 a8 8 0 0 1 8 -8 H974 a8 8 0 0 1 8 8 V88 z" fill="url(#clients-h-vert)"/>
          <g transform="translate(682.0 62.0) scale(0.7500)" fill="none" stroke="#ffffff" stroke-width="2.53" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18v11H3z M8 20h8 M12 16v4"/></g>
          <text x="708.0" y="76.5" font-size="13" fill="#ffffff" font-weight="700">La v2, ton choix</text>
          <text x="970.0" y="76.5" font-size="10" fill="#ffffff" text-anchor="end" opacity=".9">MQTT, directement</text>
          <rect x="670" y="118" width="312" height="98" rx="12" fill="url(#clients-f-vert)" stroke="#3d9a75" stroke-opacity=".55" stroke-width="1.1" filter="url(#clients-o)"/>
          <circle cx="685" cy="137" r="4.5" fill="url(#clients-h-vert)"/>
          <text x="697.0" y="141.0" font-size="11.5" fill="#195744" font-weight="700">Comment</text>
          <text x="684.0" y="159.0" font-size="10.2" fill="#52615a">l'état du client, filtré par ses droits</text>
          <text x="684.0" y="174.0" font-size="10.2" fill="#52615a">le rang de chacune de ses pièces</text>
          <text x="684.0" y="189.0" font-size="10.2" fill="#52615a">req/&lt;compte&gt;, res/&lt;compte&gt;</text>
          <text x="18.0" y="246.0" font-size="11" fill="#1d302a" font-weight="700">Ce qu'un écran charge pour démarrer, à contenu égal, maison ×1</text>
          <text x="18.0" y="274.0" font-size="10.5" fill="#1d302a">Aujourd'hui : /api/snapshot, JSON</text>
          <rect x="360.0" y="262.0" width="560.0" height="16" rx="6" fill="url(#clients-b-gris)"/>
          <rect x="362.0" y="264.0" width="556.0" height="6.1" rx="5" fill="#ffffff" opacity=".2"/>
          <text x="926.0" y="275.0" font-size="10.5" fill="#4f5d57" font-weight="700">593 Ko</text>
          <text x="18.0" y="304.0" font-size="10.5" fill="#1d302a">Le même contenu, proposé, en JSON : le partage</text>
          <rect x="360.0" y="292.0" width="132.4" height="16" rx="6" fill="url(#clients-b-ambre)"/>
          <rect x="362.0" y="294.0" width="128.4" height="6.1" rx="5" fill="#ffffff" opacity=".2"/>
          <text x="498.4" y="305.0" font-size="10.5" fill="#94660a" font-weight="700">140 Ko</text>
          <text x="18.0" y="334.0" font-size="10.5" fill="#1d302a">Le même contenu, en binaire : l'encodage</text>
          <rect x="360.0" y="322.0" width="106.2" height="16" rx="6" fill="url(#clients-b-vert)"/>
          <rect x="362.0" y="324.0" width="102.2" height="6.1" rx="5" fill="#ffffff" opacity=".2"/>
          <text x="472.2" y="335.0" font-size="10.5" fill="#195744" font-weight="700">113 Ko</text>
          <text x="18.0" y="364.0" font-size="10.5" fill="#1d302a">Un écran de deux pièces : le filtrage</text>
          <rect x="360.0" y="352.0" width="19.4" height="16" rx="6" fill="url(#clients-b-bleu)"/>
          <rect x="362.0" y="354.0" width="15.4" height="6.1" rx="5" fill="#ffffff" opacity=".2"/>
          <text x="385.4" y="365.0" font-size="10.5" fill="#1b5873" font-weight="700">21 Ko</text>
          <rect x="16" y="388" width="968" height="36" rx="12" fill="#e3f1e9" stroke="#3d9a75" stroke-opacity=".5"/>
          <g transform="translate(28.0 396.0) scale(0.8333)" fill="none" stroke="#195744" stroke-width="2.64" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></g>
          <text x="56.0" y="410.0" font-size="11" fill="#1d302a" font-weight="700">Chaque sortie porte le rang de sa pièce : un écran filtré voit ce qu'il a perdu ; une époque nouvelle le fait se recharger.</text>
  <text x="18" y="465" font-size="12" fill="#52615a" font-style="italic">La v1 comparait des contenus différents (revue I17) ; la v2 décompose le gain. Le rang de chaque pièce répond au constat I13 : avec le seul rang s, un</text>
  <text x="18" y="482" font-size="12" fill="#52615a" font-style="italic">écran filtré ne distinguait pas une perte d'un message qui ne le concernait pas.</text>
</svg>
