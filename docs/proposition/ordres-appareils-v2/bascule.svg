<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 452" width="1000" height="452" role="img" aria-labelledby="bascule-t bascule-d" font-family="Avenir Next, Avenir, Segoe UI, sans-serif">
  <title id="bascule-t">La bascule</title>
  <desc id="bascule-d">À gauche, l'actif publie chaque pas d'une demande sur ord/, au rang s ; un appui attend l'accusé du secours avant de partir ; sans accusé au bout de 200 ms, il inscrit chez le témoin que le secours a décroché, puis envoie. À droite, le secours tient les mêmes cases et fiches et accuse chaque rang ; promu, il prend une époque nouvelle, lit le témoin pour savoir si la reprise est sûre, et son module relit ses appareils. Six cas : une demande remise devient incertaine, jamais renvoyée, et n'est confirmée que par une lecture faite après la reprise ; un appui sans accusé n'est jamais parti, et part une fois s'il est retenté sur une reprise sûre ; sur une reprise non sûre, une nouvelle tentative d'un appui antérieur est refusée ; un groupe garde son compte ; retenues, baux et reçus passent ; copies et écrans se rechargent.</desc>
  <style>.hd-flux{stroke-dasharray:1.5 11;stroke-linecap:round;animation:hd-flux 1.2s linear infinite}.hd-lent{stroke-dasharray:1.5 13;stroke-linecap:round;animation:hd-lent 2.6s linear infinite}.hd-pouls{animation:hd-pouls 1.6s ease-in-out infinite}@keyframes hd-flux{to{stroke-dashoffset:-12.5}}@keyframes hd-lent{to{stroke-dashoffset:-14.5}}@keyframes hd-pouls{0%,100%{opacity:.3}50%{opacity:1}}@media (prefers-reduced-motion:reduce){.hd-flux,.hd-lent,.hd-pouls{animation:none}}</style>
