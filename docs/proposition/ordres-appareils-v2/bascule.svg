          <text x="537.0" y="225.0" font-size="11.2" fill="#94660a" font-weight="700">Un appui sans accusé</text>
          <text x="524.0" y="243.0" font-size="9.8" fill="#52615a">jamais parti ; retenté sur une reprise sûre : il part, une fois</text>
