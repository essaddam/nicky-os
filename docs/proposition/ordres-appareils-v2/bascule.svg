          <text x="57.0" y="225.0" font-size="11.2" fill="#8b3b22" font-weight="700">Remise, partie ou non</text>
          <text x="44.0" y="243.0" font-size="9.8" fill="#52615a">incertaine, jamais renvoyée ; confirmée par une lecture faite après la reprise</text>
