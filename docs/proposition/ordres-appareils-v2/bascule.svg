          <text x="44.0" y="305.0" font-size="9.8" fill="#52615a">une nouvelle tentative d'un appui d'avant : refusée, « ambiguë »</text>
          <rect x="510" y="264" width="460" height="52" rx="12" fill="url(#bascule-f-bleu)" stroke="#3b8db4" stroke-opacity=".55" stroke-width="1.1" filter="url(#bascule-o)"/>
          <circle cx="525" cy="283" r="4.5" fill="url(#bascule-h-bleu)"/>
          <text x="537.0" y="287.0" font-size="11.2" fill="#1b5873" font-weight="700">Un groupe à demi conclu</text>
          <text x="524.0" y="305.0" font-size="9.8" fill="#52615a">la copie a rejoué son compte : 3 sur 4</text>
          <rect x="30" y="326" width="460" height="52" rx="12" fill="url(#bascule-f-vert)" stroke="#3d9a75" stroke-opacity=".55" stroke-width="1.1" filter="url(#bascule-o)"/>
          <circle cx="45" cy="345" r="4.5" fill="url(#bascule-h-vert)"/>
          <text x="57.0" y="349.0" font-size="11.2" fill="#195744" font-weight="700">Retenue, bail, reçu</text>
          <text x="44.0" y="367.0" font-size="9.8" fill="#52615a">passent ; la retenue revérifiée ; le bail rétabli à son terme</text>
          <rect x="510" y="326" width="460" height="52" rx="12" fill="url(#bascule-f-violet)" stroke="#7e6cc2" stroke-opacity=".55" stroke-width="1.1" filter="url(#bascule-o)"/>
          <circle cx="525" cy="345" r="4.5" fill="url(#bascule-h-violet)"/>
          <text x="537.0" y="349.0" font-size="11.2" fill="#4b3d82" font-weight="700">Copies et écrans</text>
          <text x="524.0" y="367.0" font-size="9.8" fill="#52615a">une époque nouvelle : ils se rechargent par l'état complet</text>
  <text x="18" y="429" font-size="12" fill="#52615a" font-style="italic">La HA v2 admet la perte des dernières sorties en vol : une trace copiée après ne protège pas un appui fait avant (revue B2). L'accusé avant l'appui,</text>
  <text x="18" y="446" font-size="12" fill="#52615a" font-style="italic">le témoin et la reprise sûre ou non rendent « au plus une fois » vrai.</text>
</svg>
