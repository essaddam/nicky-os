<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 852" width="1000" height="852" role="img" aria-labelledby="systemes-t systemes-d" font-family="Avenir Next, Avenir, Segoe UI, sans-serif">
  <title id="systemes-t">Les deux systèmes, en détail : courtiers, cœur et clients</title>
  <desc id="systemes-d">Deux machines l'une sous l'autre. H1, actif : dans un seul binaire, le hub, le moteur, la base, le module WebSocket, l'API, le coffre et le journal, reliés en mémoire au courtier MQTT embarqué, qui écoute en 1883 (local), 8883 (réseau, TLS) et 8885 (secours, TLS) ; les modules api-to-mqtt parlent aux appareils et aux clouds ; Zigbee2MQTT et les modules à part sont clients de 1883 ; le contrôleur Matter parle à son module. Les écrans et les appareils MQTT du réseau viennent par l'adresse virtuelle de l'actif ; le boîtier radio A parle à Zigbee2MQTT. H2, passif : les mêmes composants en copie, son courtier sans client, ses modules et ses ponts radio arrêtés ; le pont à reprise, client de H1:8885, est le seul éditeur de son courtier. Le témoin vote le bail des deux.</desc>
