          <text x="16.0" y="790.0" font-size="10.5" fill="#52615a">À la bascule, H2 prend l'époque et l'adresse virtuelle, démarre Zigbee2MQTT, Matter et ses modules ; les clients se reconnectent à la même adresse ; le pont s'arrête.</text>
  <text x="16" y="831" font-size="12" fill="#52615a" font-style="italic">Un seul binaire par machine ; un courtier par machine ; les clients ne parlent qu'à l'actif, par l'adresse virtuelle. Le secours ne reçoit que le</text>
  <text x="16" y="848" font-size="12" fill="#52615a" font-style="italic">pont.</text>
