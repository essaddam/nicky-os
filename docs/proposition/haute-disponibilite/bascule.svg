<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 299" width="1000" height="299" role="img" aria-labelledby="bascule-t bascule-d" font-family="Avenir Next, Avenir, Segoe UI, sans-serif">
  <title id="bascule-t">La bascule et la fenêtre d'incertitude</title>
  <desc id="bascule-d">Une frise de 8 secondes. H1 renouvelle son bail chaque seconde puis gèle ; le témoin laisse courir le bail N trois secondes ; H2 demande l'époque suivante après une seconde de silence et la reçoit à la fin du bail. Entre le dernier enregistrement reçu et la fin du bail, ce qui était dû est incertain ; après, H2 agit et rattrape normalement.</desc>
  <rect width="1000" height="299" fill="#fffdf8"/>
          <defs>
            <marker id="bascule-v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#195744"/></marker>
            <marker id="bascule-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b07d12"/></marker>
            <marker id="bascule-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52615a"/></marker>
            <marker id="bascule-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b3b22"/></marker>
          </defs>
          <text x="16.0" y="26.0" font-size="11.5" fill="#52615a" font-weight="700">UNE BASCULE DE H1 VERS H2, ET CE QUI EST INCERTAIN</text>
          <line x1="60.0" y1="46.0" x2="60.0" y2="196.0" stroke="#d4ddd4" stroke-width="1"/>
          <text x="60.0" y="212.0" font-size="10" fill="#52615a" text-anchor="middle">0 s</text>
          <line x1="170.0" y1="46.0" x2="170.0" y2="196.0" stroke="#d4ddd4" stroke-width="1"/>
          <text x="170.0" y="212.0" font-size="10" fill="#52615a" text-anchor="middle">1 s</text>
          <line x1="280.0" y1="46.0" x2="280.0" y2="196.0" stroke="#d4ddd4" stroke-width="1"/>
          <text x="280.0" y="212.0" font-size="10" fill="#52615a" text-anchor="middle">2 s</text>
          <line x1="390.0" y1="46.0" x2="390.0" y2="196.0" stroke="#d4ddd4" stroke-width="1"/>
          <text x="390.0" y="212.0" font-size="10" fill="#52615a" text-anchor="middle">3 s</text>
          <line x1="500.0" y1="46.0" x2="500.0" y2="196.0" stroke="#d4ddd4" stroke-width="1"/>
          <text x="500.0" y="212.0" font-size="10" fill="#52615a" text-anchor="middle">4 s</text>
          <line x1="610.0" y1="46.0" x2="610.0" y2="196.0" stroke="#d4ddd4" stroke-width="1"/>
          <text x="610.0" y="212.0" font-size="10" fill="#52615a" text-anchor="middle">5 s</text>
          <line x1="720.0" y1="46.0" x2="720.0" y2="196.0" stroke="#d4ddd4" stroke-width="1"/>
          <text x="720.0" y="212.0" font-size="10" fill="#52615a" text-anchor="middle">6 s</text>
          <line x1="830.0" y1="46.0" x2="830.0" y2="196.0" stroke="#d4ddd4" stroke-width="1"/>
          <text x="830.0" y="212.0" font-size="10" fill="#52615a" text-anchor="middle">7 s</text>
          <line x1="940.0" y1="46.0" x2="940.0" y2="196.0" stroke="#d4ddd4" stroke-width="1"/>
          <text x="940.0" y="212.0" font-size="10" fill="#52615a" text-anchor="middle">8 s</text>
          <text x="16.0" y="66.0" font-size="11.5" fill="#1d302a" font-weight="700">H1</text>
          <circle cx="60.0" cy="62" r="4" fill="#195744"/>
          <circle cx="170.0" cy="62" r="4" fill="#195744"/>
          <circle cx="280.0" cy="62" r="4" fill="#195744"/>
          <text x="60.0" y="82.0" font-size="10" fill="#52615a">bail renouvelé chaque seconde</text>
          <rect x="313.0" y="54.0" width="220.0" height="16.0" rx="3" fill="#8b3b22" stroke="#8b3b22" stroke-width="1"/>
          <text x="313.0" y="50.0" font-size="10" fill="#8b3b22" font-weight="700">gel de H1</text>
          <text x="16.0" y="116.0" font-size="11.5" fill="#1d302a" font-weight="700">Témoin</text>
          <rect x="280.0" y="104.0" width="330.0" height="16.0" rx="3" fill="#e3c77f" stroke="#b07d12" stroke-width="1"/>
          <text x="286.0" y="116.0" font-size="10" fill="#1d302a" font-weight="700">le bail N court encore (3 s)</text>
          <text x="16.0" y="166.0" font-size="11.5" fill="#1d302a" font-weight="700">H2</text>
          <rect x="313.0" y="150.0" width="297.0" height="22.0" rx="3" fill="#fbe9e2" stroke="#8b3b22" stroke-width="1" stroke-dasharray="4 3"/>
          <text x="319.0" y="165.0" font-size="10" fill="#8b3b22" font-weight="700">incertain : « peut-être déjà parti », jamais rejoué</text>
          <rect x="610.0" y="150.0" width="330.0" height="22.0" rx="3" fill="#7fa892" stroke="#195744" stroke-width="1"/>
          <text x="616.0" y="165.0" font-size="10" fill="#1d302a" font-weight="700">époque N + 1 : H2 agit ; rattrapage normal (2 min)</text>
          <line x1="423.0" y1="124.0" x2="423.0" y2="146.0" stroke="#52615a" stroke-width="1.2" marker-end="url(#bascule-g)"/>
          <text x="427.0" y="140.0" font-size="9.5" fill="#52615a" paint-order="stroke" stroke="#fffdf8" stroke-width="4">silence ≥ 1 s : H2 demande N + 1</text>
          <text x="16.0" y="236.0" font-size="10.5" fill="#52615a">Domaine maison : le secours local seulement. Domaine cloud : le secours local avec la maison, ou le distant sur geste humain.</text>
          <text x="16.0" y="254.0" font-size="10.5" fill="#52615a">Chaque ordre porte l'époque de qui l'émet : un module refuse une époque plus ancienne.</text>
  <text x="16" y="295" font-size="12" fill="#52615a" font-style="italic">La fenêtre d'incertitude dure le bail : quelques secondes. Ce qui y tombe n'est ni rejoué ni perdu en silence.</text>
</svg>
