<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 384" width="1000" height="384" role="img" aria-labelledby="entrees-t entrees-d" font-family="Avenir Next, Avenir, Segoe UI, sans-serif">
  <title id="entrees-t">Pourquoi la copie par les entrées casse les attentes</title>
  <desc id="entrees-d">Trois rangées : l'actif, le secours A qui recopie les sorties, le secours B qui retraite les entrées. La porte s'ouvre à 21:42:03,120 ; l'actif note changé = 03,120 ; A recopie 03,120 ; B note 03,145, son horloge après le pont. Une attente « depuis 10 min » est armée sur l'actif avec depuis = 03,120 et part au journal. Après la bascule de 21:45, à l'échéance, A trouve changé égal à depuis et le déclencheur part ; B trouve 03,145 différent de 03,120 : l'attente est abandonnée.</desc>
  <rect width="1000" height="384" fill="#fffdf8"/>
          <defs>
            <marker id="entrees-v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#195744"/></marker>
            <marker id="entrees-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b07d12"/></marker>
            <marker id="entrees-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52615a"/></marker>
            <marker id="entrees-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b3b22"/></marker>
          </defs>
          <text x="16.0" y="82.0" font-size="11.5" fill="#1d302a" font-weight="700">ACTIF</text>
          <text x="16.0" y="164.0" font-size="11.5" fill="#195744" font-weight="700">SECOURS A</text>
          <text x="16.0" y="182.0" font-size="10.5" fill="#195744">recopie les sorties</text>
          <text x="16.0" y="256.0" font-size="11.5" fill="#b07d12" font-weight="700">SECOURS B</text>
          <text x="16.0" y="274.0" font-size="10.5" fill="#b07d12">retraite les entrées</text>
          <path d="M 180 106 L 180 262 L 286 262" fill="none" stroke="#b07d12" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#entrees-a)"/>
          <text x="186.0" y="200.0" font-size="9.5" fill="#b07d12" paint-order="stroke" stroke="#fffdf8" stroke-width="4">in/ par le pont</text>
          <rect x="150.0" y="50.0" width="120.0" height="56.0" rx="6" fill="#ffffff" stroke="#d4ddd4" stroke-width="1"/>
          <text x="162.0" y="69.0" font-size="11.5" fill="#1d302a" font-weight="700">Module</text>
          <text x="162.0" y="86.0" font-size="10" fill="#52615a">in/ : porte ouverte</text>
          <line x1="270.0" y1="78.0" x2="288.0" y2="78.0" stroke="#52615a" stroke-width="1.4" marker-end="url(#entrees-g)"/>
          <rect x="290.0" y="50.0" width="180.0" height="56.0" rx="6" fill="#ffffff" stroke="#195744" stroke-width="1"/>
          <text x="302.0" y="69.0" font-size="11.5" fill="#1d302a" font-weight="700">21:42:03,120</text>
          <text x="302.0" y="86.0" font-size="10" fill="#52615a">hub : changé = 03,120</text>
          <line x1="380.0" y1="106.0" x2="380.0" y2="140.0" stroke="#195744" stroke-width="2" marker-end="url(#entrees-v)"/>
          <text x="386.0" y="128.0" font-size="9.5" fill="#195744" font-weight="700" paint-order="stroke" stroke="#fffdf8" stroke-width="4">val/ : c = 03,120</text>
          <line x1="650.0" y1="106.0" x2="650.0" y2="232.0" stroke="#195744" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#entrees-v)"/>
          <rect x="290.0" y="142.0" width="180.0" height="56.0" rx="6" fill="#ffffff" stroke="#195744" stroke-width="1"/>
          <text x="302.0" y="161.0" font-size="11.5" fill="#1d302a" font-weight="700">changé = 03,120</text>
          <text x="302.0" y="178.0" font-size="10" fill="#52615a">recopié de la sortie</text>
          <rect x="290.0" y="234.0" width="180.0" height="56.0" rx="6" fill="#ffffff" stroke="#b07d12" stroke-width="1"/>
          <text x="302.0" y="253.0" font-size="11.5" fill="#1d302a" font-weight="700">changé = 03,145</text>
          <text x="302.0" y="270.0" font-size="10" fill="#52615a">son horloge, après le pont</text>
          <rect x="490.0" y="50.0" width="180.0" height="56.0" rx="6" fill="#ffffff" stroke="#195744" stroke-width="1"/>
          <text x="502.0" y="69.0" font-size="11.5" fill="#1d302a" font-weight="700">attente armée</text>
          <text x="502.0" y="86.0" font-size="10" fill="#52615a">depuis = 03,120</text>
          <line x1="580.0" y1="106.0" x2="580.0" y2="140.0" stroke="#195744" stroke-width="2" marker-end="url(#entrees-v)"/>
          <text x="586.0" y="128.0" font-size="9.5" fill="#195744" font-weight="700" paint-order="stroke" stroke="#fffdf8" stroke-width="4">journal</text>
          <rect x="490.0" y="142.0" width="180.0" height="56.0" rx="6" fill="#ffffff" stroke="#195744" stroke-width="1"/>
          <text x="502.0" y="161.0" font-size="11.5" fill="#1d302a" font-weight="700">attente reçue</text>
          <text x="502.0" y="178.0" font-size="10" fill="#52615a">depuis = 03,120</text>
          <rect x="490.0" y="234.0" width="180.0" height="56.0" rx="6" fill="#ffffff" stroke="#b07d12" stroke-width="1"/>
          <text x="502.0" y="253.0" font-size="11.5" fill="#1d302a" font-weight="700">attente reçue</text>
          <text x="502.0" y="270.0" font-size="10" fill="#52615a">depuis = 03,120</text>
          <line x1="690.0" y1="36.0" x2="690.0" y2="300.0" stroke="#8b3b22" stroke-width="1.6" stroke-dasharray="6 4"/>
          <text x="696.0" y="46.0" font-size="10.5" fill="#8b3b22" font-weight="700">21:45 : bascule</text>
          <rect x="710.0" y="56.0" width="274.0" height="50.0" rx="6" fill="#ffffff" stroke="#d4ddd4" stroke-width="1"/>
          <text x="722.0" y="75.0" font-size="11.5" fill="#1d302a" font-weight="700">H1 gelé</text>
          <text x="722.0" y="92.0" font-size="10" fill="#52615a">H2 porte l'époque suivante</text>
          <rect x="710.0" y="142.0" width="274.0" height="66.0" rx="6" fill="#ffffff" stroke="#195744" stroke-width="1"/>
          <text x="722.0" y="161.0" font-size="11.5" fill="#1d302a" font-weight="700">à 21:52:03,120</text>
          <text x="722.0" y="178.0" font-size="10" fill="#52615a">changé 03,120 = depuis 03,120</text>
          <text x="722.0" y="193.0" font-size="10" fill="#52615a">le déclencheur part ✓</text>
          <rect x="710.0" y="228.0" width="274.0" height="66.0" rx="6" fill="#ffffff" stroke="#8b3b22" stroke-width="1"/>
          <text x="722.0" y="247.0" font-size="11.5" fill="#1d302a" font-weight="700">à 21:52:03,120</text>
          <text x="722.0" y="264.0" font-size="10" fill="#52615a">changé 03,145 ≠ depuis 03,120</text>
          <text x="722.0" y="279.0" font-size="10" fill="#52615a">attente abandonnée : perdu, sans un mot ✗</text>
          <text x="16.0" y="322.0" font-size="10.5" fill="#52615a">L'instant « changé » sert de version à la valeur (mémoire v2 § 8.5) : il doit être celui de l'actif, à la milliseconde.</text>
  <text x="16" y="363" font-size="12" fill="#52615a" font-style="italic">Un secours qui date lui-même ses valeurs a d'autres instants « changé » que l'actif : toutes les attentes armées avant la bascule échouent à leur</text>
  <text x="16" y="380" font-size="12" fill="#52615a" font-style="italic">revérification.</text>
</svg>
