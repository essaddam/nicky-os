<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 301" width="1000" height="301" role="img" aria-labelledby="arret-t arret-d" font-family="Avenir Next, Avenir, Segoe UI, sans-serif">
  <title id="arret-t">L'arrêt figé, pas à pas</title>
  <desc id="arret-d">Huit étapes, une par ligne, sur une frise de 0 à 2 secondes : annonce, attente des ordres en vol (au plus une seconde), arrêt des pilotes, gel de la mémoire au rang (N, M), écriture de l'instantané, marque d'arrêt propre au journal, relève éventuelle, fin.</desc>
  <rect width="1000" height="301" fill="#fffdf8"/>
          <text x="16.0" y="26.0" font-size="11.5" fill="#52615a" font-weight="700">L'ARRÊT FIGÉ : BUDGET VISÉ 2 S, SOUS LES 10 S DE DOCKER</text>
          <line x1="470.0" y1="42.0" x2="470.0" y2="240.0" stroke="#d4ddd4" stroke-width="1"/>
          <text x="470.0" y="256.0" font-size="10" fill="#52615a" text-anchor="middle">0,0 s</text>
          <line x1="595.0" y1="42.0" x2="595.0" y2="240.0" stroke="#d4ddd4" stroke-width="1"/>
          <text x="595.0" y="256.0" font-size="10" fill="#52615a" text-anchor="middle">0,5 s</text>
          <line x1="720.0" y1="42.0" x2="720.0" y2="240.0" stroke="#d4ddd4" stroke-width="1"/>
          <text x="720.0" y="256.0" font-size="10" fill="#52615a" text-anchor="middle">1,0 s</text>
          <line x1="845.0" y1="42.0" x2="845.0" y2="240.0" stroke="#d4ddd4" stroke-width="1"/>
          <text x="845.0" y="256.0" font-size="10" fill="#52615a" text-anchor="middle">1,5 s</text>
          <line x1="970.0" y1="42.0" x2="970.0" y2="240.0" stroke="#d4ddd4" stroke-width="1"/>
          <text x="970.0" y="256.0" font-size="10" fill="#52615a" text-anchor="middle">2,0 s</text>
          <text x="16.0" y="59.0" font-size="11" fill="#1d302a" font-weight="700">1. annonce</text>
          <text x="150.0" y="59.0" font-size="10.5" fill="#52615a">sys/arret ; plus d'ordre accepté</text>
          <rect x="470.0" y="48.0" width="12.5" height="14.0" rx="3" fill="#195744" stroke="#195744" stroke-width="1"/>
          <text x="16.0" y="83.0" font-size="11" fill="#1d302a" font-weight="700">2. ordres en vol</text>
          <text x="150.0" y="83.0" font-size="10.5" fill="#52615a">1 s au plus, sinon « incertain »</text>
          <rect x="482.5" y="72.0" width="250.0" height="14.0" rx="3" fill="#b07d12" stroke="#b07d12" stroke-width="1"/>
          <text x="16.0" y="107.0" font-size="11" fill="#1d302a" font-weight="700">3. pilotes</text>
          <text x="150.0" y="107.0" font-size="10.5" fill="#52615a">arrêt, déconnexion</text>
          <rect x="732.5" y="96.0" width="75.0" height="14.0" rx="3" fill="#195744" stroke="#195744" stroke-width="1"/>
          <text x="16.0" y="131.0" font-size="11" fill="#1d302a" font-weight="700">4. figer</text>
          <text x="150.0" y="131.0" font-size="10.5" fill="#52615a">s = N, j = M</text>
          <rect x="807.5" y="120.0" width="12.5" height="14.0" rx="3" fill="#195744" stroke="#195744" stroke-width="1"/>
          <text x="16.0" y="155.0" font-size="11" fill="#1d302a" font-weight="700">5. instantané</text>
          <text x="150.0" y="155.0" font-size="10.5" fill="#52615a">écrit, fsync</text>
          <rect x="820.0" y="144.0" width="37.5" height="14.0" rx="3" fill="#195744" stroke="#195744" stroke-width="1"/>
          <text x="16.0" y="179.0" font-size="11" fill="#1d302a" font-weight="700">6. marque</text>
          <text x="150.0" y="179.0" font-size="10.5" fill="#52615a">« arrêt propre à (N, M) »</text>
          <rect x="857.5" y="168.0" width="12.5" height="14.0" rx="3" fill="#195744" stroke="#195744" stroke-width="1"/>
          <text x="16.0" y="203.0" font-size="11" fill="#1d302a" font-weight="700">7. relève</text>
          <text x="150.0" y="203.0" font-size="10.5" fill="#52615a">si le secours prend la main</text>
          <rect x="870.0" y="192.0" width="62.5" height="14.0" rx="3" fill="#b07d12" stroke="#b07d12" stroke-width="1"/>
          <text x="16.0" y="227.0" font-size="11" fill="#1d302a" font-weight="700">8. fin</text>
          <text x="150.0" y="227.0" font-size="10.5" fill="#52615a">le processus s'arrête</text>
          <rect x="932.5" y="216.0" width="12.5" height="14.0" rx="3" fill="#195744" stroke="#195744" stroke-width="1"/>
  <text x="16" y="297" font-size="12" fill="#52615a" font-style="italic">Seule l'attente des ordres en vol prend du temps ; figer et écrire l'instantané se compte en millisecondes (§ 9.5).</text>
</svg>
