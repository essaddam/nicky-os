<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 357" width="1000" height="357" role="img" aria-labelledby="stockages-t stockages-d" font-family="Avenir Next, Avenir, Segoe UI, sans-serif">
  <title id="stockages-t">Plusieurs stockages, et qui fait quoi</title>
  <desc id="stockages-d">Un tableau en trois colonnes, l'actif, le secours local et le secours distant, et quatre rangées : l'état courant, écrit partout depuis les sorties ; le récent, rangé par l'actif avec son rang, copié avec les mêmes rangs par le secours local, dérivé par le distant ; le long terme, exporté par le seul porteur de l'époque ; et qui répond aux questions.</desc>
  <rect width="1000" height="357" fill="#fffdf8"/>
          <defs>
            <marker id="stockages-v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#195744"/></marker>
            <marker id="stockages-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b07d12"/></marker>
            <marker id="stockages-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52615a"/></marker>
            <marker id="stockages-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b3b22"/></marker>
          </defs>
          <text x="320.0" y="30.0" font-size="11.5" fill="#195744" font-weight="700" text-anchor="middle">ACTIF</text>
          <text x="592.0" y="30.0" font-size="11.5" fill="#195744" font-weight="700" text-anchor="middle">SECOURS LOCAL</text>
          <text x="864.0" y="30.0" font-size="11.5" fill="#b07d12" font-weight="700" text-anchor="middle">SECOURS DISTANT</text>
          <text x="16.0" y="66.0" font-size="11.5" fill="#1d302a" font-weight="700">État courant</text>
          <text x="16.0" y="82.0" font-size="10" fill="#52615a" font-family="SFMono-Regular, Consolas, monospace">maison.db</text>
          <rect x="200.0" y="50.0" width="240.0" height="40.0" rx="6" fill="#ffffff" stroke="#195744" stroke-width="1.4"/>
          <text x="320.0" y="75.0" font-size="10.5" fill="#1d302a" text-anchor="middle">écrit depuis ses sorties</text>
          <rect x="472.0" y="50.0" width="240.0" height="40.0" rx="6" fill="#ffffff" stroke="#195744" stroke-width="1.4"/>
          <text x="592.0" y="75.0" font-size="10.5" fill="#1d302a" text-anchor="middle">écrit depuis les sorties reçues</text>
          <rect x="744.0" y="50.0" width="240.0" height="40.0" rx="6" fill="#ffffff" stroke="#195744" stroke-width="1.4"/>
          <text x="864.0" y="75.0" font-size="10.5" fill="#1d302a" text-anchor="middle">écrit depuis les sorties reçues</text>
          <text x="16.0" y="130.0" font-size="11.5" fill="#1d302a" font-weight="700">Récent</text>
          <text x="16.0" y="146.0" font-size="10" fill="#52615a" font-family="SFMono-Regular, Consolas, monospace">moli.db (D13)</text>
          <rect x="200.0" y="114.0" width="240.0" height="40.0" rx="6" fill="#ffffff" stroke="#195744" stroke-width="1.4"/>
          <text x="320.0" y="139.0" font-size="10.5" fill="#1d302a" text-anchor="middle">opérations, rang seq</text>
          <rect x="472.0" y="114.0" width="240.0" height="40.0" rx="6" fill="#ffffff" stroke="#195744" stroke-width="1.4"/>
          <text x="592.0" y="139.0" font-size="10.5" fill="#1d302a" text-anchor="middle">copie de reprise : mêmes rangs</text>
          <rect x="744.0" y="114.0" width="240.0" height="40.0" rx="6" fill="#ffffff" stroke="#b07d12" stroke-width="1.4"/>
          <text x="864.0" y="139.0" font-size="10.5" fill="#1d302a" text-anchor="middle">copie de lecture : peut dériver</text>
          <text x="16.0" y="194.0" font-size="11.5" fill="#1d302a" font-weight="700">Long terme</text>
          <text x="16.0" y="210.0" font-size="10" fill="#52615a" font-family="SFMono-Regular, Consolas, monospace">archive Parquet</text>
          <rect x="200.0" y="178.0" width="240.0" height="40.0" rx="6" fill="#ffffff" stroke="#195744" stroke-width="1.4"/>
          <text x="320.0" y="203.0" font-size="10.5" fill="#1d302a" text-anchor="middle">exporte : seul porteur de l'époque</text>
          <rect x="472.0" y="178.0" width="240.0" height="40.0" rx="6" fill="#ffffff" stroke="#195744" stroke-width="1.4"/>
          <text x="592.0" y="203.0" font-size="10.5" fill="#1d302a" text-anchor="middle">exporte après la bascule</text>
          <rect x="744.0" y="178.0" width="240.0" height="40.0" rx="6" fill="#ffffff" stroke="#b07d12" stroke-width="1.4"/>
          <text x="864.0" y="203.0" font-size="10.5" fill="#1d302a" text-anchor="middle">peut héberger l'archive</text>
          <text x="16.0" y="258.0" font-size="11.5" fill="#1d302a" font-weight="700">Qui répond</text>
          <text x="16.0" y="274.0" font-size="10" fill="#52615a" font-family="SFMono-Regular, Consolas, monospace">aux questions</text>
          <rect x="200.0" y="242.0" width="240.0" height="40.0" rx="6" fill="#ffffff" stroke="#195744" stroke-width="1.4"/>
          <text x="320.0" y="267.0" font-size="10.5" fill="#1d302a" text-anchor="middle">les écrans, les courbes</text>
          <rect x="472.0" y="242.0" width="240.0" height="40.0" rx="6" fill="#ffffff" stroke="#195744" stroke-width="1.4"/>
          <text x="592.0" y="267.0" font-size="10.5" fill="#1d302a" text-anchor="middle">après la bascule</text>
          <rect x="744.0" y="242.0" width="240.0" height="40.0" rx="6" fill="#ffffff" stroke="#b07d12" stroke-width="1.4"/>
          <text x="864.0" y="267.0" font-size="10.5" fill="#1d302a" text-anchor="middle">la maison éteinte : « hier ? »</text>
          <text x="16.0" y="312.0" font-size="10.5" fill="#52615a">L'état courant se refait à l'identique depuis les sorties ; l'historique, non : une copie qui doit reprendre l'export reçoit les opérations de l'actif.</text>
  <text x="16" y="353" font-size="12" fill="#52615a" font-style="italic">Copie de reprise : mêmes opérations, mêmes rangs, elle peut reprendre l'export. Copie de lecture : elle répond aux questions, elle n'exporte jamais.</text>
</svg>
