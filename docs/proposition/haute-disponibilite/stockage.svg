          <text x="16.0" y="222.0" font-size="11" fill="#52615a">L'archive a reçu les rangs jusqu'à K ; elle exige pour la suite exactement les mêmes octets (sinon 409). Le secours qui dérive diverge dès le 1 974e rang :</text>
          <text x="16.0" y="240.0" font-size="11" fill="#52615a">il ne peut pas reprendre l'export. Le secours qui reçoit les opérations de l'actif, avec leur rang, le peut.</text>
  <text x="16" y="285" font-size="12" fill="#52615a" font-style="italic">Un import, une correction, une heure close à l'horloge de chaque machine : deux bases dérivées du même flux ne donnent pas les mêmes rangs.</text>
