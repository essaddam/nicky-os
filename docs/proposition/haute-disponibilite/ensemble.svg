<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-labelledby="ensemble-t ensemble-d" font-family="Avenir Next, Avenir, Segoe UI, sans-serif">
  <title id="ensemble-t">La maison en double, vue d'ensemble</title>
  <desc id="ensemble-d">À gauche, la maison : l'actif H1 porte les époques et envoie ses sorties au secours local H2 par le pont ; un témoin vote le bail ; deux boîtiers radio, Thread actif sur les deux, Zigbee actif sur A seulement ; les appareils parlent à l'adresse virtuelle de l'actif. À droite, hors de la maison : le secours distant reçoit le pont par NetBird, l'archive reçoit l'export, les clouds ne sont appelés que par le porteur du cloud.</desc>
  <rect width="1000" height="470" fill="#fffdf8"/>
          <defs>
            <marker id="ensemble-v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#195744"/></marker>
            <marker id="ensemble-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b07d12"/></marker>
            <marker id="ensemble-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52615a"/></marker>
            <marker id="ensemble-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b3b22"/></marker>
          </defs>
          <text x="16.0" y="26.0" font-size="11.5" fill="#52615a" font-weight="700">LA MAISON</text>
          <text x="700.0" y="26.0" font-size="11.5" fill="#52615a" font-weight="700">HORS DE LA MAISON</text>
          <rect x="16.0" y="36.0" width="600.0" height="378.0" rx="8" fill="#f1f4ee" stroke="#d4ddd4" stroke-width="1"/>
          <rect x="32.0" y="52.0" width="250.0" height="112.0" rx="6" fill="#ffffff" stroke="#195744" stroke-width="1"/>
          <text x="44.0" y="71.0" font-size="11.5" fill="#1d302a" font-weight="700">H2 · secours local (passif)</text>
          <text x="44.0" y="88.0" font-size="10" fill="#52615a">pont à reprise, copie du journal</text>
          <text x="44.0" y="103.0" font-size="10" fill="#52615a">hub et base en copie</text>
          <text x="44.0" y="118.0" font-size="10" fill="#52615a">moteur sans aucune action</text>
          <text x="44.0" y="133.0" font-size="10" fill="#52615a">pilotes et ponts radio arrêtés</text>
          <rect x="350.0" y="52.0" width="250.0" height="112.0" rx="6" fill="#ffffff" stroke="#195744" stroke-width="1"/>
          <text x="362.0" y="71.0" font-size="11.5" fill="#1d302a" font-weight="700">H1 · actif (porte les époques)</text>
          <text x="362.0" y="88.0" font-size="10" fill="#52615a">hub, moteur, coffre, base</text>
          <text x="362.0" y="103.0" font-size="10" fill="#52615a">courtier, journal (7 jours)</text>
          <text x="362.0" y="118.0" font-size="10" fill="#52615a">pilotes, Zigbee2MQTT, Matter</text>
          <text x="362.0" y="133.0" font-size="10" fill="#52615a">seul à agir, numéroter, exporter</text>
          <line x1="348.0" y1="88.0" x2="284.0" y2="88.0" stroke="#195744" stroke-width="2.4" marker-end="url(#ensemble-v)"/>
          <text x="316.0" y="80.0" font-size="10.5" fill="#195744" font-weight="700" text-anchor="middle" paint-order="stroke" stroke="#fffdf8" stroke-width="4">pont</text>
          <line x1="284.0" y1="128.0" x2="348.0" y2="128.0" stroke="#b07d12" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ensemble-a)"/>
          <text x="316.0" y="146.0" font-size="9.5" fill="#b07d12" text-anchor="middle" paint-order="stroke" stroke="#fffdf8" stroke-width="4">accusés</text>
          <rect x="32.0" y="190.0" width="170.0" height="52.0" rx="6" fill="#ffffff" stroke="#d4ddd4" stroke-width="1"/>
          <text x="44.0" y="209.0" font-size="11.5" fill="#1d302a" font-weight="700">Témoin</text>
          <text x="44.0" y="226.0" font-size="10" fill="#52615a">vote le bail de l'époque</text>
          <line x1="117.0" y1="164.0" x2="117.0" y2="188.0" stroke="#52615a" stroke-width="1.2" stroke-dasharray="3 3"/>
          <path d="M 400 164 L 400 177 L 186 177 L 186 188" fill="none" stroke="#52615a" stroke-width="1.2" stroke-dasharray="3 3"/>
          <rect x="232.0" y="190.0" width="176.0" height="52.0" rx="6" fill="#ffffff" stroke="#195744" stroke-width="1"/>
          <text x="244.0" y="209.0" font-size="11.5" fill="#1d302a" font-weight="700">Boîtier radio A</text>
          <text x="244.0" y="226.0" font-size="10" fill="#52615a">Zigbee actif · Thread actif</text>
          <rect x="424.0" y="190.0" width="176.0" height="52.0" rx="6" fill="#ffffff" stroke="#b07d12" stroke-width="1"/>
          <text x="436.0" y="209.0" font-size="11.5" fill="#1d302a" font-weight="700">Boîtier radio B</text>
          <text x="436.0" y="226.0" font-size="10" fill="#52615a">Zigbee secours · Thread actif</text>
          <rect x="32.0" y="262.0" width="568.0" height="50.0" rx="6" fill="#ffffff" stroke="#d4ddd4" stroke-width="1"/>
          <text x="46.0" y="282.0" font-size="11.5" fill="#1d302a" font-weight="700">Appareils : Zigbee, Thread, Wi-Fi, MQTT du réseau local</text>
          <text x="46.0" y="300.0" font-size="10" fill="#52615a">ils parlent à l'adresse virtuelle de l'actif (VRRP) ; les radios suivent l'époque</text>
          <text x="32.0" y="338.0" font-size="10.5" fill="#52615a">Le témoin départage H1 et H2 ; sans lui, la promotion du secours reste humaine (V7 § 18).</text>
          <text x="32.0" y="356.0" font-size="10.5" fill="#52615a">Une liaison Zigbee directe (interrupteur → lampe) marche même quand tout le reste est tombé.</text>
          <text x="32.0" y="374.0" font-size="10.5" fill="#52615a">Thread : un routeur de bordure sur chaque boîtier, rien à basculer. Zigbee, Matter : un seul écrivain.</text>
          <text x="32.0" y="392.0" font-size="10.5" fill="#52615a">Le secours local peut tout reprendre ; il ne fait rien tant qu'il ne porte pas l'époque.</text>
          <rect x="700.0" y="52.0" width="260.0" height="98.0" rx="6" fill="#ffffff" stroke="#b07d12" stroke-width="1"/>
          <text x="712.0" y="71.0" font-size="11.5" fill="#1d302a" font-weight="700">Secours distant</text>
          <text x="712.0" y="88.0" font-size="10" fill="#52615a">copie : mémoire, journal, historique</text>
          <text x="712.0" y="103.0" font-size="10" fill="#52615a">alerte si la maison se tait</text>
          <text x="712.0" y="118.0" font-size="10" fill="#52615a">cloud : sur geste humain</text>
          <text x="712.0" y="133.0" font-size="10" fill="#52615a">jamais les radios ni le réseau local</text>
          <rect x="700.0" y="176.0" width="260.0" height="52.0" rx="6" fill="#ffffff" stroke="#d4ddd4" stroke-width="1"/>
          <text x="712.0" y="195.0" font-size="11.5" fill="#1d302a" font-weight="700">Archive (Parquet, long terme)</text>
          <text x="712.0" y="212.0" font-size="10" fill="#52615a">reçoit l'export du porteur de l'époque</text>
          <rect x="700.0" y="254.0" width="260.0" height="52.0" rx="6" fill="#ffffff" stroke="#d4ddd4" stroke-width="1"/>
          <text x="712.0" y="273.0" font-size="11.5" fill="#1d302a" font-weight="700">Clouds : Netatmo, Voltalis, Ariston…</text>
          <text x="712.0" y="290.0" font-size="10" fill="#52615a">appelés par le seul porteur du cloud</text>
          <line x1="602.0" y1="80.0" x2="698.0" y2="80.0" stroke="#195744" stroke-width="2.4" marker-end="url(#ensemble-v)"/>
          <text x="650.0" y="72.0" font-size="10" fill="#195744" font-weight="700" text-anchor="middle" paint-order="stroke" stroke="#fffdf8" stroke-width="4">NetBird</text>
          <path d="M 602 136 C 640 136 650 202 698 202" fill="none" stroke="#52615a" stroke-width="1.4" marker-end="url(#ensemble-g)"/>
          <text x="648.0" y="172.0" font-size="10" fill="#52615a" font-weight="700" text-anchor="middle" paint-order="stroke" stroke="#fffdf8" stroke-width="4">export</text>
          <path d="M 602 152 C 630 152 650 280 698 280" fill="none" stroke="#b07d12" stroke-width="1.4" marker-end="url(#ensemble-a)"/>
          <text x="632.0" y="246.0" font-size="10" fill="#b07d12" font-weight="700" text-anchor="middle" paint-order="stroke" stroke="#fffdf8" stroke-width="4">cloud</text>
          <path d="M 960 100 L 978 100 L 978 280 L 962 280" fill="none" stroke="#b07d12" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#ensemble-a)"/>
          <text x="700.0" y="330.0" font-size="10" fill="#b07d12">Le distant n'appelle les clouds que s'il est promu (geste humain).</text>
  <text x="16" y="449" font-size="12" fill="#52615a" font-style="italic">Une seule machine agit à la fois ; les autres copient. Le secours local peut tout reprendre ; le distant, seulement le cloud, et seulement sur un</text>
  <text x="16" y="466" font-size="12" fill="#52615a" font-style="italic">geste humain.</text>
</svg>
