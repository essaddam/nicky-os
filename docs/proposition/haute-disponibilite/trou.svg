<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 395" width="1000" height="395" role="img" aria-labelledby="trou-t trou-d" font-family="Avenir Next, Avenir, Segoe UI, sans-serif">
  <title id="trou-t">Comment un trou se comble</title>
  <desc id="trou-d">Diagramme de séquence entre le journal de l'actif, le courtier de l'actif, le pont à reprise et la copie du journal du secours. Les sorties 98 à 100 passent en direct ; une coupure fait perdre 101 à 250 ; à la reconnexion, le pont demande le journal à partir de 101 ; les sorties 251 et 252 arrivent en direct et attendent dans le tampon ; les tronçons 101 à 250 arrivent ; le pont publie tout dans l'ordre.</desc>
  <rect width="1000" height="395" fill="#fffdf8"/>
          <defs>
            <marker id="trou-v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#195744"/></marker>
            <marker id="trou-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b07d12"/></marker>
            <marker id="trou-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52615a"/></marker>
            <marker id="trou-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b3b22"/></marker>
          </defs>
          <rect x="18.0" y="36.0" width="184.0" height="26.0" rx="5" fill="#ffffff" stroke="#d4ddd4" stroke-width="1"/>
          <text x="110.0" y="53.0" font-size="11" fill="#1d302a" font-weight="700" text-anchor="middle">Journal de l'actif</text>
          <line x1="110.0" y1="62.0" x2="110.0" y2="330.0" stroke="#d4ddd4" stroke-width="1" stroke-dasharray="3 3"/>
          <rect x="238.0" y="36.0" width="184.0" height="26.0" rx="5" fill="#ffffff" stroke="#d4ddd4" stroke-width="1"/>
          <text x="330.0" y="53.0" font-size="11" fill="#1d302a" font-weight="700" text-anchor="middle">Courtier de l'actif</text>
          <line x1="330.0" y1="62.0" x2="330.0" y2="330.0" stroke="#d4ddd4" stroke-width="1" stroke-dasharray="3 3"/>
          <rect x="478.0" y="36.0" width="184.0" height="26.0" rx="5" fill="#ffffff" stroke="#d4ddd4" stroke-width="1"/>
          <text x="570.0" y="53.0" font-size="11" fill="#1d302a" font-weight="700" text-anchor="middle">Pont à reprise</text>
          <line x1="570.0" y1="62.0" x2="570.0" y2="330.0" stroke="#d4ddd4" stroke-width="1" stroke-dasharray="3 3"/>
          <rect x="758.0" y="36.0" width="184.0" height="26.0" rx="5" fill="#ffffff" stroke="#d4ddd4" stroke-width="1"/>
          <text x="850.0" y="53.0" font-size="11" fill="#1d302a" font-weight="700" text-anchor="middle">Copie du journal, secours</text>
          <line x1="850.0" y1="62.0" x2="850.0" y2="330.0" stroke="#d4ddd4" stroke-width="1" stroke-dasharray="3 3"/>
          <line x1="330.0" y1="88.0" x2="566.0" y2="88.0" stroke="#195744" stroke-width="1.8" marker-end="url(#trou-v)"/>
          <text x="450.0" y="82.0" font-size="10" fill="#195744" font-weight="700" text-anchor="middle" paint-order="stroke" stroke="#fffdf8" stroke-width="4">sorties 98, 99, 100, en direct</text>
          <line x1="570.0" y1="112.0" x2="846.0" y2="112.0" stroke="#195744" stroke-width="1.8" marker-end="url(#trou-v)"/>
          <text x="710.0" y="106.0" font-size="10" fill="#195744" font-weight="700" text-anchor="middle" paint-order="stroke" stroke="#fffdf8" stroke-width="4">écrites, puis publiées : 98, 99, 100</text>
          <rect x="340.0" y="128.0" width="220.0" height="26.0" rx="4" fill="#fbe9e2" stroke="#8b3b22" stroke-width="1" stroke-dasharray="4 3"/>
          <text x="450.0" y="145.0" font-size="10" fill="#8b3b22" font-weight="700" text-anchor="middle">coupure : 101 à 250 passent sans lui</text>
          <line x1="570.0" y1="178.0" x2="334.0" y2="178.0" stroke="#b07d12" stroke-width="1.5" marker-end="url(#trou-a)"/>
          <text x="450.0" y="172.0" font-size="10" fill="#b07d12" font-weight="700" text-anchor="middle" paint-order="stroke" stroke="#fffdf8" stroke-width="4">reconnexion, abonnement, demande {de : 101}</text>
          <line x1="330.0" y1="202.0" x2="114.0" y2="202.0" stroke="#b07d12" stroke-width="1.5" marker-end="url(#trou-a)"/>
          <text x="220.0" y="196.0" font-size="10" fill="#b07d12" font-weight="700" text-anchor="middle" paint-order="stroke" stroke="#fffdf8" stroke-width="4">demande</text>
          <line x1="330.0" y1="228.0" x2="566.0" y2="228.0" stroke="#195744" stroke-width="1.8" marker-end="url(#trou-v)"/>
          <text x="450.0" y="222.0" font-size="10" fill="#195744" text-anchor="middle" paint-order="stroke" stroke="#fffdf8" stroke-width="4">251, 252 en direct : gardées en tampon</text>
          <line x1="110.0" y1="256.0" x2="566.0" y2="256.0" stroke="#b07d12" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#trou-a)"/>
          <text x="340.0" y="250.0" font-size="10" fill="#b07d12" font-weight="700" text-anchor="middle" paint-order="stroke" stroke="#fffdf8" stroke-width="4">tronçons 101–164, 165–228, 229–250 (une fenêtre)</text>
          <line x1="570.0" y1="284.0" x2="846.0" y2="284.0" stroke="#195744" stroke-width="1.8" marker-end="url(#trou-v)"/>
          <text x="710.0" y="278.0" font-size="10" fill="#195744" font-weight="700" text-anchor="middle" paint-order="stroke" stroke="#fffdf8" stroke-width="4">101 … 250, puis 251, 252 : dans l'ordre</text>
          <rect x="730.0" y="296.0" width="240.0" height="30.0" rx="5" fill="#f1f4ee" stroke="#d4ddd4" stroke-width="1"/>
          <text x="850.0" y="315.0" font-size="10" fill="#52615a" text-anchor="middle">les abonnés locaux n'ont vu qu'un retard</text>
          <text x="16.0" y="350.0" font-size="10.5" fill="#52615a">Le courtier n'a rien à garder : le trou se voit au rang s, le journal de l'actif le comble, le pont remet l'ordre.</text>
  <text x="16" y="391" font-size="12" fill="#52615a" font-style="italic">Une fenêtre de 32 tronçons de 64 sorties à la fois : le courtier ne saute jamais une fenêtre. Le pont écrit dans la copie du journal avant de publier.</text>
</svg>
