<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 463" width="1000" height="463" role="img" aria-labelledby="reprise-t reprise-d" font-family="Avenir Next, Avenir, Segoe UI, sans-serif">
  <title id="reprise-t">La reprise après un arrêt, même des jours plus tard</title>
  <desc id="reprise-d">Un organigramme. Au démarrage : si le journal finit par « arrêt propre », on charge l'instantané sans rien rejouer ; sinon, le dernier instantané périodique puis le journal. Ensuite, dans l'ordre : la grâce pour chaque appareil, les exécutions reprises ou interrompues selon la règle des 2 minutes, les heures tombées pendant l'arrêt parties ou manquées, les rappels d'agenda, les jetons.</desc>
  <rect width="1000" height="463" fill="#fffdf8"/>
          <defs>
            <marker id="reprise-v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#195744"/></marker>
            <marker id="reprise-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b07d12"/></marker>
            <marker id="reprise-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52615a"/></marker>
            <marker id="reprise-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b3b22"/></marker>
          </defs>
          <rect x="400.0" y="28.0" width="200.0" height="30.0" rx="15" fill="#195744" stroke="#195744" stroke-width="1"/>
          <text x="500.0" y="48.0" font-size="11.5" fill="#ffffff" font-weight="700" text-anchor="middle">Démarrage</text>
          <line x1="500.0" y1="58.0" x2="500.0" y2="78.0" stroke="#52615a" stroke-width="1.4" marker-end="url(#reprise-g)"/>
          <rect x="260.0" y="80.0" width="480.0" height="42.0" rx="21" fill="#ffffff" stroke="#b07d12" stroke-width="1.6"/>
          <text x="500.0" y="106.0" font-size="11.5" fill="#1d302a" font-weight="700" text-anchor="middle">Le journal finit-il par « arrêt propre à (N, M) » ?</text>
          <line x1="260.0" y1="101.0" x2="180.0" y2="101.0" stroke="#195744" stroke-width="1.6"/>
          <line x1="180.0" y1="101.0" x2="180.0" y2="140.0" stroke="#195744" stroke-width="1.6" marker-end="url(#reprise-v)"/>
          <text x="220.0" y="95.0" font-size="10" fill="#195744" font-weight="700" text-anchor="middle">oui</text>
          <line x1="740.0" y1="101.0" x2="820.0" y2="101.0" stroke="#b07d12" stroke-width="1.6"/>
          <line x1="820.0" y1="101.0" x2="820.0" y2="140.0" stroke="#b07d12" stroke-width="1.6" marker-end="url(#reprise-a)"/>
          <text x="780.0" y="95.0" font-size="10" fill="#b07d12" font-weight="700" text-anchor="middle">non</text>
          <rect x="16.0" y="142.0" width="330.0" height="52.0" rx="6" fill="#ffffff" stroke="#195744" stroke-width="1"/>
          <text x="28.0" y="161.0" font-size="11.5" fill="#1d302a" font-weight="700">Charger l'instantané</text>
          <text x="28.0" y="178.0" font-size="10" fill="#52615a">la mémoire au rang (N, M), rien à rejouer</text>
          <rect x="654.0" y="142.0" width="330.0" height="52.0" rx="6" fill="#ffffff" stroke="#b07d12" stroke-width="1"/>
          <text x="666.0" y="161.0" font-size="11.5" fill="#1d302a" font-weight="700">Dernier instantané périodique</text>
          <text x="666.0" y="178.0" font-size="10" fill="#52615a">puis rejouer le journal après lui</text>
          <path d="M 180 194 C 180 214 500 204 500 222" fill="none" stroke="#52615a" stroke-width="1.4" marker-end="url(#reprise-g)"/>
          <path d="M 820 194 C 820 214 500 204 500 222" fill="none" stroke="#52615a" stroke-width="1.4" marker-end="url(#reprise-g)"/>
          <rect x="150.0" y="224.0" width="700.0" height="32.0" rx="6" fill="#ffffff" stroke="#d4ddd4" stroke-width="1"/>
          <text x="166.0" y="244.0" font-size="11" fill="#1d302a" font-weight="700">Grâce</text>
          <text x="380.0" y="244.0" font-size="10.5" fill="#52615a">chaque appareil reçoit un délai complet : personne n'est muet pour rien</text>
          <line x1="500.0" y1="256.0" x2="500.0" y2="264.0" stroke="#52615a" stroke-width="1.2"/>
          <rect x="150.0" y="264.0" width="700.0" height="32.0" rx="6" fill="#ffffff" stroke="#d4ddd4" stroke-width="1"/>
          <text x="166.0" y="284.0" font-size="11" fill="#1d302a" font-weight="700">Exécutions</text>
          <text x="380.0" y="284.0" font-size="10.5" fill="#52615a">à l'heure : reprises au même nœud ; plus de 2 min de retard : « interrompues »</text>
          <line x1="500.0" y1="296.0" x2="500.0" y2="304.0" stroke="#52615a" stroke-width="1.2"/>
          <rect x="150.0" y="304.0" width="700.0" height="32.0" rx="6" fill="#ffffff" stroke="#d4ddd4" stroke-width="1"/>
          <text x="166.0" y="324.0" font-size="11" fill="#1d302a" font-weight="700">Heures tombées pendant l'arrêt</text>
          <text x="380.0" y="324.0" font-size="10.5" fill="#52615a">2 min de retard au plus : parties ; au-delà : manquées, une seule alerte</text>
          <line x1="500.0" y1="336.0" x2="500.0" y2="344.0" stroke="#52615a" stroke-width="1.2"/>
          <rect x="150.0" y="344.0" width="700.0" height="32.0" rx="6" fill="#ffffff" stroke="#d4ddd4" stroke-width="1"/>
          <text x="166.0" y="364.0" font-size="11" fill="#1d302a" font-weight="700">Rappels d'agenda</text>
          <text x="380.0" y="364.0" font-size="10.5" fill="#52615a">partent tant que le rendez-vous n'a pas commencé</text>
          <line x1="500.0" y1="376.0" x2="500.0" y2="384.0" stroke="#52615a" stroke-width="1.2"/>
          <rect x="150.0" y="384.0" width="700.0" height="32.0" rx="6" fill="#ffffff" stroke="#d4ddd4" stroke-width="1"/>
          <text x="166.0" y="404.0" font-size="11" fill="#1d302a" font-weight="700">Jetons</text>
          <text x="380.0" y="404.0" font-size="10.5" fill="#52615a">encore valables : servis ; expirés : renouvelés, ou une autorisation est demandée</text>
  <text x="16" y="459" font-size="12" fill="#52615a" font-style="italic">Aucune règle nouvelle : ce sont celles de la mémoire v2 (§ 6.5, § 10.6, § 11). Elles valent pour une minute d'arrêt comme pour une semaine.</text>
</svg>
