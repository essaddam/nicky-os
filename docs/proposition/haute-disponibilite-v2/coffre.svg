          <rect x="42.0" y="135.0" width="73.9" height="18.0" rx="9.0" fill="#ebe7f7" stroke="#7e6cc2" stroke-opacity="0.7"/>
          <text x="50.0" y="147.2" font-size="9" fill="#4b3d82" font-weight="700">domaine cloud</text>
          <rect x="30" y="168" width="272" height="48" rx="9" fill="#ffffff" stroke="#3d9a75" stroke-width="1.3"/>
          <text x="42.0" y="188.0" font-size="10.5" fill="#1d302a" font-weight="700" font-family="SFMono-Regular, Consolas, monospace">hue/app_key</text>
