          <path class="hd-flux" d="M624 96 L680 86" fill="none" stroke="#ffffff" stroke-opacity=".95" stroke-width="1.3"/>
          <text x="652.0" y="80.0" font-size="9.5" fill="#1b5873" font-weight="700" text-anchor="middle" paint-order="stroke" stroke="#fffdf8" stroke-width="4" stroke-linejoin="round">les deux</text>
          <path d="M624 170 L680 190" fill="none" stroke="#4b3d82" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#coffre-m-violet)"/>
          <path class="hd-flux" d="M624 170 L680 190" fill="none" stroke="#ffffff" stroke-opacity=".95" stroke-width="1.3"/>
          <text x="650.0" y="196.0" font-size="9.5" fill="#4b3d82" font-weight="700" text-anchor="middle" paint-order="stroke" stroke="#fffdf8" stroke-width="4" stroke-linejoin="round">cloud</text>
          <text x="16.0" y="262.0" font-size="10.5" fill="#52615a">Un secret « maison » ne quitte jamais la maison ; la clé maître de la maison non plus. Un secret « mémoire seule » passe en direct, jamais sur un disque.</text>
          <text x="16.0" y="280.0" font-size="10.5" fill="#52615a">Ordre : coffre de l'actif (fsync) → message scellé, rang s → usage par le pilote. Un trou se comble comme le reste : la file, sinon l'état complet.</text>
  <text x="18" y="323" font-size="12" fill="#52615a" font-style="italic">Décidé le 23 octobre : les jetons et les sessions vont au coffre, et en direct au secours ; le distant reçoit les secrets cloud, chiffrés.</text>
