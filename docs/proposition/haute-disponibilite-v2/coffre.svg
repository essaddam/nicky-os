          <text x="60.0" y="67.0" font-size="12" fill="#195744" font-weight="700">Coffre de l'actif</text>
          <text x="30.0" y="89.0" font-size="10.2" fill="#52615a">clé maître M ; écrit d'abord ici (fsync)</text>
          <rect x="30" y="108" width="272" height="48" rx="9" fill="#ffffff" stroke="#7e6cc2" stroke-width="1.3"/>
