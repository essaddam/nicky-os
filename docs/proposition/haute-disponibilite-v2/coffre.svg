<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 329" width="1000" height="329" role="img" aria-labelledby="coffre-t coffre-d" font-family="Avenir Next, Avenir, Segoe UI, sans-serif">
  <title id="coffre-t">Le coffre répliqué, scellé par destinataire</title>
  <desc id="coffre-d">À gauche, le coffre de l'actif avec deux secrets : les jetons Netatmo, du domaine cloud, et la clé Hue, du domaine maison. Au milieu, MQTT dans le rang s : chaque secret est scellé pour chaque secours qui y a droit. À droite, le secours local reçoit les deux et partage la clé maître ; le secours distant ne reçoit que le secret cloud, scellé avec sa propre clé.</desc>
  <style>.hd-flux{stroke-dasharray:1.5 11;stroke-linecap:round;animation:hd-flux 1.2s linear infinite}.hd-lent{stroke-dasharray:1.5 13;stroke-linecap:round;animation:hd-lent 2.6s linear infinite}.hd-pouls{animation:hd-pouls 1.6s ease-in-out infinite}@keyframes hd-flux{to{stroke-dashoffset:-12.5}}@keyframes hd-lent{to{stroke-dashoffset:-14.5}}@keyframes hd-pouls{0%,100%{opacity:.3}50%{opacity:1}}@media (prefers-reduced-motion:reduce){.hd-flux,.hd-lent,.hd-pouls{animation:none}}</style>
