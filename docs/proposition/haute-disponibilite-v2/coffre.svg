          <text x="410.0" y="66.0" font-size="12" fill="#94660a" font-weight="700">MQTT, rang s</text>
          <text x="386.0" y="94.0" font-size="10.5" fill="#1d302a" font-weight="700" font-family="SFMono-Regular, Consolas, monospace">repl/coffre/&lt;secours&gt; :</text>
          <text x="386.0" y="111.0" font-size="10.5" fill="#1d302a">chaque secret, scellé pour</text>
          <text x="386.0" y="128.0" font-size="10.5" fill="#1d302a">chaque secours qui y a droit</text>
          <text x="386.0" y="145.0" font-size="10.5" fill="#1d302a"></text>
          <text x="386.0" y="162.0" font-size="10" fill="#52615a" font-family="SFMono-Regular, Consolas, monospace">ChaCha20-Poly1305</text>
          <text x="386.0" y="179.0" font-size="10" fill="#52615a">≈ 4,4 µs pour 2 Kio</text>
          <rect x="684" y="40" width="300" height="92" rx="12" fill="url(#coffre-f-bleu)" stroke="#3b8db4" stroke-opacity=".55" stroke-width="1.1" filter="url(#coffre-o)"/>
          <rect x="694" y="49" width="26" height="26" rx="8" fill="url(#coffre-h-bleu)"/>
          <g transform="translate(699.0 54.0) scale(0.6667)" fill="none" stroke="#ffffff" stroke-width="2.85" stroke-linecap="round" stroke-linejoin="round"><path d="M6 11h12v10H6z M8.5 11V8a3.5 3.5 0 0 1 7 0v3"/></g>
          <text x="728.0" y="67.0" font-size="12" fill="#1b5873" font-weight="700">Secours local</text>
          <text x="698.0" y="89.0" font-size="10.2" fill="#52615a">reçoit tous les secrets</text>
          <text x="698.0" y="103.0" font-size="10.2" fill="#52615a">les applique en mémoire, puis sur son disque</text>
          <text x="698.0" y="117.0" font-size="10.2" fill="#52615a">clé maître M, installée à l'appairage</text>
          <rect x="684" y="144" width="300" height="92" rx="12" fill="url(#coffre-f-violet)" stroke="#7e6cc2" stroke-opacity=".55" stroke-width="1.1" filter="url(#coffre-o)"/>
          <rect x="694" y="153" width="26" height="26" rx="8" fill="url(#coffre-h-violet)"/>
          <g transform="translate(699.0 158.0) scale(0.6667)" fill="none" stroke="#ffffff" stroke-width="2.85" stroke-linecap="round" stroke-linejoin="round"><path d="M6 11h12v10H6z M8.5 11V8a3.5 3.5 0 0 1 7 0v3"/></g>
          <text x="728.0" y="171.0" font-size="12" fill="#4b3d82" font-weight="700">Secours distant</text>
          <text x="698.0" y="193.0" font-size="10.2" fill="#52615a">ne reçoit que les secrets cloud,</text>
          <text x="698.0" y="207.0" font-size="10.2" fill="#52615a">scellés avec sa clé de liaison ;</text>
          <text x="698.0" y="221.0" font-size="10.2" fill="#52615a">son coffre, sa propre clé maître</text>
