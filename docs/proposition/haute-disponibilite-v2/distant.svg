<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 365" width="1000" height="365" role="img" aria-labelledby="distant-t distant-d" font-family="Avenir Next, Avenir, Segoe UI, sans-serif">
  <title id="distant-t">Le secours distant, par NetBird</title>
  <desc id="distant-d">À gauche, la maison : l'actif, le secours local, le témoin et les boîtiers radio. Le pont maison part vers le secours distant par NetBird, pair à pair ou par un relais, en QUIC ou en WebSocket sur le port 443 ; un battement HTTPS direct sert de seconde veille ; la file et l'état complet restent en mémoire. À droite, le secours distant : copie, alerte, cloud sur geste humain, archive.</desc>
  <style>.hd-flux{stroke-dasharray:1.5 11;stroke-linecap:round;animation:hd-flux 1.2s linear infinite}.hd-lent{stroke-dasharray:1.5 13;stroke-linecap:round;animation:hd-lent 2.6s linear infinite}.hd-pouls{animation:hd-pouls 1.6s ease-in-out infinite}@keyframes hd-flux{to{stroke-dashoffset:-12.5}}@keyframes hd-lent{to{stroke-dashoffset:-14.5}}@keyframes hd-pouls{0%,100%{opacity:.3}50%{opacity:1}}@media (prefers-reduced-motion:reduce){.hd-flux,.hd-lent,.hd-pouls{animation:none}}</style>
