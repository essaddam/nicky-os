          <text x="54.0" y="54.0" font-size="11" fill="#195744" font-weight="700" letter-spacing=".07em">LA MAISON</text>
          <rect x="32" y="66" width="170" height="60" rx="12" fill="url(#distant-f-vert)" stroke="#3d9a75" stroke-opacity=".55" stroke-width="1.1" filter="url(#distant-o)"/>
