          <text x="76.0" y="167.0" font-size="11.5" fill="#4f5d57" font-weight="700">Témoin</text>
          <text x="46.0" y="189.0" font-size="9.5" fill="#52615a">NAS, routeur ou Pi</text>
          <rect x="212" y="140" width="170" height="60" rx="12" fill="url(#distant-f-gris)" stroke="#97a39d" stroke-opacity=".55" stroke-width="1.1" filter="url(#distant-o)"/>
          <rect x="222" y="149" width="26" height="26" rx="8" fill="url(#distant-h-gris)"/>
          <g transform="translate(227.0 154.0) scale(0.6667)" fill="none" stroke="#ffffff" stroke-width="2.85" stroke-linecap="round" stroke-linejoin="round"><path d="M12 13v8 M8 21h8 M8.5 8.5a5 5 0 0 0 0 7 M15.5 8.5a5 5 0 0 1 0 7 M5.6 5.6a9 9 0 0 0 0 12.8 M18.4 5.6a9 9 0 0 1 0 12.8 M12 10.4a1.6 1.6 0 1 1 0 3.2a1.6 1.6 0 1 1 0-3.2z"/></g>
          <text x="256.0" y="167.0" font-size="11.5" fill="#4f5d57" font-weight="700">Boîtiers radio A, B</text>
          <text x="226.0" y="189.0" font-size="9.5" fill="#52615a">Zigbee, Thread</text>
          <path d="M202 96 L210 96" fill="none" stroke="#94660a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#distant-m-ambre)"/>
          <text x="32.0" y="228.0" font-size="10" fill="#52615a">Le témoin départage H1 et H2 ; il n'arbitre pas</text>
          <text x="32.0" y="243.0" font-size="10" fill="#52615a">le distant : sans Internet, la maison doit vivre.</text>
          <path d="M398 84 L690 84" fill="none" stroke="#94660a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#distant-m-ambre)"/>
          <path class="hd-flux" d="M398 84 L690 84" fill="none" stroke="#ffffff" stroke-opacity=".95" stroke-width="1.3"/>
          <text x="544.0" y="76.0" font-size="10.5" fill="#94660a" font-weight="700" text-anchor="middle" paint-order="stroke" stroke="#fffdf8" stroke-width="4" stroke-linejoin="round">le pont maison, par NetBird</text>
          <path d="M398 112 L690 112" fill="none" stroke="#4b3d82" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#distant-m-violet)"/>
          <text x="544.0" y="106.0" font-size="10" fill="#4b3d82" font-weight="700" text-anchor="middle" paint-order="stroke" stroke="#fffdf8" stroke-width="4" stroke-linejoin="round">battement direct en HTTPS : la seconde veille</text>
          <rect x="414" y="128" width="262" height="140" rx="16" fill="#ffffff" stroke="#7e6cc2" stroke-dasharray="5 4"/>
          <g transform="translate(428.0 140.0) scale(0.7500)" fill="none" stroke="#4b3d82" stroke-width="2.53" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.4-3 8.3-7 10-4-1.7-7-5.6-7-10V6z"/></g>
          <text x="452.0" y="154.0" font-size="11.5" fill="#4b3d82" font-weight="700">NetBird (WireGuard maillé)</text>
          <text x="430.0" y="178.0" font-size="10.5" fill="#52615a">pair à pair : ICE, STUN</text>
          <text x="430.0" y="195.0" font-size="10.5" fill="#52615a">sinon un relais : QUIC, ou WebSocket</text>
          <text x="430.0" y="212.0" font-size="10.5" fill="#52615a">sur le port 443 si l'UDP est bloqué</text>
          <text x="430.0" y="229.0" font-size="10.5" fill="#52615a">chiffré de bout en bout</text>
          <text x="430.0" y="246.0" font-size="10.5" fill="#94660a" font-weight="700">la file et l'état complet : en mémoire</text>
          <rect x="700" y="40" width="284" height="130" rx="12" fill="url(#distant-f-violet)" stroke="#7e6cc2" stroke-opacity=".55" stroke-width="1.1" filter="url(#distant-o)"/>
          <rect x="710" y="49" width="26" height="26" rx="8" fill="url(#distant-h-violet)"/>
          <g transform="translate(715.0 54.0) scale(0.6667)" fill="none" stroke="#ffffff" stroke-width="2.85" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18h10a4 4 0 0 0 .5-7.97A5.5 5.5 0 0 0 7.1 9.1A4.5 4.5 0 0 0 7 18z"/></g>
          <text x="744.0" y="67.0" font-size="12" fill="#4b3d82" font-weight="700">Secours distant</text>
          <text x="714.0" y="89.0" font-size="10.2" fill="#52615a">copie : mémoire, historique</text>
          <text x="714.0" y="103.5" font-size="10.2" fill="#52615a">alerte : par son propre chemin</text>
          <text x="714.0" y="118.0" font-size="10.2" fill="#52615a">cloud : sur geste humain (époque cloud)</text>
          <text x="714.0" y="132.5" font-size="10.2" fill="#52615a">peut héberger l'archive (D13)</text>
          <text x="714.0" y="147.0" font-size="10.2" fill="#52615a">jamais les radios ni le réseau local</text>
          <rect x="700" y="196" width="284" height="72" rx="12" fill="url(#distant-f-violet)" stroke="#7e6cc2" stroke-opacity=".55" stroke-width="1.1" filter="url(#distant-o)"/>
          <rect x="710" y="205" width="26" height="26" rx="8" fill="url(#distant-h-violet)"/>
          <g transform="translate(715.0 210.0) scale(0.6667)" fill="none" stroke="#ffffff" stroke-width="2.85" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18h10a4 4 0 0 0 .5-7.97A5.5 5.5 0 0 0 7.1 9.1A4.5 4.5 0 0 0 7 18z"/></g>
          <text x="744.0" y="223.0" font-size="11" fill="#4b3d82" font-weight="700">Clouds : Netatmo, Voltalis, Ariston…</text>
          <text x="714.0" y="245.0" font-size="10.2" fill="#52615a">un seul porteur de l'époque cloud</text>
          <text x="714.0" y="260.0" font-size="10.2" fill="#52615a">les appelle</text>
          <path d="M842 170 L842 192" fill="none" stroke="#4b3d82" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#distant-m-violet)"/>
          <text x="16.0" y="318.0" font-size="10.5" fill="#52615a">Secrets : le distant ne reçoit que ceux du domaine cloud, scellés avec sa clé ; la clé maître de la maison ne sort jamais.</text>
  <text x="18" y="359" font-size="12" fill="#52615a" font-style="italic">Le même pont qu'en local, sur l'adresse NetBird de l'actif. Le WebSocket, NetBird le fait déjà, en dessous, quand l'UDP est bloqué.</text>
