<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 426" width="1000" height="426" role="img" aria-labelledby="pannes-t pannes-d" font-family="Avenir Next, Avenir, Segoe UI, sans-serif">
  <title id="pannes-t">Que perd-on, sans journal sur disque ?</title>
  <desc id="pannes-d">Six cas. L'actif tombe : la mémoire est chez H2, à jour ; perdu, ce qui était en vol, 36 ms au 99e centile. Les deux machines locales tombent : la mémoire est chez le distant ; perdu, son retard, 58 ms en médiane à la cadence de la maison. Coupure de courant avec onduleur : l'arrêt figé au signal de l'onduleur ; rien de perdu. Coupure franche sans onduleur ni distant : le dernier instantané ; au plus sa période d'exécutions et d'attentes, les valeurs revenant des appareils. Le lien du distant tombe une journée : rien de perdu, l'état complet au retour en 1,8 s à 1 Mbit/s. Un actif qui redémarre vide : interdit, il revient en secours.</desc>
  <style>.hd-flux{stroke-dasharray:1.5 11;stroke-linecap:round;animation:hd-flux 1.2s linear infinite}.hd-lent{stroke-dasharray:1.5 13;stroke-linecap:round;animation:hd-lent 2.6s linear infinite}.hd-pouls{animation:hd-pouls 1.6s ease-in-out infinite}@keyframes hd-flux{to{stroke-dashoffset:-12.5}}@keyframes hd-lent{to{stroke-dashoffset:-14.5}}@keyframes hd-pouls{0%,100%{opacity:.3}50%{opacity:1}}@media (prefers-reduced-motion:reduce){.hd-flux,.hd-lent,.hd-pouls{animation:none}}</style>
