          <text x="28.0" y="240.0" font-size="11" fill="#ffffff" font-weight="700" text-anchor="middle">7</text>
          <text x="48.0" y="240.0" font-size="11.5" fill="#1d302a" font-weight="700">fin</text>
          <text x="150.0" y="240.0" font-size="10.5" fill="#52615a">le processus s'arrête</text>
          <rect x="921.0" y="229.0" width="12.2" height="15" rx="6" fill="url(#arret-b-vert)"/>
          <rect x="923.0" y="231.0" width="8.2" height="5.7" rx="5" fill="#ffffff" opacity=".2"/>
  <text x="18" y="315" font-size="12" fill="#52615a" font-style="italic">Seule l'attente des ordres en vol prend du temps ; figer et écrire l'instantané se compte en millisecondes. Il n'y a plus de journal à marquer :</text>
  <text x="18" y="332" font-size="12" fill="#52615a" font-style="italic">l'instantané porte son rang.</text>
