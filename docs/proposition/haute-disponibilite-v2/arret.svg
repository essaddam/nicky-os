          <text x="602.5" y="272.0" font-size="10" fill="#52615a" text-anchor="middle">0,5 s</text>
          <line x1="725.0" y1="42" x2="725.0" y2="256" stroke="#e1e6df"/>
          <text x="725.0" y="272.0" font-size="10" fill="#52615a" text-anchor="middle">1,0 s</text>
          <line x1="847.5" y1="42" x2="847.5" y2="256" stroke="#e1e6df"/>
          <text x="847.5" y="272.0" font-size="10" fill="#52615a" text-anchor="middle">1,5 s</text>
