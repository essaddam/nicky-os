          <text x="48.0" y="60.0" font-size="11.5" fill="#1d302a" font-weight="700">annonce</text>
          <text x="150.0" y="60.0" font-size="10.5" fill="#52615a">sys/arret ; plus d'ordre accepté</text>
          <rect x="480.0" y="49.0" width="12.2" height="15" rx="6" fill="url(#arret-b-vert)"/>
          <rect x="482.0" y="51.0" width="8.2" height="5.7" rx="5" fill="#ffffff" opacity=".2"/>
