<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 499" width="1000" height="499" role="img" aria-labelledby="familles-t familles-d" font-family="Avenir Next, Avenir, Segoe UI, sans-serif">
  <title id="familles-t">Les intégrations : que fait le secours ?</title>
  <desc id="familles-d">Un arbre de questions. Le secret change-t-il à chaque renouvellement ? Oui : un seul renouveleur (Netatmo). Sinon, une session par identifiant ? Oui : connexion après la bascule. Sinon, une clé fixe ou un appairage ? Oui : copier le coffre. Puis trois questions pour toutes : identifiant MQTT fixe, effets visibles, lien à l'adresse de la machine. Sinon, rien à faire.</desc>
  <style>.hd-flux{stroke-dasharray:1.5 11;stroke-linecap:round;animation:hd-flux 1.2s linear infinite}.hd-lent{stroke-dasharray:1.5 13;stroke-linecap:round;animation:hd-lent 2.6s linear infinite}.hd-pouls{animation:hd-pouls 1.6s ease-in-out infinite}@keyframes hd-flux{to{stroke-dashoffset:-12.5}}@keyframes hd-lent{to{stroke-dashoffset:-14.5}}@keyframes hd-pouls{0%,100%{opacity:.3}50%{opacity:1}}@media (prefers-reduced-motion:reduce){.hd-flux,.hd-lent,.hd-pouls{animation:none}}</style>
