<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 572" width="1000" height="572" role="img" aria-labelledby="classes-t classes-d" font-family="Avenir Next, Avenir, Segoe UI, sans-serif">
  <title id="classes-t">Trois classes de données</title>
  <desc id="classes-d">Trois colonnes. Critique : exacte à tout instant ; valeurs, santé, annuaire, état des workflows, coffre, fichiers métier, époque ; par val/, vu/, avail/, meta/, evt/, wf/, conf/, repl/coffre/ ; un seul rang s ; un trou se comble par la file en mémoire, sinon par l'état complet ; sur disque, l'instantané seulement. Historique : au mieux en direct, complète plus tard ; relevés, énergie, journal d'exécution, notifications, audit ; par run/ et hist/ ; rang seq donné par la base de l'actif ; un trou se comble plus tard depuis la base de l'actif. Hors MQTT : vidéo, enregistrements, documents, sauvegardes, archive ; MQTT ne porte que la référence ; les octets passent par HTTP, rsync ou le protocole de l'archive.</desc>
  <style>.hd-flux{stroke-dasharray:1.5 11;stroke-linecap:round;animation:hd-flux 1.2s linear infinite}.hd-lent{stroke-dasharray:1.5 13;stroke-linecap:round;animation:hd-lent 2.6s linear infinite}.hd-pouls{animation:hd-pouls 1.6s ease-in-out infinite}@keyframes hd-flux{to{stroke-dashoffset:-12.5}}@keyframes hd-lent{to{stroke-dashoffset:-14.5}}@keyframes hd-pouls{0%,100%{opacity:.3}50%{opacity:1}}@media (prefers-reduced-motion:reduce){.hd-flux,.hd-lent,.hd-pouls{animation:none}}</style>
  <rect width="1000" height="572" rx="16" fill="#fffdf8"/>
          <defs>
            <filter id="classes-o" x="-8%" y="-12%" width="116%" height="140%"><feDropShadow dx="0" dy="2.2" stdDeviation="2.6" flood-color="#1d302a" flood-opacity=".13"/></filter>
            <filter id="classes-o2" x="-10%" y="-15%" width="120%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="4.5" flood-color="#1d302a" flood-opacity=".2"/></filter>
            <linearGradient id="classes-f-ambre" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#fcf3de"/></linearGradient>
            <linearGradient id="classes-h-ambre" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e0a12a"/><stop offset="1" stop-color="#94660a"/></linearGradient>
            <linearGradient id="classes-b-ambre" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e0a12a"/><stop offset="1" stop-color="#a77512"/></linearGradient>
            <linearGradient id="classes-t-ambre" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ebc275"/><stop offset="1" stop-color="#fcf2dc"/></linearGradient>
            <linearGradient id="classes-s-ambre" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#94660a"/><stop offset="1" stop-color="#684707"/></linearGradient>
            <linearGradient id="classes-c-ambre" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#855c09"/><stop offset=".45" stop-color="#e0a12a"/><stop offset="1" stop-color="#7e5708"/></linearGradient>
            <marker id="classes-m-ambre" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Q2.6 5 1 1.2z" fill="#94660a"/></marker>
            <linearGradient id="classes-f-ardoise" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#ecf1f8"/></linearGradient>
            <linearGradient id="classes-h-ardoise" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7494bb"/><stop offset="1" stop-color="#3b5676"/></linearGradient>
            <linearGradient id="classes-b-ardoise" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7494bb"/><stop offset="1" stop-color="#496687"/></linearGradient>
            <linearGradient id="classes-t-ardoise" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#a5b9d3"/><stop offset="1" stop-color="#ebf0f7"/></linearGradient>
            <linearGradient id="classes-s-ardoise" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3b5676"/><stop offset="1" stop-color="#293c53"/></linearGradient>
            <linearGradient id="classes-c-ardoise" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#354d6a"/><stop offset=".45" stop-color="#7494bb"/><stop offset="1" stop-color="#324964"/></linearGradient>
            <marker id="classes-m-ardoise" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Q2.6 5 1 1.2z" fill="#3b5676"/></marker>
            <linearGradient id="classes-f-gris" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f2f4f1"/></linearGradient>
            <linearGradient id="classes-h-gris" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#97a39d"/><stop offset="1" stop-color="#4f5d57"/></linearGradient>
            <linearGradient id="classes-b-gris" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#97a39d"/><stop offset="1" stop-color="#616e68"/></linearGradient>
            <linearGradient id="classes-t-gris" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#bbc3bf"/><stop offset="1" stop-color="#f1f3f0"/></linearGradient>
            <linearGradient id="classes-s-gris" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4f5d57"/><stop offset="1" stop-color="#37413d"/></linearGradient>
            <linearGradient id="classes-c-gris" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#47544e"/><stop offset=".45" stop-color="#97a39d"/><stop offset="1" stop-color="#434f4a"/></linearGradient>
            <marker id="classes-m-gris" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Q2.6 5 1 1.2z" fill="#4f5d57"/></marker>
          </defs>
          <rect x="16" y="16" width="312" height="432" rx="16" fill="url(#classes-f-ambre)" stroke="#e0a12a" stroke-opacity=".55" filter="url(#classes-o2)"/>
          <path d="M16 86 V32 a16 16 0 0 1 16 -16 H312 a16 16 0 0 1 16 16 V86 z" fill="url(#classes-h-ambre)"/>
          <rect x="22" y="20" width="300" height="26" rx="12" fill="#ffffff" opacity=".14"/>
          <circle cx="50" cy="51" r="19" fill="#ffffff" opacity=".22"/>
          <g transform="translate(38.0 39.0) scale(1.0000)" fill="none" stroke="#ffffff" stroke-width="1.90" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.4-3 8.3-7 10-4-1.7-7-5.6-7-10V6z"/></g>
          <text x="80.0" y="49.0" font-size="17" fill="#ffffff" font-weight="700">Critique</text>
          <text x="80.0" y="68.0" font-size="10.5" fill="#ffffff" opacity=".92">exacte, à tout instant</text>
          <text x="34.0" y="110.0" font-size="9.5" fill="#94660a" font-weight="700" letter-spacing=".06em">CE QU'ELLE PORTE</text>
          <text x="34.0" y="126.0" font-size="10.5" fill="#1d302a">valeurs et instants, santé, annuaire</text>
          <text x="34.0" y="141.0" font-size="10.5" fill="#1d302a">état des workflows : exécutions,</text>
          <text x="34.0" y="156.0" font-size="10.5" fill="#1d302a">attentes, horaires, minuteries, agendas</text>
          <text x="34.0" y="171.0" font-size="10.5" fill="#1d302a">coffre (scellé), fichiers métier, époque</text>
          <text x="34.0" y="202.0" font-size="9.5" fill="#94660a" font-weight="700" letter-spacing=".06em">PAR MQTT</text>
          <text x="34.0" y="218.0" font-size="10" fill="#94660a" font-family="SFMono-Regular, Consolas, monospace">val/ vu/ avail/ meta/ evt/</text>
          <text x="34.0" y="233.0" font-size="10" fill="#94660a" font-family="SFMono-Regular, Consolas, monospace">wf/ conf/ repl/coffre/</text>
          <text x="34.0" y="264.0" font-size="9.5" fill="#94660a" font-weight="700" letter-spacing=".06em">RANG</text>
          <text x="34.0" y="280.0" font-size="10.5" fill="#1d302a">s : un seul, sans trou, pour tout</text>
          <text x="34.0" y="311.0" font-size="9.5" fill="#94660a" font-weight="700" letter-spacing=".06em">UN TROU</text>
          <text x="34.0" y="327.0" font-size="10.5" fill="#1d302a">la file en mémoire (10 000 sorties),</text>
          <text x="34.0" y="342.0" font-size="10.5" fill="#1d302a">sinon l'état complet</text>
          <text x="34.0" y="373.0" font-size="9.5" fill="#94660a" font-weight="700" letter-spacing=".06em">SUR DISQUE</text>
          <text x="34.0" y="389.0" font-size="10.5" fill="#1d302a">l'instantané seulement</text>
          <rect x="344" y="16" width="312" height="432" rx="16" fill="url(#classes-f-ardoise)" stroke="#7494bb" stroke-opacity=".55" filter="url(#classes-o2)"/>
          <path d="M344 86 V32 a16 16 0 0 1 16 -16 H640 a16 16 0 0 1 16 16 V86 z" fill="url(#classes-h-ardoise)"/>
          <rect x="350" y="20" width="300" height="26" rx="12" fill="#ffffff" opacity=".14"/>
          <circle cx="378" cy="51" r="19" fill="#ffffff" opacity=".22"/>
          <g transform="translate(366.0 39.0) scale(1.0000)" fill="none" stroke="#ffffff" stroke-width="1.90" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 1 0 18a9 9 0 1 1 0-18z M12 7v5l3 2"/></g>
          <text x="408.0" y="49.0" font-size="17" fill="#ffffff" font-weight="700">Historique</text>
          <text x="408.0" y="68.0" font-size="10.5" fill="#ffffff" opacity=".92">au mieux en direct, complète plus tard</text>
          <text x="362.0" y="110.0" font-size="9.5" fill="#3b5676" font-weight="700" letter-spacing=".06em">CE QU'ELLE PORTE</text>
          <text x="362.0" y="126.0" font-size="10.5" fill="#1d302a">relevés pour les courbes, heures d'énergie</text>
          <text x="362.0" y="141.0" font-size="10.5" fill="#1d302a">journal d'exécution des workflows</text>
          <text x="362.0" y="156.0" font-size="10.5" fill="#1d302a">notifications envoyées, audit</text>
          <text x="362.0" y="187.0" font-size="9.5" fill="#3b5676" font-weight="700" letter-spacing=".06em">PAR MQTT</text>
          <text x="362.0" y="203.0" font-size="10" fill="#3b5676" font-family="SFMono-Regular, Consolas, monospace">run/ : en direct, pour les écrans</text>
          <text x="362.0" y="218.0" font-size="10" fill="#3b5676" font-family="SFMono-Regular, Consolas, monospace">hist/ : les opérations rangées</text>
          <text x="362.0" y="249.0" font-size="9.5" fill="#3b5676" font-weight="700" letter-spacing=".06em">RANG</text>
          <text x="362.0" y="265.0" font-size="10.5" fill="#1d302a">seq (D13), donné par la base de l'actif</text>
          <text x="362.0" y="296.0" font-size="9.5" fill="#3b5676" font-weight="700" letter-spacing=".06em">UN TROU</text>
          <text x="362.0" y="312.0" font-size="10.5" fill="#1d302a">comblé plus tard, depuis la base</text>
          <text x="362.0" y="327.0" font-size="10.5" fill="#1d302a">de l'actif, à débit borné</text>
          <text x="362.0" y="358.0" font-size="9.5" fill="#3b5676" font-weight="700" letter-spacing=".06em">SUR DISQUE</text>
          <text x="362.0" y="374.0" font-size="10.5" fill="#1d302a">la base d'historique (elle existe)</text>
          <rect x="672" y="16" width="312" height="432" rx="16" fill="url(#classes-f-gris)" stroke="#97a39d" stroke-opacity=".55" filter="url(#classes-o2)"/>
          <path d="M672 86 V32 a16 16 0 0 1 16 -16 H968 a16 16 0 0 1 16 16 V86 z" fill="url(#classes-h-gris)"/>
          <rect x="678" y="20" width="300" height="26" rx="12" fill="#ffffff" opacity=".14"/>
          <circle cx="706" cy="51" r="19" fill="#ffffff" opacity=".22"/>
          <g transform="translate(694.0 39.0) scale(1.0000)" fill="none" stroke="#ffffff" stroke-width="1.90" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l4 4v14H6z M14 3v4h4 M9 12h6 M9 16h6"/></g>
          <text x="736.0" y="49.0" font-size="17" fill="#ffffff" font-weight="700">Hors MQTT</text>
          <text x="736.0" y="68.0" font-size="10.5" fill="#ffffff" opacity=".92">les octets ailleurs, la référence par MQTT</text>
          <text x="690.0" y="110.0" font-size="9.5" fill="#4f5d57" font-weight="700" letter-spacing=".06em">CE QU'ELLE PORTE</text>
          <text x="690.0" y="126.0" font-size="10.5" fill="#1d302a">flux vidéo et audio (caméras, Frigate)</text>
          <text x="690.0" y="141.0" font-size="10.5" fill="#1d302a">enregistrements, médias, documents</text>
          <text x="690.0" y="156.0" font-size="10.5" fill="#1d302a">sauvegardes, archive, micrologiciels</text>
          <text x="690.0" y="187.0" font-size="9.5" fill="#4f5d57" font-weight="700" letter-spacing=".06em">PAR MQTT</text>
          <text x="690.0" y="203.0" font-size="10.5" fill="#1d302a">la référence seulement :</text>
          <text x="690.0" y="218.0" font-size="10.5" fill="#1d302a">empreinte, taille, adresse</text>
          <text x="690.0" y="249.0" font-size="9.5" fill="#4f5d57" font-weight="700" letter-spacing=".06em">LES OCTETS</text>
          <text x="690.0" y="265.0" font-size="10.5" fill="#1d302a">HTTP avec reprise, rsync,</text>
          <text x="690.0" y="280.0" font-size="10.5" fill="#1d302a">protocole de l'archive (D13)</text>
          <text x="690.0" y="311.0" font-size="9.5" fill="#4f5d57" font-weight="700" letter-spacing=".06em">UN TROU</text>
          <text x="690.0" y="327.0" font-size="10.5" fill="#1d302a">redemander ; l'empreinte vérifie</text>
          <text x="690.0" y="358.0" font-size="9.5" fill="#4f5d57" font-weight="700" letter-spacing=".06em">SUR DISQUE</text>
          <text x="690.0" y="374.0" font-size="10.5" fill="#1d302a">là où ils sont déjà (NAS, archive)</text>
          <rect x="16" y="464" width="968" height="44" rx="12" fill="#e3f1e9" stroke="#3d9a75" stroke-opacity=".5"/>
          <g transform="translate(30.0 476.0) scale(0.8333)" fill="none" stroke="#195744" stroke-width="2.28" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18v12H3z M3 7l9 6 9-6"/></g>
          <text x="60.0" y="482.0" font-size="11" fill="#1d302a" font-weight="700">Le maximum passe par MQTT : des messages de 4 Kio au plus (la règle de la V7 sur le réseau) ; un objet</text>
          <text x="60.0" y="498.0" font-size="11" fill="#1d302a">d'état plus grand (l'état complet, un fichier métier) se découpe en morceaux. Hors MQTT : ce qui coule en continu, ou n'est pas de l'état.</text>
  <text x="18" y="549" font-size="12" fill="#52615a" font-style="italic">Une donnée est critique si l'actif décide avec elle et que les appareils ne la redonnent pas. Le reste est de l'historique, ou des octets qui ont déjà</text>
  <text x="18" y="566" font-size="12" fill="#52615a" font-style="italic">leur chemin.</text>
</svg>
