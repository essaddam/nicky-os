<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 386" width="1000" height="386" role="img" aria-labelledby="disque-t disque-d" font-family="Avenir Next, Avenir, Segoe UI, sans-serif">
  <title id="disque-t">Les écritures sur disque, par jour</title>
  <desc id="disque-d">Deux graphiques en échelle logarithmique. Les fsync par jour : jusqu'à 165 000 pour le journal de la v1, 2 880 pour state.json aujourd'hui, 192 pour un instantané toutes les 15 minutes, 48 pour un instantané par heure. Les octets écrits par jour : au moins 0,68 Go pour la v1, 236 Mo pour state.json, 23 Mo et 5,7 Mo pour les instantanés.</desc>
  <style>.hd-flux{stroke-dasharray:1.5 11;stroke-linecap:round;animation:hd-flux 1.2s linear infinite}.hd-lent{stroke-dasharray:1.5 13;stroke-linecap:round;animation:hd-lent 2.6s linear infinite}.hd-pouls{animation:hd-pouls 1.6s ease-in-out infinite}@keyframes hd-flux{to{stroke-dashoffset:-12.5}}@keyframes hd-lent{to{stroke-dashoffset:-14.5}}@keyframes hd-pouls{0%,100%{opacity:.3}50%{opacity:1}}@media (prefers-reduced-motion:reduce){.hd-flux,.hd-lent,.hd-pouls{animation:none}}</style>
