          <text x="16.0" y="290.0" font-size="10" fill="#52615a">v1 : une validation par lot de 100 ms où passe au moins une sortie, soit jusqu'à 165 000 par jour à la cadence de la maison (864 000 au plafond) ;</text>
          <text x="16.0" y="305.0" font-size="10" fill="#52615a">chaque fsync écrit au moins un bloc de 4 Kio. Aujourd'hui : state.json (160 Kio à ×1) réécrit chaque minute avec fsync du fichier et du dossier.</text>
          <text x="16.0" y="320.0" font-size="10" fill="#52615a">v2 : l'instantané (233 Kio), écrit de la même façon ; la copie elle-même n'écrit rien.</text>
  <text x="18" y="363" font-size="12" fill="#52615a" font-style="italic">Calculé à partir des tailles mesurées (instantané et state.json à ×1) et du nombre de sorties d'une journée du banc. La copie de la v2 n'écrit rien ;</text>
  <text x="18" y="380" font-size="12" fill="#52615a" font-style="italic">l'historique, qui existe déjà, n'est pas compté.</text>
