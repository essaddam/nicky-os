          <text x="452.9" y="72.0" font-size="10.5" fill="#8b3b22" font-weight="700">165 000</text>
          <text x="516.0" y="72.0" font-size="10.5" fill="#1d302a" font-weight="700">v1 : journal</text>
          <rect x="626.0" y="58.0" width="205.2" height="18" rx="6" fill="url(#disque-b-rouge)"/>
          <rect x="628.0" y="60.0" width="201.2" height="6.8" rx="5" fill="#ffffff" opacity=".2"/>
          <text x="837.2" y="72.0" font-size="10.5" fill="#8b3b22" font-weight="700">≥ 676 Mo</text>
