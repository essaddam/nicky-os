<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 494" width="1000" height="494" role="img" aria-labelledby="workflows-t workflows-d" font-family="Avenir Next, Avenir, Segoe UI, sans-serif">
  <title id="workflows-t">Les workflows passent par MQTT</title>
  <desc id="workflows-d">Une frise sur l'actif : à 21:42:03,120 la porte s'ouvre (val/, s 1041) ; une milliseconde plus tard l'exécution 87 démarre et arme une attente de 10 minutes (wf/, s 1042, et run/ départ) ; à 21:52:03,120 l'attente est revérifiée et le pas 2 allume la lampe (wf/, s 1873, et run/ pas 2) ; à 21:52:03,410 l'exécution finit (wf/, s 1874, et run/ fin). En bas : le moteur du secours reçoit wf/ dans le rang s et tient l'exécution au même nœud, avec la même échéance, sans rien réveiller ; la base de l'actif range run/, donne le rang seq et publie hist/ ; la base du secours applique hist/ par seq et peut reprendre l'export ; un trou de seq se redemande à la base de l'actif.</desc>
  <style>.hd-flux{stroke-dasharray:1.5 11;stroke-linecap:round;animation:hd-flux 1.2s linear infinite}.hd-lent{stroke-dasharray:1.5 13;stroke-linecap:round;animation:hd-lent 2.6s linear infinite}.hd-pouls{animation:hd-pouls 1.6s ease-in-out infinite}@keyframes hd-flux{to{stroke-dashoffset:-12.5}}@keyframes hd-lent{to{stroke-dashoffset:-14.5}}@keyframes hd-pouls{0%,100%{opacity:.3}50%{opacity:1}}@media (prefers-reduced-motion:reduce){.hd-flux,.hd-lent,.hd-pouls{animation:none}}</style>
