          <text x="58.0" y="394.0" font-size="11" fill="#1d302a" font-weight="700">Un seul rang pour les valeurs et les workflows : la v1 avait un journal à part (rang j) et une dépendance à gérer ;</text>
          <text x="58.0" y="412.0" font-size="11" fill="#1d302a">ici, « attente armée » (s 1042) ne peut pas arriver avant « porte ouverte » (s 1041) : le secours applique dans l'ordre de s.</text>
  <text x="18" y="471" font-size="12" fill="#52615a" font-style="italic">L'état d'un workflow est critique (wf/, rang s) ; son journal d'exécution est de l'historique (run/, puis hist/ avec le rang seq de la base de</text>
  <text x="18" y="488" font-size="12" fill="#52615a" font-style="italic">l'actif).</text>
</svg>
