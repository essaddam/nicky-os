  <text x="18" y="355" font-size="12" fill="#52615a" font-style="italic">RFC 9700 § 4.14.2 : un jeton déjà utilisé qui revient fait révoquer le jeton actif. Netatmo fait tourner ses jetons. Simulation sur 30 jours, un</text>
  <text x="18" y="372" font-size="12" fill="#52615a" font-style="italic">renouvellement toutes les 3 h.</text>
