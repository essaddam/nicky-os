<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 378" width="1000" height="378" role="img" aria-labelledby="jetons-t jetons-d" font-family="Avenir Next, Avenir, Segoe UI, sans-serif">
  <title id="jetons-t">Un jeton qui tourne, deux machines</title>
  <desc id="jetons-d">À gauche, deux machines renouvellent chacune le même jeton : le fournisseur voit revenir un jeton déjà utilisé et révoque tout. À droite, l'actif seul renouvelle, range le nouveau jeton au coffre, le publie scellé au secours dans le rang s, et le secours le présente après la bascule.</desc>
  <style>.hd-flux{stroke-dasharray:1.5 11;stroke-linecap:round;animation:hd-flux 1.2s linear infinite}.hd-lent{stroke-dasharray:1.5 13;stroke-linecap:round;animation:hd-lent 2.6s linear infinite}.hd-pouls{animation:hd-pouls 1.6s ease-in-out infinite}@keyframes hd-flux{to{stroke-dashoffset:-12.5}}@keyframes hd-lent{to{stroke-dashoffset:-14.5}}@keyframes hd-pouls{0%,100%{opacity:.3}50%{opacity:1}}@media (prefers-reduced-motion:reduce){.hd-flux,.hd-lent,.hd-pouls{animation:none}}</style>
