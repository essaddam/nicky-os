  <text x="18" y="351" font-size="12" fill="#52615a" font-style="italic">Mosquitto 2 en conteneurs (QoS 1, session persistante, persistance coupée), essai unique ; le pont maison : banc rumqttd, médiane de trois essais. Une</text>
  <text x="18" y="368" font-size="12" fill="#52615a" font-style="italic">grande file ne suffit pas : un redémarrage la vide, et rien ne dit au secours ce qu'il a manqué.</text>
