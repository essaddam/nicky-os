<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 374" width="1000" height="374" role="img" aria-labelledby="mosquitto-t mosquitto-d" font-family="Avenir Next, Avenir, Segoe UI, sans-serif">
  <title id="mosquitto-t">Le pont de Mosquitto, et le pont maison</title>
  <desc id="mosquitto-d">À gauche, un pont MQTT ordinaire : pendant une coupure, le courtier de l'actif garde les messages dans la file de session du pont, en mémoire, 1 000 au plus par défaut ; au-delà il les jette en le notant dans son journal, sans que l'abonné le sache ; un redémarrage du courtier efface la file. À droite, les messages perdus pour une coupure de 10 secondes à 200 messages par seconde : 960 avec la file par défaut, 0 avec une file de 100 000, 2 000 quand le courtier redémarre pendant la coupure. Le pont maison : 0 sous des coupures de 5 et 10 secondes, 0 sous une coupure de 60 secondes.</desc>
  <style>.hd-flux{stroke-dasharray:1.5 11;stroke-linecap:round;animation:hd-flux 1.2s linear infinite}.hd-lent{stroke-dasharray:1.5 13;stroke-linecap:round;animation:hd-lent 2.6s linear infinite}.hd-pouls{animation:hd-pouls 1.6s ease-in-out infinite}@keyframes hd-flux{to{stroke-dashoffset:-12.5}}@keyframes hd-lent{to{stroke-dashoffset:-14.5}}@keyframes hd-pouls{0%,100%{opacity:.3}50%{opacity:1}}@media (prefers-reduced-motion:reduce){.hd-flux,.hd-lent,.hd-pouls{animation:none}}</style>
