<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 342" width="1000" height="342" role="img" aria-labelledby="resync-t resync-d" font-family="Avenir Next, Avenir, Segoe UI, sans-serif">
  <title id="resync-t">Revenir après une journée : rejouer, ou recopier l'état</title>
  <desc id="resync-d">Un graphique en échelle logarithmique. Le secours revient après une journée d'absence. Sur le réseau local, la v1 rejoue le journal en 1,1 s, la v2 recopie l'état complet en 0,81 s ; à 10 Mbit/s, 13 s contre 0,71 s ; à 1 Mbit/s, 69 s contre 1,8 s. Sur le lien, 7,7 Mo contre 101 Ko.</desc>
  <style>.hd-flux{stroke-dasharray:1.5 11;stroke-linecap:round;animation:hd-flux 1.2s linear infinite}.hd-lent{stroke-dasharray:1.5 13;stroke-linecap:round;animation:hd-lent 2.6s linear infinite}.hd-pouls{animation:hd-pouls 1.6s ease-in-out infinite}@keyframes hd-flux{to{stroke-dashoffset:-12.5}}@keyframes hd-lent{to{stroke-dashoffset:-14.5}}@keyframes hd-pouls{0%,100%{opacity:.3}50%{opacity:1}}@media (prefers-reduced-motion:reduce){.hd-flux,.hd-lent,.hd-pouls{animation:none}}</style>
  <rect width="1000" height="342" rx="16" fill="#fffdf8"/>
          <defs>
            <filter id="resync-o" x="-8%" y="-12%" width="116%" height="140%"><feDropShadow dx="0" dy="2.2" stdDeviation="2.6" flood-color="#1d302a" flood-opacity=".13"/></filter>
            <filter id="resync-o2" x="-10%" y="-15%" width="120%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="4.5" flood-color="#1d302a" flood-opacity=".2"/></filter>
            <linearGradient id="resync-f-ardoise" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#ecf1f8"/></linearGradient>
            <linearGradient id="resync-h-ardoise" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7494bb"/><stop offset="1" stop-color="#3b5676"/></linearGradient>
            <linearGradient id="resync-b-ardoise" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7494bb"/><stop offset="1" stop-color="#496687"/></linearGradient>
            <linearGradient id="resync-t-ardoise" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#a5b9d3"/><stop offset="1" stop-color="#ebf0f7"/></linearGradient>
            <linearGradient id="resync-s-ardoise" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3b5676"/><stop offset="1" stop-color="#293c53"/></linearGradient>
            <linearGradient id="resync-c-ardoise" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#354d6a"/><stop offset=".45" stop-color="#7494bb"/><stop offset="1" stop-color="#324964"/></linearGradient>
            <marker id="resync-m-ardoise" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Q2.6 5 1 1.2z" fill="#3b5676"/></marker>
            <linearGradient id="resync-f-vert" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eaf4ee"/></linearGradient>
            <linearGradient id="resync-h-vert" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3d9a75"/><stop offset="1" stop-color="#195744"/></linearGradient>
            <linearGradient id="resync-b-vert" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3d9a75"/><stop offset="1" stop-color="#226850"/></linearGradient>
            <linearGradient id="resync-t-vert" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#81bda5"/><stop offset="1" stop-color="#e9f4ed"/></linearGradient>
            <linearGradient id="resync-s-vert" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#195744"/><stop offset="1" stop-color="#123d30"/></linearGradient>
            <linearGradient id="resync-c-vert" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#164e3d"/><stop offset=".45" stop-color="#3d9a75"/><stop offset="1" stop-color="#154a3a"/></linearGradient>
            <marker id="resync-m-vert" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Q2.6 5 1 1.2z" fill="#195744"/></marker>
          </defs>
          <text x="16.0" y="24.0" font-size="11" fill="#52615a" font-weight="700" letter-spacing=".06em">LE SECOURS REVIENT APRÈS UNE JOURNÉE D'ABSENCE (165 000 SORTIES MANQUÉES)</text>
          <line x1="170.0" y1="44" x2="170.0" y2="262" stroke="#d4ddd4" stroke-dasharray="2 3"/>
          <text x="170.0" y="276.0" font-size="9.5" fill="#52615a" text-anchor="middle">0,1</text>
          <line x1="327.5" y1="44" x2="327.5" y2="262" stroke="#d4ddd4" stroke-dasharray="2 3"/>
          <text x="327.5" y="276.0" font-size="9.5" fill="#52615a" text-anchor="middle">1</text>
          <line x1="485.1" y1="44" x2="485.1" y2="262" stroke="#d4ddd4" stroke-dasharray="2 3"/>
          <text x="485.1" y="276.0" font-size="9.5" fill="#52615a" text-anchor="middle">10</text>
          <line x1="642.6" y1="44" x2="642.6" y2="262" stroke="#d4ddd4" stroke-dasharray="2 3"/>
          <text x="642.6" y="276.0" font-size="9.5" fill="#52615a" text-anchor="middle">100</text>
          <text x="690.0" y="290.0" font-size="9.5" fill="#52615a" text-anchor="end" font-style="italic">secondes, échelle logarithmique</text>
          <text x="16.0" y="86.0" font-size="11.5" fill="#1d302a" font-weight="700">réseau local</text>
          <rect x="170.0" y="60.0" width="165.2" height="18" rx="6" fill="url(#resync-b-ardoise)"/>
          <rect x="172.0" y="62.0" width="161.2" height="6.8" rx="5" fill="#ffffff" opacity=".2"/>
          <text x="343.2" y="74.0" font-size="11" fill="#3b5676" font-weight="700">1,1 s</text>
          <text x="395.2" y="74.0" font-size="10" fill="#3b5676">v1 : rejouer le journal</text>
          <rect x="170.0" y="86.0" width="142.9" height="18" rx="6" fill="url(#resync-b-vert)"/>
          <rect x="172.0" y="88.0" width="138.9" height="6.8" rx="5" fill="#ffffff" opacity=".2"/>
          <text x="320.9" y="100.0" font-size="11" fill="#195744" font-weight="700">0,81 s</text>
          <text x="372.9" y="100.0" font-size="10" fill="#195744">v2 : l'état complet</text>
          <text x="16.0" y="156.0" font-size="11.5" fill="#1d302a" font-weight="700">10 Mbit/s, 40 ms</text>
          <rect x="170.0" y="130.0" width="335.2" height="18" rx="6" fill="url(#resync-b-ardoise)"/>
          <rect x="172.0" y="132.0" width="331.2" height="6.8" rx="5" fill="#ffffff" opacity=".2"/>
          <text x="513.2" y="144.0" font-size="11" fill="#3b5676" font-weight="700">13 s</text>
          <rect x="170.0" y="156.0" width="133.9" height="18" rx="6" fill="url(#resync-b-vert)"/>
          <rect x="172.0" y="158.0" width="129.9" height="6.8" rx="5" fill="#ffffff" opacity=".2"/>
          <text x="311.9" y="170.0" font-size="11" fill="#195744" font-weight="700">0,71 s</text>
          <text x="16.0" y="226.0" font-size="11.5" fill="#1d302a" font-weight="700">1 Mbit/s, 40 ms</text>
          <rect x="170.0" y="200.0" width="447.4" height="18" rx="6" fill="url(#resync-b-ardoise)"/>
          <rect x="172.0" y="202.0" width="443.4" height="6.8" rx="5" fill="#ffffff" opacity=".2"/>
          <text x="625.4" y="214.0" font-size="11" fill="#3b5676" font-weight="700">69 s</text>
          <rect x="170.0" y="226.0" width="197.9" height="18" rx="6" fill="url(#resync-b-vert)"/>
          <rect x="172.0" y="228.0" width="193.9" height="6.8" rx="5" fill="#ffffff" opacity=".2"/>
          <text x="375.9" y="240.0" font-size="11" fill="#195744" font-weight="700">1,8 s</text>
          <rect x="730" y="52" width="254" height="112" rx="12" fill="url(#resync-f-vert)" stroke="#3d9a75" stroke-opacity=".55" stroke-width="1.1" filter="url(#resync-o)"/>
          <rect x="740" y="61" width="26" height="26" rx="8" fill="url(#resync-h-vert)"/>
          <g transform="translate(745.0 66.0) scale(0.6667)" fill="none" stroke="#ffffff" stroke-width="2.85" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7l8-4 8 4-8 4z M4 12l8 4 8-4 M4 17l8 4 8-4"/></g>
          <text x="774.0" y="79.0" font-size="12" fill="#195744" font-weight="700">Octets sur le lien</text>
          <text x="744.0" y="101.0" font-size="10.5" fill="#52615a">v1 : 7,7 Mo de tronçons</text>
          <text x="744.0" y="118.0" font-size="10.5" fill="#52615a">v2 : 101 Ko, l'état complet</text>
          <text x="744.0" y="135.0" font-size="10.5" fill="#52615a">soit 76 fois moins</text>
          <rect x="730" y="178" width="254" height="92" rx="12" fill="url(#resync-f-ardoise)" stroke="#7494bb" stroke-opacity=".55" stroke-width="1.1" filter="url(#resync-o)"/>
          <rect x="740" y="187" width="26" height="26" rx="8" fill="url(#resync-h-ardoise)"/>
          <g transform="translate(745.0 192.0) scale(0.6667)" fill="none" stroke="#ffffff" stroke-width="2.85" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h8l3 3v15H7z M10 3v4 M12.5 3v4 M15 3v4"/></g>
          <text x="774.0" y="205.0" font-size="12" fill="#3b5676" font-weight="700">Et sur disque</text>
          <text x="744.0" y="227.0" font-size="10.5" fill="#52615a">v1 : la journée au journal</text>
          <text x="744.0" y="242.0" font-size="10.5" fill="#52615a">v2 : rien ; l'état complet est</text>
          <text x="744.0" y="257.0" font-size="10.5" fill="#52615a">construit en mémoire</text>
  <text x="18" y="319" font-size="12" fill="#52615a" font-style="italic">Mesuré sur le banc, médiane de trois essais. En v2, l'essentiel du temps local est la détection : un battement (500 ms) puis la grâce (200 ms). La</text>
  <text x="18" y="336" font-size="12" fill="#52615a" font-style="italic">mémoire du secours finit identique dans les six cas.</text>
</svg>
