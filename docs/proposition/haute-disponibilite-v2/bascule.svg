          <rect x="330.8" y="56.0" width="221.0" height="6.1" rx="5" fill="#ffffff" opacity=".2"/>
          <text x="328.8" y="49.0" font-size="10" fill="#8b3b22" font-weight="700">gel de H1</text>
          <text x="16.0" y="118.0" font-size="12" fill="#52615a" font-weight="700">Témoin</text>
          <rect x="295.0" y="106.0" width="337.5" height="16" rx="6" fill="url(#bascule-b-ambre)"/>
          <rect x="297.0" y="108.0" width="333.5" height="6.1" rx="5" fill="#ffffff" opacity=".2"/>
          <text x="303.0" y="118.0" font-size="10" fill="#ffffff" font-weight="700">le bail N court encore (3 s)</text>
          <text x="16.0" y="168.0" font-size="12" fill="#1b5873" font-weight="700">H2</text>
          <rect x="328.8" y="152" width="303.8" height="24" rx="7" fill="#fae7dd" stroke="#d06a46" stroke-dasharray="4 3"/>
          <text x="336.8" y="168.0" font-size="10" fill="#8b3b22" font-weight="700">incertain : « peut-être déjà parti », jamais rejoué</text>
          <rect x="632.5" y="152.0" width="337.5" height="24" rx="6" fill="url(#bascule-b-vert)"/>
          <rect x="634.5" y="154.0" width="333.5" height="9.1" rx="5" fill="#ffffff" opacity=".2"/>
          <text x="640.5" y="168.0" font-size="10" fill="#ffffff" font-weight="700">époque N + 1 : H2 agit ; rattrapage normal (2 min)</text>
