          <text x="447.2" y="142.0" font-size="9.5" fill="#4f5d57" paint-order="stroke" stroke="#fffdf8" stroke-width="4" stroke-linejoin="round">silence ≥ 1 s : H2 demande N + 1</text>
          <text x="16.0" y="238.0" font-size="10.5" fill="#52615a">Domaine maison : le secours local seulement. Domaine cloud : le secours local avec la maison, ou le distant sur geste humain.</text>
          <text x="16.0" y="256.0" font-size="10.5" fill="#52615a">Chaque ordre porte l'époque de qui l'émet : un module refuse une époque plus ancienne.</text>
  <text x="18" y="297" font-size="12" fill="#52615a" font-style="italic">La fenêtre d'incertitude dure le bail : quelques secondes. Ce qui y tombe n'est ni rejoué ni perdu en silence.</text>
