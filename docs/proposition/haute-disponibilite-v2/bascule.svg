<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 303" width="1000" height="303" role="img" aria-labelledby="bascule-t bascule-d" font-family="Avenir Next, Avenir, Segoe UI, sans-serif">
  <title id="bascule-t">La bascule et la fenêtre d'incertitude</title>
  <desc id="bascule-d">Une frise de 8 secondes. H1 renouvelle son bail chaque seconde puis gèle ; le témoin laisse courir le bail N trois secondes ; H2 demande l'époque suivante après une seconde de silence et la reçoit à la fin du bail. Entre la dernière sortie reçue et la fin du bail, ce qui était dû est incertain ; après, H2 agit et rattrape normalement.</desc>
  <style>.hd-flux{stroke-dasharray:1.5 11;stroke-linecap:round;animation:hd-flux 1.2s linear infinite}.hd-lent{stroke-dasharray:1.5 13;stroke-linecap:round;animation:hd-lent 2.6s linear infinite}.hd-pouls{animation:hd-pouls 1.6s ease-in-out infinite}@keyframes hd-flux{to{stroke-dashoffset:-12.5}}@keyframes hd-lent{to{stroke-dashoffset:-14.5}}@keyframes hd-pouls{0%,100%{opacity:.3}50%{opacity:1}}@media (prefers-reduced-motion:reduce){.hd-flux,.hd-lent,.hd-pouls{animation:none}}</style>
