          <text x="56.0" y="238.0" font-size="11" fill="#1d302a" font-weight="700">Dans tous les cas du pont maison, la mémoire du secours finit identique à celle de l'actif, exécutions comprises (582 sur 8 000 sorties).</text>
  <text x="18" y="295" font-size="12" fill="#52615a" font-style="italic">Deux courtiers rumqttd 0.20 et un relais qui imite le lien, en Linux musl (2 CPU, 128 Mio), médiane de trois essais ; le 99e centile mesure surtout la</text>
  <text x="18" y="312" font-size="12" fill="#52615a" font-style="italic">cohabitation des deux courtiers sur 2 CPU.</text>
