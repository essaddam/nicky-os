<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 318" width="1000" height="318" role="img" aria-labelledby="mesures-t mesures-d" font-family="Avenir Next, Avenir, Segoe UI, sans-serif">
  <title id="mesures-t">Le pont maison, mesuré</title>
  <desc id="mesures-d">Trois graphiques. Le délai de la copie : sur le réseau local à 200 messages par seconde, médiane 2,0 ms et 99e centile 36 ms ; sur le lien distant qui bat, 55 ms et 69 ms. Le rattrapage après une coupure : 110 ms après 5 secondes, 207 ms après 10 secondes, 404 ms après 60 secondes par l'état complet, 358 ms au plus sur le lien distant. Les messages perdus : 3 011 sur 8 000 pour le pont de rumqttd, aucun pour le pont maison.</desc>
  <style>.hd-flux{stroke-dasharray:1.5 11;stroke-linecap:round;animation:hd-flux 1.2s linear infinite}.hd-lent{stroke-dasharray:1.5 13;stroke-linecap:round;animation:hd-lent 2.6s linear infinite}.hd-pouls{animation:hd-pouls 1.6s ease-in-out infinite}@keyframes hd-flux{to{stroke-dashoffset:-12.5}}@keyframes hd-lent{to{stroke-dashoffset:-14.5}}@keyframes hd-pouls{0%,100%{opacity:.3}50%{opacity:1}}@media (prefers-reduced-motion:reduce){.hd-flux,.hd-lent,.hd-pouls{animation:none}}</style>
