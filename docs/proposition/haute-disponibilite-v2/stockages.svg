          <text x="30.0" y="363.0" font-size="10.2" fill="#52615a">le récent : la base de l'actif</text>
          <text x="30.0" y="377.0" font-size="10.2" fill="#52615a">le long terme : l'archive</text>
          <text x="30.0" y="391.0" font-size="10.2" fill="#52615a">maison éteinte : le distant</text>
  <text x="18" y="439" font-size="12" fill="#52615a" font-style="italic">Une seule base numérote l'historique ; les autres le reçoivent rangé, par MQTT. Elles peuvent alors reprendre l'export de D13 après une bascule.</text>
