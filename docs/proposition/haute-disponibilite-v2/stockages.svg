<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 445" width="1000" height="445" role="img" aria-labelledby="stockages-t stockages-d" font-family="Avenir Next, Avenir, Segoe UI, sans-serif">
  <title id="stockages-t">Plusieurs stockages : qui numérote, qui recopie</title>
  <desc id="stockages-d">Le cœur de l'actif publie val/ et run/ ; la base de l'actif range et donne le rang seq ; elle publie hist/ vers la base du secours local, copie de reprise avec les mêmes rangs, et par NetBird vers la base du distant ; un trou de seq se redemande. Seul le porteur de l'époque exporte vers l'archive ; après une bascule, le secours exporte la suite avec les mêmes rangs. Une copie de lecture dérivée de val/ diverge et n'exporte jamais. Qui répond : la mémoire, la base de l'actif, l'archive, le distant quand la maison est éteinte.</desc>
  <style>.hd-flux{stroke-dasharray:1.5 11;stroke-linecap:round;animation:hd-flux 1.2s linear infinite}.hd-lent{stroke-dasharray:1.5 13;stroke-linecap:round;animation:hd-lent 2.6s linear infinite}.hd-pouls{animation:hd-pouls 1.6s ease-in-out infinite}@keyframes hd-flux{to{stroke-dashoffset:-12.5}}@keyframes hd-lent{to{stroke-dashoffset:-14.5}}@keyframes hd-pouls{0%,100%{opacity:.3}50%{opacity:1}}@media (prefers-reduced-motion:reduce){.hd-flux,.hd-lent,.hd-pouls{animation:none}}</style>
