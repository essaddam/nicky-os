<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 347" width="1000" height="347" role="img" aria-labelledby="cloture-t cloture-d" font-family="Avenir Next, Avenir, Segoe UI, sans-serif">
  <title id="cloture-t">L'époque sur chaque ordre</title>
  <desc id="cloture-d">Diagramme de séquence. H1, époque N, renouvelle son bail puis gèle. H2 demande l'époque N + 1, que le témoin accorde à l'expiration du bail. H2 envoie un ordre d'époque N + 1 au module. H1 se réveille et envoie un ordre d'époque N : le module le refuse. H1 apprend qu'il a perdu le bail et redevient secours.</desc>
  <style>.hd-flux{stroke-dasharray:1.5 11;stroke-linecap:round;animation:hd-flux 1.2s linear infinite}.hd-lent{stroke-dasharray:1.5 13;stroke-linecap:round;animation:hd-lent 2.6s linear infinite}.hd-pouls{animation:hd-pouls 1.6s ease-in-out infinite}@keyframes hd-flux{to{stroke-dashoffset:-12.5}}@keyframes hd-lent{to{stroke-dashoffset:-14.5}}@keyframes hd-pouls{0%,100%{opacity:.3}50%{opacity:1}}@media (prefers-reduced-motion:reduce){.hd-flux,.hd-lent,.hd-pouls{animation:none}}</style>
