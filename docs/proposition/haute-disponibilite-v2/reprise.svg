<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 551" width="1000" height="551" role="img" aria-labelledby="reprise-t reprise-d" font-family="Avenir Next, Avenir, Segoe UI, sans-serif">
  <title id="reprise-t">Redémarrer sans journal</title>
  <desc id="reprise-d">Un organigramme. Au démarrage, la machine lit son instantané, sa mémoire au rang (E, s), puis demande (E, s) à ses pairs pendant 10 secondes au plus. Si un pair porte une époque vivante, elle devient secours et prend son état complet par MQTT, sans rien lire du disque. Sinon, elle prend l'état du plus avancé, un pair ou son propre instantané, demande l'époque E + 1 au témoin et devient active, avec la grâce du démarrage pour chaque appareil. À côté, la règle : jamais actif avec moins qu'un pair ; un état plus ancien est refusé.</desc>
  <style>.hd-flux{stroke-dasharray:1.5 11;stroke-linecap:round;animation:hd-flux 1.2s linear infinite}.hd-lent{stroke-dasharray:1.5 13;stroke-linecap:round;animation:hd-lent 2.6s linear infinite}.hd-pouls{animation:hd-pouls 1.6s ease-in-out infinite}@keyframes hd-flux{to{stroke-dashoffset:-12.5}}@keyframes hd-lent{to{stroke-dashoffset:-14.5}}@keyframes hd-pouls{0%,100%{opacity:.3}50%{opacity:1}}@media (prefers-reduced-motion:reduce){.hd-flux,.hd-lent,.hd-pouls{animation:none}}</style>
  <rect width="1000" height="551" rx="16" fill="#fffdf8"/>
