          <text x="608.0" y="337.0" font-size="12" fill="#8b3b22" font-weight="700">Jamais actif avec moins qu'un pair</text>
          <text x="578.0" y="359.0" font-size="10.2" fill="#52615a">Le piège de Redis : un maître sans persistance qui</text>
          <text x="578.0" y="373.0" font-size="10.2" fill="#52615a">redémarre vide, et ses répliques qui se recopient</text>
          <text x="578.0" y="387.0" font-size="10.2" fill="#52615a">sur lui, vides à leur tour. Ici, chaque état porte</text>
          <text x="578.0" y="401.0" font-size="10.2" fill="#52615a">(E, s) ; un état plus ancien que le sien est refusé ;</text>
          <text x="578.0" y="415.0" font-size="10.2" fill="#52615a">une machine qui redémarre ne prend l'époque qu'avec</text>
          <text x="578.0" y="429.0" font-size="10.2" fill="#52615a">une mémoire au moins aussi avancée que ses pairs.</text>
