          <text x="59.0" y="99.0" font-size="11.5" fill="#1b5873" font-weight="700">Charlie lance « Départ » sur la tablette, son PIN</text>
          <text x="46.0" y="117.0" font-size="10" fill="#52615a">les droits de Charlie ∩ ceux de la tablette ∩ le mandat de « Départ »</text>
          <circle cx="41" cy="149" r="10" fill="url(#mandat-h-vert)"/>
          <g transform="translate(34.0 142.0) scale(0.5833)" fill="none" stroke="#ffffff" stroke-width="4.11" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></g>
          <text x="60.0" y="153.0" font-size="10.8" fill="#1d302a" font-weight="700">sa lampe : oui</text>
          <circle cx="41" cy="183" r="10" fill="url(#mandat-h-rouge)"/>
          <g transform="translate(34.0 176.0) scale(0.5833)" fill="none" stroke="#ffffff" stroke-width="4.11" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12 M18 6L6 18"/></g>
          <text x="60.0" y="187.0" font-size="10.8" fill="#1d302a" font-weight="700">la porte : non, ce n'est pas sa pièce</text>
          <circle cx="41" cy="217" r="10" fill="url(#mandat-h-ambre)"/>
          <g transform="translate(34.0 210.0) scale(0.5833)" fill="none" stroke="#ffffff" stroke-width="3.77" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 1 0 18a9 9 0 1 1 0-18z M12 7v5l3 2"/></g>
          <text x="60.0" y="221.0" font-size="10.8" fill="#1d302a" font-weight="700">depuis la tablette anonyme : la chambre se propose</text>
          <rect x="508" y="40" width="476" height="210" rx="20" fill="#ebe7f7" fill-opacity=".45" stroke="#7e6cc2" stroke-opacity=".45" stroke-width="1.2" stroke-dasharray="7 5"/>
          <g transform="translate(524.0 51.0) scale(0.6667)" fill="none" stroke="#4b3d82" stroke-width="2.70" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8.5a3.5 3.5 0 1 1 0 7a3.5 3.5 0 1 1 0-7z M12 2v3 M12 19v3 M2 12h3 M19 12h3 M4.9 4.9L7 7 M17 17l2.1 2.1 M4.9 19.1L7 17 M17 7l2.1-2.1"/></g>
          <text x="546.0" y="64.0" font-size="11" fill="#4b3d82" font-weight="700" letter-spacing=".07em">AUTONOME : UN DÉCLENCHEUR</text>
          <rect x="524" y="76" width="444" height="52" rx="12" fill="url(#mandat-f-violet)" stroke="#7e6cc2" stroke-opacity=".55" stroke-width="1.1" filter="url(#mandat-o)"/>
          <circle cx="539" cy="95" r="4.5" fill="url(#mandat-h-violet)"/>
          <text x="551.0" y="99.0" font-size="11.5" fill="#4b3d82" font-weight="700">« Sonnette ouvre » : la sonnette sonne, la porte s'ouvre</text>
          <text x="538.0" y="117.0" font-size="10" fill="#52615a">les droits de son responsable ∩ le mandat ; adopté par le foyer : le mandat</text>
          <circle cx="533" cy="149" r="10" fill="url(#mandat-h-rouge)"/>
          <g transform="translate(526.0 142.0) scale(0.5833)" fill="none" stroke="#ffffff" stroke-width="4.11" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12 M18 6L6 18"/></g>
          <text x="552.0" y="153.0" font-size="10.8" fill="#1d302a" font-weight="700">n'importe qui peut sonner : à revoir, sans décision</text>
          <circle cx="533" cy="183" r="10" fill="url(#mandat-h-vert)"/>
          <g transform="translate(526.0 176.0) scale(0.5833)" fill="none" stroke="#ffffff" stroke-width="4.11" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></g>
          <text x="552.0" y="187.0" font-size="10.8" fill="#1d302a" font-weight="700">accepté par Bob, en connaissance de cause : oui</text>
          <circle cx="533" cy="217" r="10" fill="url(#mandat-h-rouge)"/>
          <g transform="translate(526.0 210.0) scale(0.5833)" fill="none" stroke="#ffffff" stroke-width="4.11" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12 M18 6L6 18"/></g>
          <text x="552.0" y="221.0" font-size="10.8" fill="#1d302a" font-weight="700">Alice partie : sa « Nuit » refusée, mise à revoir</text>
          <rect x="16" y="266" width="234" height="114" rx="12" fill="url(#mandat-f-ardoise)" stroke="#7494bb" stroke-opacity=".55" stroke-width="1.1" filter="url(#mandat-o)"/>
          <rect x="26" y="275" width="26" height="26" rx="8" fill="url(#mandat-h-ardoise)"/>
          <g transform="translate(31.0 280.0) scale(0.6667)" fill="none" stroke="#ffffff" stroke-width="2.85" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l4 4v14H6z M14 3v4h4 M9 12h6 M9 16h6"/></g>
          <text x="60.0" y="293.0" font-size="12" fill="#3b5676" font-weight="700">Le manifeste</text>
          <text x="30.0" y="315.0" font-size="10.2" fill="#52615a">classes et pièces que le graphe</text>
          <text x="30.0" y="330.0" font-size="10.2" fill="#52615a">commande, à la validation ; le</text>
          <text x="30.0" y="345.0" font-size="10.2" fill="#52615a">responsable doit l'approuver</text>
          <rect x="260" y="266" width="234" height="114" rx="12" fill="url(#mandat-f-ardoise)" stroke="#7494bb" stroke-opacity=".55" stroke-width="1.1" filter="url(#mandat-o)"/>
          <rect x="270" y="275" width="26" height="26" rx="8" fill="url(#mandat-h-ardoise)"/>
          <g transform="translate(275.0 280.0) scale(0.6667)" fill="none" stroke="#ffffff" stroke-width="2.85" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 1 0 18a9 9 0 1 1 0-18z M12 7v5l3 2"/></g>
          <text x="304.0" y="293.0" font-size="12" fill="#3b5676" font-weight="700">Le bail</text>
          <text x="274.0" y="315.0" font-size="10.2" fill="#52615a">s'ouvre au succès de son ordre ;</text>
          <text x="274.0" y="330.0" font-size="10.2" fill="#52615a">ne rétablit que s'il possède</text>
          <text x="274.0" y="345.0" font-size="10.2" fill="#52615a">encore l'état</text>
          <rect x="504" y="266" width="234" height="114" rx="12" fill="url(#mandat-f-ardoise)" stroke="#7494bb" stroke-opacity=".55" stroke-width="1.1" filter="url(#mandat-o)"/>
          <rect x="514" y="275" width="26" height="26" rx="8" fill="url(#mandat-h-ardoise)"/>
          <g transform="translate(519.0 280.0) scale(0.6667)" fill="none" stroke="#ffffff" stroke-width="2.85" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10a8 8 0 0 1 14.5-3.5 M19 3v4h-4 M20 14a8 8 0 0 1-14.5 3.5 M5 21v-4h4"/></g>
          <text x="548.0" y="293.0" font-size="12" fill="#3b5676" font-weight="700">L'exécution</text>
          <text x="518.0" y="315.0" font-size="10.2" fill="#52615a">son empreinte : jamais dans un</text>
          <text x="518.0" y="330.0" font-size="10.2" fill="#52615a">autre programme ; elle passe</text>
          <text x="518.0" y="345.0" font-size="10.2" fill="#52615a">au secours (wf/ex)</text>
          <rect x="748" y="266" width="234" height="114" rx="12" fill="url(#mandat-f-ardoise)" stroke="#7494bb" stroke-opacity=".55" stroke-width="1.1" filter="url(#mandat-o)"/>
          <rect x="758" y="275" width="26" height="26" rx="8" fill="url(#mandat-h-ardoise)"/>
          <g transform="translate(763.0 280.0) scale(0.6667)" fill="none" stroke="#ffffff" stroke-width="2.85" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12h5l2-5 3 10 2-5h8"/></g>
          <text x="792.0" y="293.0" font-size="12" fill="#3b5676" font-weight="700">Les rafales</text>
          <text x="762.0" y="315.0" font-size="10.2" fill="#52615a">20 départs par minute et par</text>
          <text x="762.0" y="330.0" font-size="10.2" fill="#52615a">automatisme ; une transition</text>
          <text x="762.0" y="345.0" font-size="10.2" fill="#52615a">d'une demande, une fois</text>
          <rect x="16" y="396" width="968" height="36" rx="12" fill="#e3f1e9" stroke="#3d9a75" stroke-opacity=".5"/>
          <g transform="translate(28.0 404.0) scale(0.8333)" fill="none" stroke="#195744" stroke-width="2.64" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></g>
          <text x="56.0" y="418.0" font-size="11" fill="#1d302a" font-weight="700">Désarmer n'est dans aucun mandat. Un agent rédige un brouillon ; seule la validation d'une personne habilitée crée un mandat.</text>
  <text x="18" y="473" font-size="12" fill="#52615a" font-style="italic">Aujourd'hui, un automatisme agit en « automation », une origine que la garde ne retient jamais, et la routine lancée par un appareil anonyme ignore</text>
  <text x="18" y="490" font-size="12" fill="#52615a" font-style="italic">les scènes (§ 5.4, E4 et E5). La v3 distingue l'exécution appelée de l'autonome (revue W1 à W6).</text>
</svg>
