<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 496" width="1000" height="496" role="img" aria-labelledby="mandat-t mandat-d" font-family="Avenir Next, Avenir, Segoe UI, sans-serif">
  <title id="mandat-t">Qui répond d'un automatisme</title>
  <desc id="mandat-d">Deux zones. Lancé par une personne, une routine ou une scène garde les droits de la personne, ceux de sa connexion et le mandat de l'automatisme : Charlie lance « Départ » sur la tablette ; sa lampe s'allume, la porte non, ce n'est pas sa pièce ; depuis la tablette anonyme, la chambre se propose. Autonome, un automatisme a les droits de son responsable dans la limite de son mandat, ou son seul mandat s'il est adopté par le foyer : « Sonnette ouvre » est à revoir tant que personne n'a accepté qu'un bouton que tout le monde peut presser ouvre la porte ; accepté par Bob, il ouvre ; Alice partie, sa « Nuit » est refusée et mise à revoir. En bas, quatre cartes : le manifeste, le bail, l'exécution, les rafales.</desc>
  <style>.hd-flux{stroke-dasharray:1.5 11;stroke-linecap:round;animation:hd-flux 1.2s linear infinite}.hd-lent{stroke-dasharray:1.5 13;stroke-linecap:round;animation:hd-lent 2.6s linear infinite}.hd-pouls{animation:hd-pouls 1.6s ease-in-out infinite}@keyframes hd-flux{to{stroke-dashoffset:-12.5}}@keyframes hd-lent{to{stroke-dashoffset:-14.5}}@keyframes hd-pouls{0%,100%{opacity:.3}50%{opacity:1}}@media (prefers-reduced-motion:reduce){.hd-flux,.hd-lent,.hd-pouls{animation:none}}</style>
