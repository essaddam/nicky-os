          <text x="16.0" y="24.0" font-size="11" fill="#52615a" font-weight="700" letter-spacing=".06em">TROIS QUESTIONS POUR CHAQUE ORDRE : QUI LE DEMANDE, POUR QUI, SOUS QUEL MANDAT</text>
