          <text x="60.0" y="73.0" font-size="12" fill="#1b5873" font-weight="700">Le principal : la connexion</text>
          <text x="30.0" y="95.0" font-size="10.2" fill="#52615a">le compte de l'écran, du satellite, de l'agent ;</text>
          <text x="30.0" y="110.0" font-size="10.2" fill="#52615a">ses pièces, sa fin, les classes qu'il commande</text>
          <text x="30.0" y="125.0" font-size="10.2" fill="#52615a">ou propose, la meilleure preuve qu'il sait donner</text>
