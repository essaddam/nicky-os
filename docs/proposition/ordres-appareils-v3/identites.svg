          <text x="60.0" y="317.0" font-size="12" fill="#4b3d82" font-weight="700">Le mandat d'un automatisme</text>
          <text x="30.0" y="339.0" font-size="10.2" fill="#52615a">ce que son graphe commande : classes et pièces,</text>
          <text x="30.0" y="354.0" font-size="10.2" fill="#52615a">calculé à la validation ; son responsable, ou le</text>
          <text x="30.0" y="369.0" font-size="10.2" fill="#52615a">foyer s'il l'a adopté (par un propriétaire)</text>
