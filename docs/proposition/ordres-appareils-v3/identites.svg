          <text x="764.0" y="96.0" font-size="13" fill="#ffffff" font-weight="700">Oui</text>
          <text x="764.0" y="112.0" font-size="10" fill="#ffffff" opacity=".9">il part</text>
          <g filter="url(#identites-o2)"><rect x="748.0" y="198.0" width="228" height="58" rx="18" fill="#6f4c08"/><rect x="748.0" y="193.0" width="228" height="58" rx="18" fill="url(#identites-h-ambre)"/></g>
          <rect x="753.0" y="196.0" width="218" height="24.4" rx="14" fill="#ffffff" opacity=".17"/>
          <text x="764.0" y="220.0" font-size="13" fill="#ffffff" font-weight="700">Proposer</text>
          <text x="764.0" y="236.0" font-size="10" fill="#ffffff" opacity=".9">retenu : un humain habilité</text>
          <g filter="url(#identites-o2)"><rect x="748.0" y="322.0" width="228" height="58" rx="18" fill="#682c1a"/><rect x="748.0" y="317.0" width="228" height="58" rx="18" fill="url(#identites-h-rouge)"/></g>
          <rect x="753.0" y="320.0" width="218" height="24.4" rx="14" fill="#ffffff" opacity=".17"/>
          <text x="764.0" y="344.0" font-size="13" fill="#ffffff" font-weight="700">Non</text>
          <text x="764.0" y="360.0" font-size="10" fill="#ffffff" opacity=".9">refusé : « droits »</text>
          <path d="M718 214 C732 214 730 98 746 98" fill="none" stroke="#195744" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#identites-m-vert)"/>
