          <text x="30.0" y="232.0" font-size="10.2" fill="#52615a">d'un agent, ou un indice (une voix) : le confort</text>
          <text x="30.0" y="247.0" font-size="10.2" fill="#52615a">de sa personne, le sensible comme un inconnu</text>
