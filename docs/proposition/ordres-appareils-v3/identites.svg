          <path d="M718 238 C732 238 730 346 746 346" fill="none" stroke="#8b3b22" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#identites-m-rouge)"/>
          <rect x="504.0" y="300.0" width="175.3" height="18.5" rx="9.2" fill="#fae7dd" stroke="#d06a46" stroke-opacity="0.7"/>
          <g transform="translate(510.0 303.2) scale(0.5000)" fill="none" stroke="#8b3b22" stroke-width="4.00" stroke-linecap="round" stroke-linejoin="round"><path d="M6 11h12v10H6z M8.5 11V8a3.5 3.5 0 0 1 7 0v3"/></g>
          <text x="526.0" y="312.7" font-size="9.5" fill="#8b3b22" font-weight="700">désarmer : jamais par ce chemin</text>
          <rect x="504.0" y="326.0" width="189.6" height="18.5" rx="9.2" fill="#fbefd3" stroke="#e0a12a" stroke-opacity="0.7"/>
          <text x="512.0" y="338.7" font-size="9.5" fill="#94660a" font-weight="700">une voix : le confort, jamais le sensible</text>
          <rect x="504.0" y="352.0" width="176.5" height="18.5" rx="9.2" fill="#e1eef6" stroke="#3b8db4" stroke-opacity="0.7"/>
          <text x="512.0" y="364.7" font-size="9.5" fill="#1b5873" font-weight="700">le client ne déclare rien de tout cela</text>
          <rect x="16" y="414" width="968" height="36" rx="12" fill="#e3f1e9" stroke="#3d9a75" stroke-opacity=".5"/>
          <g transform="translate(28.0 422.0) scale(0.8333)" fill="none" stroke="#195744" stroke-width="2.64" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></g>
          <text x="56.0" y="436.0" font-size="11" fill="#1d302a" font-weight="700">Une décision coûte 3,6 ns ; celle du hub pour un ordre de la maison, ses pièces comprises, 30 ns. Les mêmes tables à l'arrivée, à l'approbation, à la remise.</text>
  <text x="18" y="491" font-size="12" fill="#52615a" font-style="italic">Codex résume : droits effectifs = principal ∩ personne (ou « inconnu ») ∩ mandat ∩ contexte ∩ exigences de l'ordre. La v3 le range en trois fiches de</text>
  <text x="18" y="508" font-size="12" fill="#52615a" font-style="italic">taille fixe et une table ; le serveur établit chacune, jamais le client (§ 11).</text>
</svg>
