          <text x="602.0" y="237.0" font-size="10.2" fill="#52615a" text-anchor="middle">et du contexte : une chambre,</text>
          <text x="602.0" y="252.0" font-size="10.2" fill="#52615a" text-anchor="middle">un secours incertain</text>
