<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 514" width="1000" height="514" role="img" aria-labelledby="identites-t identites-d" font-family="Avenir Next, Avenir, Segoe UI, sans-serif">
  <title id="identites-t">Trois identités, une décision</title>
  <desc id="identites-d">À gauche, trois cartes. Le principal, c'est-à-dire la connexion : un profil de 32 octets, ses pièces, sa fin, les classes qu'il commande ou propose, la meilleure preuve qu'il sait donner. La personne, et ce qu'on en sait : une session personnelle, son appli, le mandat d'un agent, ou un simple indice, une voix reconnue, qui vaut sa personne pour le confort et jamais plus qu'un inconnu pour le sensible ; 32 octets. Le mandat d'un automatisme : ce que son graphe commande, son responsable ; 16 octets. Au centre, la décision : le plus petit des trois, et du contexte. À droite, trois issues : oui, il part ; proposer, il est retenu pour un humain habilité ; non, refusé. Désarmer ne passe jamais par ce chemin. Une décision coûte 3,6 nanosecondes.</desc>
  <style>.hd-flux{stroke-dasharray:1.5 11;stroke-linecap:round;animation:hd-flux 1.2s linear infinite}.hd-lent{stroke-dasharray:1.5 13;stroke-linecap:round;animation:hd-lent 2.6s linear infinite}.hd-pouls{animation:hd-pouls 1.6s ease-in-out infinite}@keyframes hd-flux{to{stroke-dashoffset:-12.5}}@keyframes hd-lent{to{stroke-dashoffset:-14.5}}@keyframes hd-pouls{0%,100%{opacity:.3}50%{opacity:1}}@media (prefers-reduced-motion:reduce){.hd-flux,.hd-lent,.hd-pouls{animation:none}}</style>
