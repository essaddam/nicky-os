          <text x="56.0" y="348.0" font-size="11" fill="#1d302a" font-weight="700">Prendre une case et la rendre : 7,3 ns. Retrouver une demande : 0,81 ns. Sa clé pour l'appelant : principal et séquence.</text>
  <text x="18" y="403" font-size="12" fill="#52615a" font-style="italic">La v1 tenait en 64 octets, avec une génération de 16 bits qui faisait le tour, et sans époque (revue B4). La v3 range la personne, sa preuve et le</text>
  <text x="18" y="420" font-size="12" fill="#52615a" font-style="italic">mandat dans la réserve : la fiche ne grandit pas.</text>
