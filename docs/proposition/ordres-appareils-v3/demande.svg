<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 426" width="1000" height="426" role="img" aria-labelledby="demande-t demande-d" font-family="Avenir Next, Avenir, Segoe UI, sans-serif">
  <title id="demande-t">La demande : 72 octets</title>
  <desc id="demande-d">Une fiche de 72 octets : le premier paramètre, la séquence de l'appelant, l'échéance monotone, l'heure d'arrivée, la demande mère, le numéro de l'ordre, qui demande, la génération, la forme d'admission, le principal, puis l'état, l'issue, l'origine, la raison, les compteurs d'un groupe, les drapeaux, la preuve qu'on a de la personne et l'époque ; enfin la personne pour qui elle est faite et le mandat d'un automatisme, dans les octets que la v2 réservait. Son numéro : 16 bits de case, 16 d'époque, 32 de génération. Une issue tardive de la génération 6, ou de l'ancien actif, arrive quand la génération 7 occupe la case : elle est écartée. Prendre une case et la rendre : 7,3 ns ; retrouver une demande : 0,81 ns.</desc>
  <style>.hd-flux{stroke-dasharray:1.5 11;stroke-linecap:round;animation:hd-flux 1.2s linear infinite}.hd-lent{stroke-dasharray:1.5 13;stroke-linecap:round;animation:hd-lent 2.6s linear infinite}.hd-pouls{animation:hd-pouls 1.6s ease-in-out infinite}@keyframes hd-flux{to{stroke-dashoffset:-12.5}}@keyframes hd-lent{to{stroke-dashoffset:-14.5}}@keyframes hd-pouls{0%,100%{opacity:.3}50%{opacity:1}}@media (prefers-reduced-motion:reduce){.hd-flux,.hd-lent,.hd-pouls{animation:none}}</style>
