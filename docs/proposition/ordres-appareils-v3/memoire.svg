          <text x="282.9" y="404.5" font-size="10.5" fill="#ffffff" font-weight="700">proposé</text>
  <text x="18" y="449" font-size="12" fill="#52615a" font-style="italic">Le témoin d'aujourd'hui suit la convention des pilotes (revue I15) ; chaque poste proposé est mesuré par le compteur d'allocations ou par size_of</text>
  <text x="18" y="466" font-size="12" fill="#52615a" font-style="italic">(I18). Les répliques d'aujourd'hui restent au mieux : ni les canaux de Tokio, ni les tâches, ni la sérialisation ne sont comptés.</text>
</svg>
