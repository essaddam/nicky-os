          <text x="424.0" y="280.0" font-size="10" fill="#195744" font-weight="700">rien : lu dans les colonnes</text>
          <text x="16.0" y="316.0" font-size="10.8" fill="#1d302a" font-weight="700">Ce qu'un écran charge, à contenu égal (transfert)</text>
