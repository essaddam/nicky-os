          <text x="56.0" y="396.0" font-size="11" fill="#1d302a" font-weight="700">Aucune cible permise : refusé, sans rien annoncer. Un automatisme qui a perdu une cible : refusé, et mis à revoir.</text>
  <text x="18" y="451" font-size="12" fill="#52615a" font-style="italic">Ton choix (§ 22) : ni refusé en bloc, ni exécuté en partie d'office. Le banc le prouve (un_groupe_avec_une_cible_interdite_annonce_le_sous_ensemble,</text>
  <text x="18" y="468" font-size="12" fill="#52615a" font-style="italic">un_automatisme_ne_choisit_pas_de_sous_ensemble).</text>
</svg>
