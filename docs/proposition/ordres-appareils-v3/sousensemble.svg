<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 474" width="1000" height="474" role="img" aria-labelledby="sousensemble-t sousensemble-d" font-family="Avenir Next, Avenir, Segoe UI, sans-serif">
  <title id="sousensemble-t">Un groupe, une cible interdite</title>
  <desc id="sousensemble-d">En haut à gauche, la demande : Charlie, son PIN tapé sur la tablette, demande « allume la maison », un groupe de trois cibles ; ses pièces sont le salon et sa chambre. Au milieu, les trois cibles : le salon, permis ; le bureau, interdit, ce n'est pas sa pièce ; sa chambre, permise. À droite, la carte annoncée : « 2 cibles permises sur 3 : confirmer le sous-ensemble » ; seule Charlie choisit, depuis sa connexion ou un écran avec sa preuve ; un adulte ne choisit pas pour elle ; la carte vit dix minutes. En bas, trois suites : elle confirme, le salon et sa chambre s'allument, le bureau jamais, ou elle renonce, et rien ne part ; son agent confirme, sa chambre se propose parce que le canal est gardé, et Bob l'approuve sur une carte neuve, car confirmer n'est pas approuver ; le groupe change pendant le choix : une cible ajoutée, ce qui a été montré part, et seulement cela ; une cible montrée retirée, le sous-ensemble du moment est à choisir de nouveau. Un bandeau : aucune cible permise, refusé sans rien annoncer ; un automatisme qui a perdu une cible est refusé et mis à revoir.</desc>
  <style>.hd-flux{stroke-dasharray:1.5 11;stroke-linecap:round;animation:hd-flux 1.2s linear infinite}.hd-lent{stroke-dasharray:1.5 13;stroke-linecap:round;animation:hd-lent 2.6s linear infinite}.hd-pouls{animation:hd-pouls 1.6s ease-in-out infinite}@keyframes hd-flux{to{stroke-dashoffset:-12.5}}@keyframes hd-lent{to{stroke-dashoffset:-14.5}}@keyframes hd-pouls{0%,100%{opacity:.3}50%{opacity:1}}@media (prefers-reduced-motion:reduce){.hd-flux,.hd-lent,.hd-pouls{animation:none}}</style>
