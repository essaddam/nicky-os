<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" width="1000" height="350" role="img" aria-labelledby="prive-t prive-d" font-family="Avenir Next, Avenir, Segoe UI, sans-serif">
  <title id="prive-t">Ce que voit chacun</title>
  <desc id="prive-d">Trois colonnes. ord/, val/ et meta/, que lisent tous les lecteurs d'une pièce : l'ordre, la valeur, l'issue, l'heure, la dernière commande et sa preuve, jamais qui, ni pour qui. Le pair seul, par le canal privé : les droits par leur nom, les sessions, l'identité de chaque trace, les exécutions du moteur, les textes privés. Un écran : les appareils de ses pièces, ses propres dernières commandes marquées « miennes », les retenues qu'il peut décider, rien de l'identité des autres.</desc>
  <style>.hd-flux{stroke-dasharray:1.5 11;stroke-linecap:round;animation:hd-flux 1.2s linear infinite}.hd-lent{stroke-dasharray:1.5 13;stroke-linecap:round;animation:hd-lent 2.6s linear infinite}.hd-pouls{animation:hd-pouls 1.6s ease-in-out infinite}@keyframes hd-flux{to{stroke-dashoffset:-12.5}}@keyframes hd-lent{to{stroke-dashoffset:-14.5}}@keyframes hd-pouls{0%,100%{opacity:.3}50%{opacity:1}}@media (prefers-reduced-motion:reduce){.hd-flux,.hd-lent,.hd-pouls{animation:none}}</style>
