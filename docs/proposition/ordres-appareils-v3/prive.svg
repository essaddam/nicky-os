          <text x="16.0" y="24.0" font-size="11" fill="#52615a" font-weight="700" letter-spacing=".06em">CE QUE CHACUN VOIT : CE QUI S'EST PASSÉ, À TOUS ; QUI L'A FAIT, AU PAIR ET À SOI</text>
