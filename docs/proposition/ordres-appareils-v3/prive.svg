          <text x="56.0" y="272.0" font-size="11" fill="#1d302a" font-weight="700">Lire l'état d'un appareil et lire qui l'a commandé sont deux droits ; l'audit nominatif est réservé à qui le propriétaire désigne (§ 22).</text>
  <text x="18" y="327" font-size="12" fill="#52615a" font-style="italic">Aujourd'hui, le journal nomme l'acteur en texte libre et le flux SSE le montre à tout le foyer (§ 5.4). La v3 sépare l'état commun de l'audit</text>
  <text x="18" y="344" font-size="12" fill="#52615a" font-style="italic">nominatif sur le même flux MQTT (revue D8).</text>
