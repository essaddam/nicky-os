          <text x="54.0" y="76.5" font-size="13" fill="#ffffff" font-weight="700">ord/, val/, meta/</text>
          <text x="316.0" y="76.5" font-size="10" fill="#ffffff" text-anchor="end" opacity=".9">tous les lecteurs d'une pièce</text>
