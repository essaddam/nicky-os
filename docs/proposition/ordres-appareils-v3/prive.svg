          <text x="710.0" y="76.5" font-size="13" fill="#ffffff" font-weight="700">Un écran</text>
          <text x="972.0" y="76.5" font-size="10" fill="#ffffff" text-anchor="end" opacity=".9">son état, filtré</text>
