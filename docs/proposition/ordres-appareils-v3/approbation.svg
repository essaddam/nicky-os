          <text x="728.0" y="77.0" font-size="12" fill="#195744" font-weight="700">Décidée, une fois</text>
          <text x="698.0" y="99.0" font-size="10.2" fill="#52615a">la révision vue, puis consommée :</text>
          <text x="698.0" y="114.0" font-size="10.2" fill="#52615a">le même clic rejoué ne vaut rien ;</text>
          <text x="698.0" y="129.0" font-size="10.2" fill="#52615a">une carte renouvelée (ses cibles</text>
          <text x="698.0" y="144.0" font-size="10.2" fill="#52615a">ont changé) a sa révision neuve</text>
          <text x="698.0" y="159.0" font-size="10.2" fill="#52615a"></text>
          <text x="698.0" y="174.0" font-size="10.2" fill="#52615a">tout revérifié : l'échéance, les</text>
          <text x="698.0" y="189.0" font-size="10.2" fill="#52615a">droits du demandeur, la forme,</text>
          <text x="698.0" y="204.0" font-size="10.2" fill="#52615a">les cibles</text>
          <text x="698.0" y="219.0" font-size="10.2" fill="#52615a"></text>
          <text x="698.0" y="234.0" font-size="10.2" fill="#52615a">au journal : la décision au nom</text>
          <text x="698.0" y="249.0" font-size="10.2" fill="#52615a">d'Alice, pas de l'agent</text>
