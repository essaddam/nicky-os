          <text x="56.0" y="394.0" font-size="11" fill="#1d302a" font-weight="700">Sur un secours aux droits incertains, seul un propriétaire approuve le sensible ; il confirme ensuite les droits, d'un geste.</text>
  <text x="18" y="449" font-size="12" fill="#52615a" font-style="italic">Aujourd'hui, toute session PIN décide de toute retenue (resolve_approval ne vérifie que l'origine ui) et le journal ne nomme pas l'approbateur (§</text>
  <text x="18" y="466" font-size="12" fill="#52615a" font-style="italic">5.4). La v3 sépare « approuver » de « commander » (revue D3, D4, M2).</text>
