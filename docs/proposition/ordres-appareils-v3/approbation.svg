<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 472" width="1000" height="472" role="img" aria-labelledby="approbation-t approbation-d" font-family="Avenir Next, Avenir, Segoe UI, sans-serif">
  <title id="approbation-t">L'approbation habilitée</title>
  <desc id="approbation-d">À gauche, une retenue : un agent veut tirer le pêne de la porte d'entrée, classe accès, pièce 5 ; sa carte porte la révision 7 ; elle vit dix minutes. Au milieu, cinq candidats. Un agent ou un satellite : non, ce n'est pas un écran. La tablette sans session : non, aucune preuve personnelle. Charlie avec son PIN : non, un enfant n'approuve pas un accès. Alice sur son téléphone : oui, une adulte approuve l'accès. Bob sur son écran : oui, le propriétaire. À droite, la décision : la révision vue est consommée, le même clic rejoué ne vaut rien, une carte renouvelée a sa révision neuve ; tout est revérifié ; au journal, la décision est au nom d'Alice. En bas : sur un secours aux droits incertains, seul un propriétaire approuve le sensible.</desc>
  <style>.hd-flux{stroke-dasharray:1.5 11;stroke-linecap:round;animation:hd-flux 1.2s linear infinite}.hd-lent{stroke-dasharray:1.5 13;stroke-linecap:round;animation:hd-lent 2.6s linear infinite}.hd-pouls{animation:hd-pouls 1.6s ease-in-out infinite}@keyframes hd-flux{to{stroke-dashoffset:-12.5}}@keyframes hd-lent{to{stroke-dashoffset:-14.5}}@keyframes hd-pouls{0%,100%{opacity:.3}50%{opacity:1}}@media (prefers-reduced-motion:reduce){.hd-flux,.hd-lent,.hd-pouls{animation:none}}</style>
