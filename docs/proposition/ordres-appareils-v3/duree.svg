          <text x="56.0" y="432.0" font-size="11" fill="#1d302a" font-weight="700">À l'arrivée, à l'approbation, et au dernier point avant l'envoi ; la fin d'une personne ou d'un compte est une échéance : le hub s'y réveille sans battement.</text>
  <text x="18" y="487" font-size="12" fill="#52615a" font-style="italic">La v2 vérifiait le permis à l'arrivée et à l'approbation, et retirait des voies ; une commande encore dans le hub pouvait partir après une révocation</text>
  <text x="18" y="504" font-size="12" fill="#52615a" font-style="italic">(revue D6), et la fin d'un permis attendait un battement (D7).</text>
