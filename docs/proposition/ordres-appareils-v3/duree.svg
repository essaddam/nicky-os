<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510" width="1000" height="510" role="img" aria-labelledby="duree-t duree-d" font-family="Avenir Next, Avenir, Segoe UI, sans-serif">
  <title id="duree-t">La durée des droits</title>
  <desc id="duree-d">Trois frises. Une demande, puis une révocation : Alice allume, la demande est admise ; Alice est révoquée avant que rien ne parte ; à la remise au module, les droits sont revérifiés ; la demande n'est pas envoyée, cause droits. Un appui et l'accusé du secours : le « volume + » attend l'accusé ; Alice est révoquée avant ; l'appui est retiré de l'attente tout de suite, et ne part jamais, même si l'accusé arrive. Une invitation qui finit : à 18 h 39, l'invité propose d'arrêter l'imprimante ; la retenue a dix minutes ; à 18 h 40, sa fin est une échéance du hub ; la retenue est refusée à la seconde, pas à 18 h 49.</desc>
  <style>.hd-flux{stroke-dasharray:1.5 11;stroke-linecap:round;animation:hd-flux 1.2s linear infinite}.hd-lent{stroke-dasharray:1.5 13;stroke-linecap:round;animation:hd-lent 2.6s linear infinite}.hd-pouls{animation:hd-pouls 1.6s ease-in-out infinite}@keyframes hd-flux{to{stroke-dashoffset:-12.5}}@keyframes hd-lent{to{stroke-dashoffset:-14.5}}@keyframes hd-pouls{0%,100%{opacity:.3}50%{opacity:1}}@media (prefers-reduced-motion:reduce){.hd-flux,.hd-lent,.hd-pouls{animation:none}}</style>
