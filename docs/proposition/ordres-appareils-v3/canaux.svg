          <text x="56.0" y="470.0" font-size="11" fill="#1d302a" font-weight="700">Une connexion n'est pas une personne : la tablette garde son compte quand Charlie tape son PIN, et redevient anonyme à la fin de la session.</text>
  <text x="18" y="525" font-size="12" fill="#52615a" font-style="italic">Ce que le code d'aujourd'hui prouve, canal par canal, est au § 5.4 : la session PIN est commune et liée à l'appelant, la voix n'a pas de locuteur, MCP</text>
  <text x="18" y="542" font-size="12" fill="#52615a" font-style="italic">n'a pas de personne. La v3 range la preuve à côté de la personne, et décide avec.</text>
