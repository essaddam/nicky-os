<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 548" width="1000" height="548" role="img" aria-labelledby="canaux-t canaux-d" font-family="Avenir Next, Avenir, Segoe UI, sans-serif">
  <title id="canaux-t">Chaque canal, et ce qu'il prouve</title>
  <desc id="canaux-d">Dix lignes. La tablette partagée ne prouve personne, sauf une session personnelle de quelques minutes. L'appli ou le navigateur personnels prouvent leur personne. Le satellite vocal donne au mieux un indice : une voix reconnue vaut sa personne pour le confort, et le sensible se confirme sur un écran. L'assistant, depuis un écran, porte l'autorité de cet écran. Un agent MCP ou un script : un mandat du serveur, ou aucune personne ; le texte « pour Alice » n'accorde rien. Un bouton : aucune personne ; ouvrir par un bouton est une décision explicite. Le clavier d'alarme : le code, par le chemin privé de l'alarme. Un automatisme : un mandat. Un invité : sa personne, datée. Le hub : ses propres gestes, sans personne implicite.</desc>
  <style>.hd-flux{stroke-dasharray:1.5 11;stroke-linecap:round;animation:hd-flux 1.2s linear infinite}.hd-lent{stroke-dasharray:1.5 13;stroke-linecap:round;animation:hd-lent 2.6s linear infinite}.hd-pouls{animation:hd-pouls 1.6s ease-in-out infinite}@keyframes hd-flux{to{stroke-dashoffset:-12.5}}@keyframes hd-lent{to{stroke-dashoffset:-14.5}}@keyframes hd-pouls{0%,100%{opacity:.3}50%{opacity:1}}@media (prefers-reduced-motion:reduce){.hd-flux,.hd-lent,.hd-pouls{animation:none}}</style>
