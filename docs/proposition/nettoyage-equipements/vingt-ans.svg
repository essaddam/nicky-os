<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 398" width="1000" height="398" role="img" aria-labelledby="vingt-ans-t vingt-ans-d" font-family="Avenir Next, Avenir, Segoe UI, sans-serif">
  <title id="vingt-ans-t">Vingt ans de la maison : les places, selon la règle</title>
  <desc id="vingt-ans-d">Un graphique sur vingt ans, maison ×1, avec quatre grandes refontes marquées. Sans jamais libérer, les places montent par marches jusqu'à 11 063. Avec les lots, elles suivent le pic et plafonnent à 3 611. Avec un déménagement après chaque refonte, les fiches restent à 2 390, au niveau des points en service (2 278). À droite, la mémoire au bout de vingt ans : 2,2 Mo, 0,49 Mo et 0,40 Mo à ×1 ; 18 Mo, 4,9 Mo et 4,0 Mo à ×10.</desc>
  <style>.hd-flux{stroke-dasharray:1.5 11;stroke-linecap:round;animation:hd-flux 1.2s linear infinite}.hd-lent{stroke-dasharray:1.5 13;stroke-linecap:round;animation:hd-lent 2.6s linear infinite}.hd-pouls{animation:hd-pouls 1.6s ease-in-out infinite}@keyframes hd-flux{to{stroke-dashoffset:-12.5}}@keyframes hd-lent{to{stroke-dashoffset:-14.5}}@keyframes hd-pouls{0%,100%{opacity:.3}50%{opacity:1}}@media (prefers-reduced-motion:reduce){.hd-flux,.hd-lent,.hd-pouls{animation:none}}</style>
