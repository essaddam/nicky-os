          <text x="75.0" y="72.0" font-size="13" fill="#ffffff" font-weight="700">Retirer</text>
          <text x="75.0" y="88.0" font-size="10" fill="#ffffff" opacity=".9">au fil de l'eau, un geste</text>
          <rect x="25" y="122" width="290" height="124" rx="12" fill="url(#rythmes-f-ambre)" stroke="#e0a12a" stroke-opacity=".55" stroke-width="1.1" filter="url(#rythmes-o)"/>
          <circle cx="40" cy="141" r="4.5" fill="url(#rythmes-h-ambre)"/>
          <text x="52.0" y="145.0" font-size="11.5" fill="#94660a" font-weight="700">Ce qu'il fait</text>
          <text x="39.0" y="163.0" font-size="10.4" fill="#52615a">plus lu, plus commandé</text>
          <text x="39.0" y="178.0" font-size="10.4" fill="#52615a">attentes et minuteries terminées</text>
          <text x="39.0" y="193.0" font-size="10.4" fill="#52615a">ses automatismes « à revoir »</text>
          <text x="39.0" y="208.0" font-size="10.4" fill="#52615a">rien n'est libéré : réversible</text>
          <rect x="93.8" y="258.0" width="152.5" height="19.0" rx="9.5" fill="#fbefd3" stroke="#e0a12a" stroke-opacity="0.7"/>
          <text x="101.8" y="271.1" font-size="10" fill="#94660a" font-weight="700">une sortie critique, au rang s</text>
