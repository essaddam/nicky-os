          <g transform="translate(28.0 300.0) scale(0.8333)" fill="none" stroke="#195744" stroke-width="2.64" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></g>
          <text x="56.0" y="314.0" font-size="11" fill="#1d302a" font-weight="700">Le numéro entier n'est jamais redonné : seule la place se réutilise, à la génération suivante.</text>
  <text x="18" y="369" font-size="12" fill="#52615a" font-style="italic">Retirer ne libère rien et reste réversible ; le lot libère et réutilise ; le déménagement, rare, rend la mémoire. Durées mesurées au banc (Linux musl,</text>
  <text x="18" y="386" font-size="12" fill="#52615a" font-style="italic">2 CPU, 128 Mio, médiane de trois essais).</text>
