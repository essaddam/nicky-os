<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 392" width="1000" height="392" role="img" aria-labelledby="rythmes-t rythmes-d" font-family="Avenir Next, Avenir, Segoe UI, sans-serif">
  <title id="rythmes-t">Trois rythmes : retirer, libérer, déménager</title>
  <desc id="rythmes-d">Trois étapes de gauche à droite. Retirer, au fil de l'eau, par un geste : l'appareil n'est plus lu ni commandé, ses attentes et minuteries sont terminées, ses automatismes passent à revoir, rien n'est libéré et le retrait reste réversible ; c'est une sortie critique au rang s. Trente jours plus tard, le lot de nuit libère : fiches remises à zéro, nom effacé, génération suivante, avec l'instantané de la nuit ; les appareils neufs reprennent la place ; 29 µs à ×1. Au-delà d'un seuil, en fin de refonte, le déménagement resserre les fiches ; tout ce qui cite un numéro suit, l'empreinte par les noms ne bouge pas, la mémoire est rendue ; 113 µs à ×1.</desc>
  <style>.hd-flux{stroke-dasharray:1.5 11;stroke-linecap:round;animation:hd-flux 1.2s linear infinite}.hd-lent{stroke-dasharray:1.5 13;stroke-linecap:round;animation:hd-lent 2.6s linear infinite}.hd-pouls{animation:hd-pouls 1.6s ease-in-out infinite}@keyframes hd-flux{to{stroke-dashoffset:-12.5}}@keyframes hd-lent{to{stroke-dashoffset:-14.5}}@keyframes hd-pouls{0%,100%{opacity:.3}50%{opacity:1}}@media (prefers-reduced-motion:reduce){.hd-flux,.hd-lent,.hd-pouls{animation:none}}</style>
