          <text x="712.0" y="145.0" font-size="11.5" fill="#1b5873" font-weight="700">Ce qu'il fait</text>
          <text x="699.0" y="163.0" font-size="10.4" fill="#52615a">les fiches descendent vers le bas</text>
          <text x="699.0" y="178.0" font-size="10.4" fill="#52615a">tout ce qui cite un numéro suit</text>
          <text x="699.0" y="193.0" font-size="10.4" fill="#52615a">l'empreinte par les noms ne bouge pas</text>
          <text x="699.0" y="208.0" font-size="10.4" fill="#52615a">la mémoire est rendue</text>
          <rect x="772.8" y="258.0" width="114.4" height="19.0" rx="9.5" fill="#e1eef6" stroke="#3b8db4" stroke-opacity="0.7"/>
          <text x="780.8" y="271.1" font-size="10" fill="#1b5873" font-weight="700">113 µs à ×1 · 16 Ko</text>
