          <text x="16.0" y="24.0" font-size="11" fill="#52615a" font-weight="700" letter-spacing=".06em">TROIS RYTHMES, COMME UNE MAISON FAIT SON MÉNAGE</text>
          <g filter="url(#rythmes-o2)"><rect x="25.0" y="50.0" width="290" height="58" rx="18" fill="#6f4c08"/><rect x="25.0" y="45.0" width="290" height="58" rx="18" fill="url(#rythmes-h-ambre)"/></g>
