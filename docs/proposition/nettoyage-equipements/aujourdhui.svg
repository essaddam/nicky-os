<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 475" width="1000" height="475" role="img" aria-labelledby="aujourdhui-t aujourdhui-d" font-family="Avenir Next, Avenir, Segoe UI, sans-serif">
  <title id="aujourdhui-t">Aujourd'hui, quand un appareil sort</title>
  <desc id="aujourdhui-d">Un capteur sort : l'intégration ne le donne plus, et son pilote appelle remove_device. Le hub retire ses valeurs, sa disponibilité et sa définition, et publie DeviceRemoved. Trois défauts : les automatismes qui le citent restent approuvés et ne partent plus, sans trace ; un compteur d'énergie continue de compter sa dernière puissance ; un remplaçant est refusé parce que l'ancien reste connu. Six orphelins restent pour toujours : l'étiquette, l'état restauré, le plan et l'accueil, les aides, l'historique sous son nom, la clé Tuya au coffre. Une intégration retirée de la configuration n'est ni rechargée ni retirée ; remplacer un appareil est impossible.</desc>
  <style>.hd-flux{stroke-dasharray:1.5 11;stroke-linecap:round;animation:hd-flux 1.2s linear infinite}.hd-lent{stroke-dasharray:1.5 13;stroke-linecap:round;animation:hd-lent 2.6s linear infinite}.hd-pouls{animation:hd-pouls 1.6s ease-in-out infinite}@keyframes hd-flux{to{stroke-dashoffset:-12.5}}@keyframes hd-lent{to{stroke-dashoffset:-14.5}}@keyframes hd-pouls{0%,100%{opacity:.3}50%{opacity:1}}@media (prefers-reduced-motion:reduce){.hd-flux,.hd-lent,.hd-pouls{animation:none}}</style>
