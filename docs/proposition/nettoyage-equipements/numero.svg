          <text x="716.0" y="315.0" font-size="11.5" fill="#1b5873" font-weight="700">Sur MQTT, « i » = le numéro entier</text>
          <text x="686.0" y="337.0" font-size="10" fill="#52615a">inconnu d'un abonné : il redemande meta/</text>
  <text x="18" y="391" font-size="12" fill="#52615a" font-style="italic">Le numéro entier n'est jamais redonné ; seule la place se réutilise. C'est la forme des identifiants d'entité des moteurs de jeu (EnTT : 20 bits</text>
  <text x="18" y="408" font-size="12" fill="#52615a" font-style="italic">d'entité, 12 de version).</text>
