          <text x="388.0" y="315.0" font-size="11.5" fill="#4b3d82" font-weight="700">L'ancien numéro est inerte</text>
          <text x="358.0" y="337.0" font-size="10" fill="#52615a">1 234 ne désigne plus rien : génération 0</text>
