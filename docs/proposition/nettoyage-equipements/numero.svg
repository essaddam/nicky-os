<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 414" width="1000" height="414" role="img" aria-labelledby="numero-t numero-d" font-family="Avenir Next, Avenir, Segoe UI, sans-serif">
  <title id="numero-t">Le numéro : une place et sa génération</title>
  <desc id="numero-d">En haut, les 32 bits du numéro : le bit 31 reste réservé aux marques de cause ; les bits 24 à 30 portent la génération, de 0 à 127 ; les bits 0 à 23 la place, de 0 à 16 777 215, qui est l'adresse de la fiche. Au milieu, une place et deux occupants : génération 0, numéro 1 234, l'ancien capteur du salon ; il est retiré, le nom reste pour pouvoir annuler ; le lot efface le nom, remet à zéro et passe à la génération 1 ; le nouveau capteur prend la même place sous le numéro 16 778 450. En bas : l'adresse reste place fois taille ; l'ancien numéro est inerte ; sur MQTT, i porte le numéro entier, et un abonné qui ne le connaît pas redemande meta/.</desc>
  <style>.hd-flux{stroke-dasharray:1.5 11;stroke-linecap:round;animation:hd-flux 1.2s linear infinite}.hd-lent{stroke-dasharray:1.5 13;stroke-linecap:round;animation:hd-lent 2.6s linear infinite}.hd-pouls{animation:hd-pouls 1.6s ease-in-out infinite}@keyframes hd-flux{to{stroke-dashoffset:-12.5}}@keyframes hd-lent{to{stroke-dashoffset:-14.5}}@keyframes hd-pouls{0%,100%{opacity:.3}50%{opacity:1}}@media (prefers-reduced-motion:reduce){.hd-flux,.hd-lent,.hd-pouls{animation:none}}</style>
