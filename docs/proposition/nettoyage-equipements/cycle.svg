          <path d="M250 306 C320 290 360 248 400 232" fill="none" stroke="#8b3b22" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#cycle-m-rouge)"/>
          <text x="330.0" y="298.0" font-size="10" fill="#8b3b22" font-weight="700" text-anchor="middle" paint-order="stroke" stroke="#fffdf8" stroke-width="4" stroke-linejoin="round">30 jours absent : un rappel,</text>
          <text x="330.0" y="312.0" font-size="10" fill="#8b3b22" font-weight="700" text-anchor="middle" paint-order="stroke" stroke="#fffdf8" stroke-width="4" stroke-linejoin="round">puis un geste</text>
          <path d="M470 190 C430 128 330 112 252 112" fill="none" stroke="#94660a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4" marker-end="url(#cycle-m-ambre)"/>
