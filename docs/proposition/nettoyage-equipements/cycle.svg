          <text x="16.0" y="24.0" font-size="11" fill="#52615a" font-weight="700" letter-spacing=".06em">LE CYCLE D'UNE PLACE : QUI LA FAIT PASSER D'UN ÉTAT À L'AUTRE</text>
          <path d="M118 150 L118 288" fill="none" stroke="#94660a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#cycle-m-ambre)"/>
          <text x="110.0" y="214.0" font-size="10" fill="#94660a" font-weight="700" text-anchor="end" paint-order="stroke" stroke="#fffdf8" stroke-width="4" stroke-linejoin="round">l'intégration</text>
          <text x="110.0" y="228.0" font-size="10" fill="#94660a" font-weight="700" text-anchor="end" paint-order="stroke" stroke="#fffdf8" stroke-width="4" stroke-linejoin="round">ne le donne plus</text>
          <path d="M182 288 L182 150" fill="none" stroke="#195744" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#cycle-m-vert)"/>
          <text x="190.0" y="214.0" font-size="10" fill="#195744" font-weight="700" paint-order="stroke" stroke="#fffdf8" stroke-width="4" stroke-linejoin="round">il revient :</text>
          <text x="190.0" y="228.0" font-size="10" fill="#195744" font-weight="700" paint-order="stroke" stroke="#fffdf8" stroke-width="4" stroke-linejoin="round">tout est là</text>
