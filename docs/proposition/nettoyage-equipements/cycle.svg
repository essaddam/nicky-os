          <path class="hd-flux" d="M600 206 C650 170 700 140 748 128" fill="none" stroke="#ffffff" stroke-opacity=".95" stroke-width="1.3"/>
          <text x="672.0" y="186.0" font-size="10" fill="#195744" font-weight="700" text-anchor="middle" paint-order="stroke" stroke="#fffdf8" stroke-width="4" stroke-linejoin="round">le lot, après</text>
          <text x="672.0" y="200.0" font-size="10" fill="#195744" font-weight="700" text-anchor="middle" paint-order="stroke" stroke="#fffdf8" stroke-width="4" stroke-linejoin="round">le délai de grâce</text>
          <path d="M850 92 C850 52 160 52 150 90" fill="none" stroke="#1b5873" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#cycle-m-bleu)"/>
          <text x="500.0" y="46.0" font-size="10" fill="#1b5873" font-weight="700" text-anchor="middle" paint-order="stroke" stroke="#fffdf8" stroke-width="4" stroke-linejoin="round">un appareil neuf : la même place, un nouveau numéro (génération + 1)</text>
          <path d="M850 150 L850 288" fill="none" stroke="#4f5d57" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3" marker-end="url(#cycle-m-gris)"/>
          <text x="858.0" y="214.0" font-size="10" fill="#4f5d57" font-weight="700" paint-order="stroke" stroke="#fffdf8" stroke-width="4" stroke-linejoin="round">127e génération</text>
