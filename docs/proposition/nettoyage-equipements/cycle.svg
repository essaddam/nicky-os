          <text x="802.0" y="118.0" font-size="13" fill="#ffffff" font-weight="700">Libre</text>
          <text x="802.0" y="134.0" font-size="10" fill="#ffffff" opacity=".9">nom effacé, à zéro</text>
          <g filter="url(#cycle-o2)"><rect x="752.0" y="295.0" width="196" height="56" rx="18" fill="#3b4641"/><rect x="752.0" y="290.0" width="196" height="56" rx="18" fill="url(#cycle-h-gris)"/></g>
          <rect x="757.0" y="293.0" width="186" height="23.5" rx="14" fill="#ffffff" opacity=".17"/>
          <circle cx="779.0" cy="318.0" r="15" fill="#ffffff" opacity=".2"/>
          <g transform="translate(770.0 309.0) scale(0.7500)" fill="none" stroke="#ffffff" stroke-width="2.53" stroke-linecap="round" stroke-linejoin="round"><path d="M6 11h12v10H6z M8.5 11V8a3.5 3.5 0 0 1 7 0v3"/></g>
          <text x="802.0" y="316.0" font-size="13" fill="#ffffff" font-weight="700">Condamnée</text>
          <text x="802.0" y="332.0" font-size="10" fill="#ffffff" opacity=".9">ne sert plus</text>
          <rect x="398" y="262" width="204" height="74" rx="12" fill="url(#cycle-f-rouge)" stroke="#d06a46" stroke-opacity=".55" stroke-width="1.1" filter="url(#cycle-o)"/>
          <circle cx="413" cy="281" r="4.5" fill="url(#cycle-h-rouge)"/>
          <text x="425.0" y="285.0" font-size="11" fill="#8b3b22" font-weight="700">Pendant la grâce</text>
          <text x="412.0" y="303.0" font-size="10" fill="#52615a">la place garde son nom ;</text>
          <text x="412.0" y="318.0" font-size="10" fill="#52615a">l'écran dit « remplacé par … »</text>
          <rect x="16" y="364" width="968" height="36" rx="12" fill="#fbefd3" stroke="#e0a12a" stroke-opacity=".5"/>
          <g transform="translate(28.0 372.0) scale(0.8333)" fill="none" stroke="#94660a" stroke-width="2.64" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12h5l2-5 3 10 2-5h8"/></g>
          <text x="56.0" y="386.0" font-size="11" fill="#1d302a" font-weight="700">Absent n'est pas retiré : un pont qui redémarre ne casse rien. Retirer est un geste, réversible jusqu'au lot.</text>
  <text x="18" y="441" font-size="12" fill="#52615a" font-style="italic">Chaque passage est une sortie critique au rang s, décidée par l'actif et rejouée par les copies. Seul le lot libère, et seulement après le délai de</text>
  <text x="18" y="458" font-size="12" fill="#52615a" font-style="italic">grâce.</text>
