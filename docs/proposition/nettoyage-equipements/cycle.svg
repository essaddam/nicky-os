<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 464" width="1000" height="464" role="img" aria-labelledby="cycle-t cycle-d" font-family="Avenir Next, Avenir, Segoe UI, sans-serif">
  <title id="cycle-t">Le cycle d'un équipement</title>
  <desc id="cycle-d">Cinq états. En service : lu et commandé. Absent, quand l'intégration ne le donne plus : tout est gardé, et il revient tout seul. Retiré, par un geste (retirer, remplacer), ou après trente jours d'absence, sur un rappel puis un geste : plus lu ni commandé ; pendant le délai de grâce la place garde son nom, et le retrait peut être annulé. Libre, après le lot : nom effacé, fiches à zéro ; un appareil neuf y prend un nouveau numéro, à la génération suivante. Condamnée, après la 127e génération.</desc>
  <style>.hd-flux{stroke-dasharray:1.5 11;stroke-linecap:round;animation:hd-flux 1.2s linear infinite}.hd-lent{stroke-dasharray:1.5 13;stroke-linecap:round;animation:hd-lent 2.6s linear infinite}.hd-pouls{animation:hd-pouls 1.6s ease-in-out infinite}@keyframes hd-flux{to{stroke-dashoffset:-12.5}}@keyframes hd-lent{to{stroke-dashoffset:-14.5}}@keyframes hd-pouls{0%,100%{opacity:.3}50%{opacity:1}}@media (prefers-reduced-motion:reduce){.hd-flux,.hd-lent,.hd-pouls{animation:none}}</style>
