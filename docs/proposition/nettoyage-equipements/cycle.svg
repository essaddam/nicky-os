          <text x="102.0" y="316.0" font-size="13" fill="#ffffff" font-weight="700">Absent</text>
          <text x="102.0" y="332.0" font-size="10" fill="#ffffff" opacity=".9">tout est gardé</text>
          <g filter="url(#cycle-o2)"><rect x="402.0" y="195.0" width="196" height="56" rx="18" fill="#682c1a"/><rect x="402.0" y="190.0" width="196" height="56" rx="18" fill="url(#cycle-h-rouge)"/></g>
