<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 415" width="1000" height="415" role="img" aria-labelledby="succession-t succession-d" font-family="Avenir Next, Avenir, Segoe UI, sans-serif">
  <title id="succession-t">Remplacer un appareil : la succession</title>
  <desc id="succession-d">À gauche, l'ancien capteur, retiré ; à droite, le nouveau, en service. Leurs points s'apparient par la clé (temperature, humidity, battery), nature et unité vérifiées. En dessous, ce qui passe au nouveau : les automatismes, récrits par les noms ; l'étiquette et la pièce ; le plan et l'accueil ; le compteur d'énergie. Une seule validation humaine vaut pour chaque automatisme récrit. L'ancien reste retiré pendant la grâce, avec « remplacé par … », puis le lot libère sa place ; l'historique garde deux courbes.</desc>
  <style>.hd-flux{stroke-dasharray:1.5 11;stroke-linecap:round;animation:hd-flux 1.2s linear infinite}.hd-lent{stroke-dasharray:1.5 13;stroke-linecap:round;animation:hd-lent 2.6s linear infinite}.hd-pouls{animation:hd-pouls 1.6s ease-in-out infinite}@keyframes hd-flux{to{stroke-dashoffset:-12.5}}@keyframes hd-lent{to{stroke-dashoffset:-14.5}}@keyframes hd-pouls{0%,100%{opacity:.3}50%{opacity:1}}@media (prefers-reduced-motion:reduce){.hd-flux,.hd-lent,.hd-pouls{animation:none}}</style>
