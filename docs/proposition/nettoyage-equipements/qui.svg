<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 534" width="1000" height="534" role="img" aria-labelledby="qui-t qui-d" font-family="Avenir Next, Avenir, Segoe UI, sans-serif">
  <title id="qui-t">Qui garde un numéro, et ce que chacun en fait</title>
  <desc id="qui-d">Quatre zones. Recompilé, jamais périmé : le programme, les conditions composées, les fiches horaires portées par une valeur. Vérifie la génération : les exécutions (cause et cible), les attentes à durée revérifiées à l'échéance, les minuteries, baux et l'écran des exécutions finies, pour qui une référence périmée est inerte. Suit le rang s : la file des 10 000 sorties, l'état complet et l'instantané (annuaire, générations, places libres), les abonnés internes, qui redemandent meta/ pour un numéro inconnu. Ne garde que des noms : la base et l'archive, le journal d'exécution et l'audit, les clients extérieurs.</desc>
  <style>.hd-flux{stroke-dasharray:1.5 11;stroke-linecap:round;animation:hd-flux 1.2s linear infinite}.hd-lent{stroke-dasharray:1.5 13;stroke-linecap:round;animation:hd-lent 2.6s linear infinite}.hd-pouls{animation:hd-pouls 1.6s ease-in-out infinite}@keyframes hd-flux{to{stroke-dashoffset:-12.5}}@keyframes hd-lent{to{stroke-dashoffset:-14.5}}@keyframes hd-pouls{0%,100%{opacity:.3}50%{opacity:1}}@media (prefers-reduced-motion:reduce){.hd-flux,.hd-lent,.hd-pouls{animation:none}}</style>
