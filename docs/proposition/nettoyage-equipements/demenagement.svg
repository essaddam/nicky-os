<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" role="img" aria-labelledby="demenagement-t demenagement-d" font-family="Avenir Next, Avenir, Segoe UI, sans-serif">
  <title id="demenagement-t">Le déménagement : resserrer les colonnes</title>
  <desc id="demenagement-d">En haut, une rangée de places après un lot : des trous dispersés, et au bout les derniers appareils venus. Chaque fiche glisse vers le bas, dans l'ordre : les lignes la suivent jusqu'à sa nouvelle place, sans jamais se croiser ; celles qui ne bougent pas restent droites. En bas, la rangée serrée, et la queue rendue à la mémoire. Ce qui suit chaque point déménagé : exécutions, attentes, minuteries, baux, la file des exécutions finies ; le programme se recompile, la vérité des conditions composées se reconstruit. La preuve : l'empreinte par les noms est identique, une exécution en cours commande le bon appareil, une attente en cours part à l'heure. Mesuré : 1 971 mouvements à ×1 en 113 µs, 193 125 à ×100 en 9,0 ms.</desc>
  <style>.hd-flux{stroke-dasharray:1.5 11;stroke-linecap:round;animation:hd-flux 1.2s linear infinite}.hd-lent{stroke-dasharray:1.5 13;stroke-linecap:round;animation:hd-lent 2.6s linear infinite}.hd-pouls{animation:hd-pouls 1.6s ease-in-out infinite}@keyframes hd-flux{to{stroke-dashoffset:-12.5}}@keyframes hd-lent{to{stroke-dashoffset:-14.5}}@keyframes hd-pouls{0%,100%{opacity:.3}50%{opacity:1}}@media (prefers-reduced-motion:reduce){.hd-flux,.hd-lent,.hd-pouls{animation:none}}</style>
