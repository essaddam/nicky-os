  <text x="18" y="457" font-size="12" fill="#52615a" font-style="italic">Chaque point déménagé prend la génération de sa nouvelle place, et la place quittée passe à la suivante : aucun numéro entier n'est redonné. Les</text>
  <text x="18" y="474" font-size="12" fill="#52615a" font-style="italic">points d'un appareil restent ensemble.</text>
