          <text x="16.0" y="24.0" font-size="11" fill="#52615a" font-weight="700" letter-spacing=".06em">LIRE UNE VALEUR AU HASARD, PAR SON NUMÉRO (NS)</text>
          <text x="16.0" y="58.0" font-size="11" fill="#1d302a" font-weight="700">le numéro est l'adresse (v2)</text>
          <text x="330.0" y="73.0" font-size="9" fill="#52615a" text-anchor="end">×1</text>
