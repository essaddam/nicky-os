          <text x="330.0" y="163.0" font-size="9" fill="#52615a" text-anchor="end">×100</text>
          <rect x="338.0" y="154.0" width="285.5" height="10" rx="5.0" fill="url(#lecture-b-vert)" opacity=".6"/>
          <rect x="340.0" y="156.0" width="281.5" height="3.8" rx="4.0" fill="#ffffff" opacity=".2"/>
