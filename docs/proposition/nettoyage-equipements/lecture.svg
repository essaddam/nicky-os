<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 358" width="1000" height="358" role="img" aria-labelledby="lecture-t lecture-d" font-family="Avenir Next, Avenir, Segoe UI, sans-serif">
  <title id="lecture-t">Lire une valeur : ce que coûte la génération</title>
  <desc id="lecture-d">Quatre façons de lire une valeur au hasard, à ×1, ×10 et ×100, en nanosecondes. Le numéro est l'adresse (la v2) : 0,36, 0,54, 0,59. La place tirée du numéro : 0,40, 0,54, 0,61. La place, génération vérifiée : 0,52, 0,66, 0,92. Un numéro fixe par une table : 0,44, 0,81, 0,97.</desc>
  <style>.hd-flux{stroke-dasharray:1.5 11;stroke-linecap:round;animation:hd-flux 1.2s linear infinite}.hd-lent{stroke-dasharray:1.5 13;stroke-linecap:round;animation:hd-lent 2.6s linear infinite}.hd-pouls{animation:hd-pouls 1.6s ease-in-out infinite}@keyframes hd-flux{to{stroke-dashoffset:-12.5}}@keyframes hd-lent{to{stroke-dashoffset:-14.5}}@keyframes hd-pouls{0%,100%{opacity:.3}50%{opacity:1}}@media (prefers-reduced-motion:reduce){.hd-flux,.hd-lent,.hd-pouls{animation:none}}</style>
