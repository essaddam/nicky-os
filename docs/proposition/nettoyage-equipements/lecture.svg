          <rect x="340.0" y="271.0" width="377.0" height="3.8" rx="4.0" fill="#ffffff" opacity=".2"/>
          <text x="725.0" y="278.0" font-size="9.5" fill="#4f5d57" font-weight="700">0,81</text>
          <text x="330.0" y="291.0" font-size="9" fill="#52615a" text-anchor="end">×100</text>
          <rect x="338.0" y="282.0" width="452.2" height="10" rx="5.0" fill="url(#lecture-b-gris)" opacity=".6"/>
          <rect x="340.0" y="284.0" width="448.2" height="3.8" rx="4.0" fill="#ffffff" opacity=".2"/>
          <text x="796.2" y="291.0" font-size="9.5" fill="#4f5d57" font-weight="700">0,97</text>
  <text x="18" y="335" font-size="12" fill="#52615a" font-style="italic">La génération ne se vérifie qu'aux endroits qui gardent un numéro longtemps ; le programme, recompilé à chaque lot, lit par la place seule. Médiane de</text>
  <text x="18" y="352" font-size="12" fill="#52615a" font-style="italic">trois essais, Linux musl.</text>
