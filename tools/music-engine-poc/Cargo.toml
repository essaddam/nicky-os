[package]
name = "moli-music-engine-poc"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[workspace]

[dependencies]
anyhow = "1"
getrandom = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
symphonia = { version = "=0.6.1", default-features = false, features = ["wav", "pcm", "flac"] }
tempfile = "3"

[profile.release]
opt-level = "s"
lto = "thin"
strip = "debuginfo"
