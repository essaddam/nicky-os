[package]
name = "moli-music-poc"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
base64 = "0.23"
bytes = "1.10"
getrandom = "0.4"
futures-util = "0.3"
http-body = "1"
p256 = { version = "=0.13.2", features = ["ecdsa", "pem"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream", "query"] }
rumqttc = { version = "0.25", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
subtle = "2"
symphonia = { version = "=0.6.1", default-features = false, features = ["flac", "wav", "pcm"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "time", "sync", "process", "signal", "fs"] }
tokio-util = { version = "0.7", features = ["rt"] }
zeroize = "1"

[dev-dependencies]
symphonia-bundle-flac = "=0.6.1"
symphonia-core = "=0.6.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
opt-level = "s"
lto = "thin"
strip = "debuginfo"
