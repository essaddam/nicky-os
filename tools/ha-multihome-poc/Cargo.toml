[package]
name = "moli-ha-multihome-poc"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[features]
plain-timing = []

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
bytes = "1"
rumqttc = { version = "0.25", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "net", "io-util", "io-std", "fs", "process", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
