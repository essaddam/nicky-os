[package]
name = "moli-module-host-poc"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[features]
plain-timing = []

[dependencies]
anyhow = "1"
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
jiff = "0.2"
moli-core = { path = "../../crates/moli-core" }
moli-ariston = { path = "../../crates/moli-ariston" }
moli-i18n = { path = "../../crates/moli-i18n" }
moli-music-engine-poc = { path = "../music-engine-poc" }
moli-overkiz = { path = "../../crates/moli-overkiz" }
rumqttc = { version = "0.25", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "net", "io-util", "io-std", "process", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "1"

[[bin]]
name = "moli-master-poc"
path = "src/master.rs"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = "debuginfo"
