[package]
name = "banc-haute-dispo"
version = "0.1.0"
edition = "2024"
publish = false

# Le banc de l'étude haute disponibilité (docs/proposition/haute-disponibilite.md), hors workspace.
# Il reprend tels quels, par inclusion de fichiers (`#[path]`), la maison, la mémoire des valeurs et
# les outils du banc mémoire (tools/memoire-banc) : la réplique tient la même mémoire que la v2.
# Aucune dépendance aux crates de Sarah Home ; toutes celles-ci sont déjà dans le registre local.
[workspace]

[dependencies]
# La table de l'annuaire (valeurs.rs du banc mémoire).
hashbrown = "0.17"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "sync", "macros", "net", "io-util"] }
# Le courtier de la V7, sans TLS ni WebSocket (comme le banc courtier de la V7).
rumqttd = { version = "0.20", default-features = false }
rumqttc = { version = "0.25", default-features = false }
serde_json = "1"
bytes = "1"
crc32fast = "1"
sha2 = "0.10"
chacha20poly1305 = "0.10"
lz4_flex = { version = "0.13", default-features = false, features = ["std", "safe-encode", "safe-decode"] }

[profile.release]
# Comme la production (Cargo.toml du dépôt).
opt-level = "s"
lto = "fat"
codegen-units = 1
