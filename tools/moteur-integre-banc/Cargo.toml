[package]
name = "moli-moteur-integre-banc"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[features]
plain-timing = []

[dependencies]
anyhow = "1"
moli-core = { path = "../../crates/moli-core" }
moli-runtime = { path = "../../crates/moli-runtime" }
moli-automation = { path = "../../crates/moli-automation" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }

[[bin]]
name = "moteur-integre-banc"
path = "src/main.rs"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = "debuginfo"
