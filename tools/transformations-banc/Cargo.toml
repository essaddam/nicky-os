[package]
name = "transformations-banc"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "transformations-banc"

[[bin]]
name = "index-memory"
path = "src/index_memory.rs"

[workspace]

[dependencies]
moli-core = { path = "../../crates/moli-core" }
moli-profile = { path = "../../crates/moli-profile" }
moli-z2m = { path = "../../crates/moli-z2m" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1

