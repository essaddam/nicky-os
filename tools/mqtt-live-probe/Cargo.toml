[package]
name = "moli-mqtt-live-probe"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[features]
plain-timing = []

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "ws"] }
base64 = "0.22"
bytes = "1"
futures-util = { version = "0.3", features = ["sink"] }
hmac = "0.12"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
moli-core = { path = "../../crates/moli-core" }
moli-automation = { path = "../../crates/moli-automation" }
moli-runtime = { path = "../../crates/moli-runtime" }
moli-overkiz = { path = "../../crates/moli-overkiz" }
moli-z2m = { path = "../../crates/moli-z2m" }
rumqttc = { version = "0.25", default-features = false }
rustix = { version = "1.1.5", default-features = false, features = ["std", "termios", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "process", "fs", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }

[dev-dependencies]
tokio-tungstenite = "0.29"

[[bin]]
name = "mqtt-live-probe"
path = "src/main.rs"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = "debuginfo"
