[package]
name = "moli-voltalis"
description = "Moli OS Voltalis: pilot-wire heaters (regime, preset, setpoint) and programs through the Voltalis cloud, orders sent once and confirmed by what reads back; the water heater relay is read only."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
moli-i18n.workspace = true
moli-core.workspace = true
moli-runtime.workspace = true
moli-net.workspace = true
anyhow.workspace = true
http.workspace = true
http-body-util.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
rcgen = { version = "=0.13.2", default-features = false, features = ["ring"] }
rustls.workspace = true
tokio-rustls.workspace = true
hyper = { workspace = true, features = ["server"] }
hyper-util.workspace = true
moli-net = { workspace = true, features = ["contract-test"] }
tokio-util.workspace = true

[lints]
workspace = true
